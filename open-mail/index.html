<!DOCTYPE html>
<html>
<head>
  <meta name="fused-app">
<meta charset="utf-8">
<title>Open Mail</title>
<script>
// Theme before first paint: a flash of the wrong palette is worse than any
// millisecond this costs. Runs synchronously in <head>, before <body> exists.
(function () {
  var t = null;
  try { t = localStorage.getItem("fused.mail.theme"); } catch (e) {}
  if (t !== "light" && t !== "dark")
    t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<script>document.write('<link rel="stylesheet" href="' + fused.rawUrl("mail.css") + '">');</script>
</head>
<body>

<div id="sidebar">
  <button id="composebtn"></button>
  <div id="labels"></div>
  <div id="accounts"></div>
  <div id="aibar">
    <button id="aitoggle"><span class="sw"></span><span class="lbl-text">AI features</span></button>
    <button id="settingsbtn" title="Settings" aria-label="Settings"></button>
  </div>
</div>

<div id="listpane">
  <div class="searchwrap">
    <div class="searchpill">
      <span class="search-ic" aria-hidden="true">
        <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      </span>
      <input id="search" placeholder="Search mail" spellcheck="false" aria-label="Search mail">
    </div>
    <button class="icon-btn" id="refreshbtn" aria-label="Refresh"></button>
  </div>
  <div id="list"><div class="spin">Loading…</div></div>
</div>

<div id="splitbar" aria-hidden="true"></div>

<div id="threadpane">
  <div id="landing"><div class="land-empty"><p id="placeholder">Select a conversation</p></div></div>
</div>

<div id="onboard" hidden>
  <div class="onb-card">
    <div class="onb-mark" aria-hidden="true"></div>
    <h1>Welcome to Mail</h1>
    <p>Connect your Gmail to read, search and reply — everything stays on this machine.</p>
    <button class="btn-primary pill" id="onb-connect">Connect Gmail</button>
    <p class="onb-note">
      Gmail needs a 16-character <b>app password</b> (or OAuth) — your normal password won't work.
      Nothing is uploaded; the credential is stored in <code>~/.fused-mail</code>.
    </p>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="sendstatus" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span id="sendstatus-msg">Sending…</span></div>

<script>
"use strict";
const PY = "./mail.py";
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let state = { accounts: [], labels: [], threads: [], nextToken: "", thread: null, hasCreds: false };
let listReq = 0, threadReq = 0;

// ---------- icons ----------
// Every glyph is inline SVG: the page loads zero external resources (no font
// CDN, no icon sheet), which is a hard requirement for the exporter.
const ICON = {
  inbox: `<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>`,
  star: `<path d="M12 2.6l2.9 5.88 6.49.95-4.7 4.58 1.11 6.46L12 17.42l-5.8 3.05 1.11-6.46-4.7-4.58 6.49-.95L12 2.6z"/>`,
  send: `<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>`,
  draft: `<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8M16 17H8M10 9H8"/>`,
  report: `<path d="M7.86 2h8.28L22 7.86v8.28L16.14 22H7.86L2 16.14V7.86L7.86 2z"/><path d="M12 8v4M12 16h.01"/>`,
  trash: `<path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>`,
  important: `<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>`,
  tag: `<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><path d="M7 7h.01"/>`,
  archive: `<path d="M21 8v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8"/><path d="M2 3h20v5H2z"/><path d="M10 12h4"/>`,
  mail: `<path d="M4 5h16c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V7c0-1.1.9-2 2-2z"/><path d="M22 7l-10 7L2 7"/>`,
  mailopen: `<path d="M2 10l10-6 10 6v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"/><path d="M2 10l10 7 10-7"/>`,
  /* Gmail's mark-as-unread: a closed envelope whose top-right corner yields
     to a solid notification dot. */
  mailunread: `<path d="M22 10.5V17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h10.5"/><path d="M22 7.5L12 14 2 7"/><circle cx="19.5" cy="4.5" r="2.7" fill="currentColor" stroke="none"/>`,
  refresh: `<path d="M21 4v6h-6"/><path d="M3 20v-6h6"/><path d="M4.6 9a8 8 0 0 1 13.2-3L21 10"/><path d="M3 14l3.2 3A8 8 0 0 0 19.4 15"/>`,
  search: `<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>`,
  moon: `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`,
  sun: `<circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.2M12 20.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M1.5 12h2.2M20.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/>`,
  sparkle: `<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"/><path d="M18.5 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>`,
  pencil: `<path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>`,
  close: `<path d="M18 6L6 18M6 6l12 12"/>`,
  back: `<path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>`,
  folderin: `<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><path d="M8 13h7"/><path d="M12.5 10.5L15 13l-2.5 2.5"/>`,
  reply: `<path d="M9 15L4 10l5-5"/><path d="M20 20v-6a4 4 0 0 0-4-4H4.5"/>`,
  check: `<path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="M22 4L12 14l-3-3"/>`,
  gear: `<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>`,
};
const svg = (name, size, extra) =>
  `<svg class="ic" width="${size || 18}" height="${size || 18}" viewBox="0 0 24 24" fill="none" ` +
  `stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ` +
  `aria-hidden="true"${extra || ""}>${ICON[name] || ""}</svg>`;

// ---------- theme ----------
const THEME_KEY = "fused.mail.theme";
const curTheme = () => document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
// Instant, never animated — a cross-fade between palettes reads as a flash.
// Lives in the Settings modal (gear, lower left).
function toggleTheme() {
  const next = curTheme() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
}

// ---------- params ----------
// `?account=demo` is a test-only backdoor (never rendered in the UI); with no
// ?account the app opens the first connected account, else onboarding.
// Test hook: ?onboarding=1 pretends nothing is connected.
const forceOnboard = () => fused.params.get("onboarding") === "1";
const realAccounts = () => forceOnboard() ? [] : state.accounts.filter(a => a.provider !== "demo");
const defaultAccount = () => { const r = realAccounts()[0]; return r ? r.email : ""; };
const P = {
  get account() { return fused.params.get("account") || defaultAccount(); },
  get label()   { return fused.params.get("label") || "INBOX"; },
  get q()       { return fused.params.get("q") || ""; },
  get thread()  { return fused.params.get("thread") || ""; },
  get manage()  { return fused.params.get("manage") === "1"; },
};
const isOnboarding = () => forceOnboard() || (!P.account && !realAccounts().length);
function setParam(k, v) { fused.params.set(k, String(v == null ? "" : v)); pushHistory(); }

// ---------- history ----------
// fused.params.set() writes the URL with replaceState, so the browser Back
// button skips straight out of the app instead of walking back through the
// threads/labels you opened. Mirror each batch of param writes into a real
// history entry (state carries the snapshot; Back/Forward replays it).
const HIST_KEYS = ["account", "label", "q", "thread", "manage"];
function snapParams() {
  const o = {};
  for (const k of HIST_KEYS) { const v = fused.params.get(k); if (v) o[k] = v; }
  return o;
}
let restoringHistory = false;
let histQueued = false;
// Handlers set several params in a row; coalesce them into one entry per tick
// so one click never costs three presses of Back.
function pushHistory() {
  if (restoringHistory || histQueued) return;
  histQueued = true;
  queueMicrotask(() => {
    histQueued = false;
    const snap = snapParams();
    const cur = history.state && history.state.mailParams;
    if (cur && JSON.stringify(cur) === JSON.stringify(snap)) return;
    try { history.pushState({ mailParams: snap }, "", location.href); } catch (e) {}
  });
}
try { history.replaceState({ mailParams: snapParams() }, "", location.href); } catch (e) {}
window.addEventListener("popstate", e => {
  const snap = (e.state && e.state.mailParams) || {};
  restoringHistory = true;
  // Clear-then-set every tracked key, so params absent from the target state
  // (e.g. a thread opened after this entry) actually go away.
  try { for (const k of HIST_KEYS) fused.params.set(k, snap[k] || ""); }
  finally { restoringHistory = false; }
});

// ---------- helpers ----------
// toast(msg) — plain notice; toast(msg, {label, fn}) adds one action (Undo)
// and doubles the timeout so the action stays reachable.
function toast(msg, action) {
  const t = $("#toast");
  t.textContent = msg;
  if (action) {
    const b = document.createElement("button");
    b.textContent = action.label;
    b.addEventListener("click", () => { t.style.display = "none"; action.fn(); });
    t.appendChild(b);
  }
  t.style.display = "flex";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.style.display = "none", action ? 6000 : 2600);
}
function fmtDate(ms) {
  const d = new Date(ms), now = new Date();
  if (d.toDateString() === now.toDateString())
    return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  if (d.getFullYear() === now.getFullYear())
    return d.toLocaleDateString([], { month: "short", day: "numeric" });
  return d.toLocaleDateString([], { year: "numeric", month: "short", day: "numeric" });
}
function fromName(from) {
  const m = /^"?([^"<]*)"?\s*<.*>$/.exec(from || "");
  return (m ? m[1].trim() : from) || "(unknown)";
}
// Avatar colour is a pure function of the address, so the same person is the
// same colour everywhere and across reloads. Only the hue varies — saturation
// and lightness are pinned to values that keep the initial at 4.5:1 on its own
// disc in BOTH palettes (worst case, yellow: 4.85 light / 5.58 dark).
function hueOf(s) {
  let h = 0;
  const v = String(s || "").toLowerCase();
  for (let i = 0; i < v.length; i++) h = (h * 31 + v.charCodeAt(i)) | 0;
  return Math.abs(h) % 360;
}
function initialOf(name) {
  const c = (String(name || "").trim().replace(/^[^\p{L}\p{N}]+/u, "")[0] || "?");
  return c.toUpperCase();
}
// Serialize engine calls: concurrent runPython to the same .py can orphan a response,
// leaving its promise hung forever. One call in flight at a time.
//
// PRIORITY: background work (warming thread bodies, precomputing triage) shares
// this one channel with everything the user is waiting on. A single IMAP
// get_thread can take seconds, so a queue full of them used to sit in front of
// the click that opened the triage board — the board showed "Reading the
// inbox" until the whole warm sweep drained. Background callers now pass
// {bg:true} and yield: they wait for the foreground to go quiet before taking
// the channel, so a user action is behind at most ONE in-flight call.
let pyQueue = Promise.resolve();
let pyFg = 0;                      // foreground calls queued or in flight
function py(params, opts) {
  if (opts && opts.bg) return pyBg(params);
  pyFg++;
  const run = () => fused.runPython(PY, params);
  const p = pyQueue.then(run, run);
  pyQueue = p.catch(() => {});
  p.then(() => pyFg--, () => pyFg--);
  return p;
}
// Background call: park until nothing foreground is waiting, then queue.
async function pyBg(params) {
  while (pyFg > 0) await new Promise(r => setTimeout(r, 60));
  const run = () => fused.runPython(PY, params);
  const p = pyQueue.then(run, run);
  pyQueue = p.catch(() => {});
  return p;
}

// Background sends run OUTSIDE the pyQueue: an SMTP send (attachments, slow
// network) can take many seconds, and queued behind it every click in the UI
// would appear frozen. `key: null` opts out of the runtime's stale-cancel so
// the send always runs to completion, concurrent with queued calls.
let sendsInFlight = 0;
function sendStatus() {
  const el = $("#sendstatus");
  if (!el) return;
  if (sendsInFlight > 0) {
    $("#sendstatus-msg").textContent =
      sendsInFlight === 1 ? "Sending…" : `Sending ${sendsInFlight} messages…`;
    el.style.display = "flex";
  } else el.style.display = "none";
}
function sendInBackground(params, onDone, onError) {
  sendsInFlight++; sendStatus();
  fused.runPython(PY, params, { key: null })
    .then(res => {
      // mail.py reports expected failures as {error}, not an exception.
      if (res && res.error) throw new Error(res.error);
      onDone(res);
    })
    .catch(e => onError(e))
    .finally(() => { sendsInFlight--; sendStatus(); });
}

// ---------- AI (local only — see spec 2026-08-03-mail-ai-scope.md) ----------
// fused.ai runs the local claude CLI, so it exists only in the shell. Any page
// containing the call is refused by the exporter (SPEC RH-11) — this app is
// deliberately local-only, so we call it directly rather than gating on env.
const AI_KEY = "fused.mail.ai";           // opt-in flag
// v2: the prompt changed to one-bullet summaries — a new key orphans the old
// long-form entries instead of showing them alongside fresh short ones.
const AI_CACHE = "fused.mail.ai.summaries.v2";
const AI_DRAFTS = "fused.mail.ai.drafts";
const AI_DIGEST = "fused.mail.ai.digest";
const SUMMARY_PROMPT =
  "You summarize email threads for a busy reader in one glance. Reply with ONE short bullet " +
  "starting '- ' — the single thing that matters now, telegram-brief, no full sentences " +
  "needed. If (and only if) the thread asks something of someone, add one 'Action: ' line " +
  "naming the owner and the ask. No preamble, no headings, no restating the subject, no " +
  "background or pleasantries. Under 25 words total. " +
  // Marketing mail is mostly tracking URLs; pasting one dumps 300 unreadable
  // characters into a 60-word card. Name the destination instead.
  "NEVER paste a URL, link or raw email address — refer to a link by where it goes " +
  "(\"the Vanta link\", \"the invoice link\") and to a person by name.";
const DRAFT_PROMPT =
  "You draft email replies in the voice of the person replying. Match the thread's register. " +
  "Output ONLY the reply body — no subject, no 'Here is a draft', no signature block beyond " +
  "a first name if one fits. NEVER open with meta commentary about the task or a reaction to " +
  "these instructions ('I'll draft a brief follow-up…', 'Sure, here's…', 'Perfect, that makes " +
  "sense.', 'Got it, here's a draft:') — the first word must already be the email itself, and " +
  "there must be no '---' divider or blank-line break between an intro and the reply. " +
  "NEVER address a question to the user asking what to write or for more detail " +
  "('What would you like to say?', 'Let me know if you'd like me to adjust this') — this " +
  "text goes straight into the reply box, unread by anyone but the recipient, so make every " +
  "reasonable assumption yourself and write the most plausible reply. " +
  "If the thread looks fragmented, truncated or confusing, do NOT say so and do NOT ask " +
  "which message to reply to — silently reply to the newest message with your best guess. " +
  "End with a bare first name on its own line if a sign-off fits — never a closing word like " +
  "'Thanks,' or 'Best,' before it. " +
  "Keep it under 120 words unless the thread demands detail.";

// Personal AI instructions from Settings (tone, sign-off, language…). Appended
// to the drafting prompts so every suggested reply and fix follows them.
const AI_PERSONA_KEY = "fused.mail.ai.persona";
function personaText() {
  try { return (localStorage.getItem(AI_PERSONA_KEY) || "").trim(); } catch (e) { return ""; }
}
function withPersona(prompt) {
  const p = personaText();
  return p ? prompt + "\n\nThe user's personal instructions for how they write — follow them " +
    "(they win over the style defaults above, but never justify meta commentary or questions " +
    "to the user):\n" + p : prompt;
}

const FIX_PROMPT =
  "You revise a selected passage from an email draft according to an instruction. " +
  "Output ONLY the revised passage — no quotes, no commentary, no explanation. " +
  "NEVER ask a question or request clarification: your output replaces the passage " +
  "verbatim, so anything that is not the revised text corrupts the draft. If the " +
  "instruction is vague ('fix it', 'make it better'), improve grammar, clarity and " +
  "flow yourself and return your best revision. " +
  "Keep the register of the draft, and preserve the passage's leading/trailing " +
  "whitespace and line structure so it splices back cleanly.";

const DIGEST_PROMPT =
  "You brief a busy reader on their unread email in one glance. You get numbered unread " +
  "emails (sender, subject, snippet). Write at most 5 short bullets, most important first. " +
  "Start every bullet with exactly ONE number in square brackets — the single most relevant " +
  "email — like '[2] Marcus flagged the GPU budget'. The number is an internal anchor the " +
  "reader never sees, so NEVER put a second bracket number anywhere in the text; when a " +
  "bullet covers several emails, name them in words ('three Sentry alerts'). Group routine " +
  "mail (newsletters, receipts, notifications) into one bullet. Under 80 words, no preamble, " +
  "no headings. NEVER paste a URL or raw email address — name the sender or the destination " +
  "in words instead.";

let aiOn = localStorage.getItem(AI_KEY) === "1";
let aiBroken = false;   // set when the CLI is missing, so we stop retrying
let onboardingNow = false;   // no account connected → the welcome card owns the app

// One tiny cache per derived artifact, all keyed (thread id : last message id)
// so any new message invalidates, and all dropped together on disconnect.
function readStore(key) { try { return JSON.parse(localStorage.getItem(key) || "{}"); } catch (e) { return {}; } }
function storeGet(key, t) {
  const last = t.messages[t.messages.length - 1];
  return readStore(key)[t.id + ":" + last.id];
}
function storePut(key, t, text) {
  const last = t.messages[t.messages.length - 1];
  const c = readStore(key);
  c[t.id + ":" + last.id] = text;
  const keys = Object.keys(c);
  if (keys.length > 200) delete c[keys[0]];   // crude cap; entries are small
  try { localStorage.setItem(key, JSON.stringify(c)); } catch (e) {}
}
const cacheGet = t => storeGet(AI_CACHE, t);
const cachePut = (t, x) => storePut(AI_CACHE, t, x);
function clearAiStores() {
  try { [AI_CACHE, AI_DRAFTS, AI_DIGEST, "fused.mail.manage.v1", "fused.mail.manage.rules"].forEach(k => localStorage.removeItem(k)); } catch (e) {}
}
// The account's own address — replyTarget-style comparisons need it, and the
// demo account signs as you@demo.test rather than its account id.
const myAddr = () => (P.account === "demo" ? "you@demo.test" : P.account).toLowerCase();

// HTML mail → readable text. Dropping <style>/<script> bodies matters twice
// over: their contents used to reach the model as prompt (a newsletter is
// mostly CSS) and to leak into the collapsed-message preview.
function stripHtml(html) {
  return String(html || "")
    .replace(/<(script|style)\b[^>]*>[\s\S]*?<\/\1>/gi, " ")
    .replace(/<[^>]*>/g, " ")
    .replace(/&nbsp;/g, " ").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
    .replace(/&quot;/g, '"').replace(/&#39;|&apos;/g, "'")
    .replace(/&(?:#\d+|#x[0-9a-fA-F]+|[a-zA-Z]{2,8});/g, " ")
    .replace(/&amp;/g, "&");
}
// Send the thread, not the mailbox: trimmed bodies, newest-last, capped.
function threadToText(t, limit) {
  const msgs = t.messages.slice(-8);
  return "Subject: " + t.subject + "\n\n" + msgs.map(m =>
    "From: " + m.from + "\n" +
    (m.to ? "To: " + m.to + "\n" : "") +
    (m.body_text || stripHtml(m.body_html)).replace(/\s+\n/g, "\n").trim().slice(0, limit || 1500)
  ).join("\n\n---\n\n");
}

function aiFailText(err) {
  if (err.type === "ai_unavailable") { aiBroken = true; return "AI unavailable — " + err.message; }
  return (err.type || "error") + ": " + err.message;
}

// Settings (gear, lower left): personal instructions for AI replies — tone,
// sign-off, language. Saving invalidates cached drafts so the new voice takes
// effect immediately, including in the thread currently open.
function openSettings() {
  const { ov, close } = modal(`
    <div class="modal" style="width:520px">
      <h3>Settings</h3>
      <p style="color:var(--fg-muted);margin:0 0 6px"><b>Theme</b></p>
      <button class="btn-secondary" id="set-theme" style="margin:0 0 14px"></button>

async function runSummary(force) {
  const t = state.thread;
  const box = $("#summary");
  if (!t || !box) return;
  const body = $(".sum-body", box);
  const redo = $(".redo", box);

  if (!force) {
    const hit = cacheGet(t);
    if (hit) { box.classList.remove("err"); body.textContent = hit; redo.textContent = "Redo"; return; }
  }
  box.classList.remove("err");
  body.innerHTML = `<span class="dots">Reading the thread</span>`;
  redo.textContent = "";
  const rid = threadReq;   // ignore the answer if the user moved on
  try {
    const res = await fused.ai(threadToText(t), { systemPrompt: SUMMARY_PROMPT, effort: "low" });
    if (rid !== threadReq) return;
    cachePut(t, res.text.trim());
    body.textContent = res.text.trim();
    redo.textContent = "Redo";
  } catch (err) {
    if (rid !== threadReq) return;
    box.classList.add("err");
    body.textContent = aiFailText(err);
    redo.textContent = "Retry";
  }

// Suggested reply: drafts itself when a thread opens (streamed into a ghost
// panel above the reply box), cached like summaries. Click or Tab to take it.
let suggestText = "";
// The prompt forbids meta answers, but they still slip through ("I'd be happy
// to help you draft a reply… could you clarify…"). A draft that talks ABOUT
// replying instead of BEING the reply must never reach the box or the cache.
const META_DRAFT = new RegExp([
  "happy to help you draft", "i need to see the latest message",
  "could you (please )?clarify", "which message (do you|would you like|should i)",
  "the one you want to reply to", "i['’]?ll draft your reply",
  "the thread (seems|looks|appears).{0,20}(fragmented|unclear|confusing|truncated)",
].join("|"), "i");
const badDraft = s => META_DRAFT.test(s || "");
async function autoDraft() {
  const t = state.thread, box = $("#suggest");
  if (!t || !box) return;
  suggestText = "";
  // Every thread gets a suggestion. When I spoke last it's a follow-up nudge,
  // not a reply (an earlier build skipped these — read as "AI is broken").
  const last = t.messages[t.messages.length - 1];
  const lastMine = addrOf(last.from).toLowerCase() === myAddr();
  const ask = lastMine
    ? "\n\nI sent the last message and nothing has come back. Write a brief, natural follow-up I could send to move this along."
    : "\n\nWrite my reply to the latest message.";
  const body = $(".sug-body", box);
  // In-card now: a rebuilt pane can carry a preserved draft the user was typing —
  // don't shove a suggestion above their own words (input clearing re-shows it).
  const busy = !!($("#replytext") && $("#replytext").value.trim());
  // A meta answer cached by an earlier build is treated as a miss and redrafted.
  const hit = storeGet(AI_DRAFTS, t);
  if (hit && !badDraft(hit)) { suggestText = hit; body.textContent = hit; box.hidden = busy; box.dataset.ready = "1"; autosizeReply(); return; }
  box.hidden = busy;
  autosizeReply();   // the card appearing changes the textarea's min-height
  box.dataset.ready = "";
  body.innerHTML = `<span class="dots">Drafting a reply</span>`;
  const rid = threadReq;   // user moved on → drop the stream on the floor
  let acc = "";
  try {
    await fused.ai(threadToText(t) + ask,
      { systemPrompt: withPersona(DRAFT_PROMPT), effort: "low", onChunk: d => {
          if (rid !== threadReq) return;
          acc += d;
          suggestText = acc;      // Tab mid-stream takes what exists so far
          body.textContent = acc;
        } });
    if (rid !== threadReq) return;
    suggestText = acc.trim();
    // Belt-and-braces: the prompt forbids preambles, but strip a stray
    // "I'll draft a brief follow-up…" / "Perfect, that makes sense. Here's…"
    // style opener if one slips through — any first line that's clearly
    // commentary ABOUT the reply rather than the reply itself, optionally
    // followed by a blank line and/or a '---' divider before the real body.
    const lines = suggestText.split("\n");
    if (lines.length > 1 &&
        /\b(draft|reply|follow[- ]?up|message)\b.{0,20}[:.]?\s*$/i.test(lines[0]) &&
        /^(i['’]?ll|here['’]?s|sure|okay|perfect|great|got it|sounds good|that works|no problem|makes sense)\b/i.test(lines[0]))
      suggestText = lines.slice(1).join("\n").trim();
    // A lone '---' divider line near the top separates leftover commentary
    // from the actual body — keep only what comes after the last such divider
    // (also matches one sitting on the very first line, once any preamble
    // line above it has already been stripped).
    const divided = suggestText.replace(/^\s*-{3,}\s*\n/, "\n---\n").split(/\n\s*-{3,}\s*\n/);
    if (divided.length > 1) suggestText = divided[divided.length - 1].trim();
    // Same idea for a trailing "Let me know if you'd like me to adjust this…"
    // style clarifying question — strip a lone closing line asking the user
    // something rather than continuing the email.
    const lines2 = suggestText.split("\n");
    const lastLine = lines2[lines2.length - 1].trim();
    if (lines2.length > 1 && /\?\s*$/.test(lastLine) &&
        /\b(let me know|would you like|do you want|should i|shall i|any (changes|edits|adjustments))\b/i.test(lastLine))
      suggestText = lines2.slice(0, -1).join("\n").trim();
    // A closing word ('Thanks,' / 'Best,' / 'Regards,') stacked above a lone
    // sign-off name is a fuller signature block than the prompt allows —
    // keep just the name.
    const lines3 = suggestText.split("\n");
    if (lines3.length > 1 && /^(thanks|thank you|best|regards|cheers|sincerely|warmly)[,.!]?$/i.test(lines3[lines3.length - 2].trim()) &&
        /^\w+[,.!]?$/.test(lines3[lines3.length - 1].trim()))
      suggestText = lines3.slice(0, -2).concat(lines3[lines3.length - 1]).join("\n").trim();
    if (badDraft(suggestText)) { suggestText = ""; box.hidden = true; autosizeReply(); return; }
    storePut(AI_DRAFTS, t, suggestText);
    body.textContent = suggestText;
    // The user may have started typing while this streamed — stay out of the
    // way now; clearing the box (input handler) brings the suggestion back.
    box.hidden = !!($("#replytext") && $("#replytext").value.trim()) || box.dataset.taken === "1";
    box.dataset.ready = "1";
    autosizeReply();
  } catch (err) {
    if (rid !== threadReq) return;
    if (err.type === "ai_unavailable") aiBroken = true;
    box.hidden = true;   // a failed suggestion is not worth screen space
    autosizeReply();
  }
}
function acceptSuggestion() {
  const box = $("#suggest"), ta = $("#replytext");
  if (!box || box.hidden || !suggestText || badDraft(suggestText) || !ta) return;
  ta.value = suggestText;
  box.hidden = true;
  box.dataset.taken = "1";   // don't resurface if the user later clears the box
  ta.focus();
  autosizeReply();
}

// Select-to-fix: select any part of the reply, type an instruction ("shorter",
// "more formal", "mention Thursday"), and the model rewrites just that span.
// The bar lives under the textarea and only shows while a selection exists.
// Selection offsets are captured on every ta selection event — a textarea
// keeps them while focus moves into the prompt input, so Fix still knows the
// span even though the highlight looks inactive.
function wireFixBar() {
  const bar = $("#fixbar"), ta = $("#replytext");
  if (!bar || !ta) return;
  const inp = $("#fixprompt"), go = $("#fixgo");
  let fs = 0, fe = 0;
  const sync = () => {
    if (bar.classList.contains("busy")) return;
    if (ta.selectionEnd > ta.selectionStart) {
      fs = ta.selectionStart; fe = ta.selectionEnd;
      bar.hidden = false;
    } else if (!bar.contains(document.activeElement)) bar.hidden = true;
  };
  ["select", "keyup", "mouseup"].forEach(ev => ta.addEventListener(ev, sync));
  ta.addEventListener("input", () => { if (!bar.contains(document.activeElement)) bar.hidden = true; });
  async function runFix() {
    const instr = inp.value.trim();
    if (!instr || fe <= fs) return;
    const sel = ta.value.slice(fs, fe);
    bar.classList.add("busy"); inp.disabled = true; go.disabled = true;
    try {
      const res = await fused.ai(
        "Full draft:\n" + ta.value + "\n\nSelected passage:\n" + sel + "\n\nInstruction: " + instr,
        { systemPrompt: withPersona(FIX_PROMPT), effort: "low" });
      // fused.ai resolves to {text} — splicing the object itself printed "[object Object]"
      const txt = String(res.text || "").replace(/\s+$/, sel.match(/\s*$/)[0]);
      ta.setRangeText(txt, fs, fe, "select");
      autosizeReply();
      inp.value = ""; bar.hidden = true;
      ta.focus();
    } catch (err) {
      if (err.type === "ai_unavailable") aiBroken = true;
      toast(aiFailText(err));
    }
    bar.classList.remove("busy"); inp.disabled = false; go.disabled = false;
  }
  go.addEventListener("click", runFix);
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); runFix(); }
    if (e.key === "Escape") { bar.hidden = true; ta.focus(); }
  });
}

// Grows #replytext with its content, Gmail-style, instead of a fixed box —
// height resets to "auto" first so shrinking (e.g. after clearing a draft)
// isn't stuck at the tallest height it ever reached.
function autosizeReply() {
  const ta = $("#replytext");
  if (!ta) return;
  // scrollHeight is floored by the CURRENT min-height (1 line with the
  // suggestion card showing, 2 lines without) — measure with height:auto so
  // the floor, not a stale inline height, wins when the card toggles.
  ta.style.height = "auto";
  ta.style.height = ta.scrollHeight + "px";
}

// ---------- landing briefing ----------
// The unread digest IS the reading pane when nothing is selected. It lives in
// module state (`dg`) and repaints from it — loadThread() rewrites #threadpane
// on every draw, so a DOM reference held across awaits can go stale.
let dgRun = 0;
let dg = { status: "idle", key: "", text: "", unread: [], error: "", count: 0 };
// Reset-to-defaults plus a patch, then repaint — every state change goes here.
function dgSet(patch) {
  dg = { status: "idle", key: "", text: "", unread: [], error: "", count: 0, ...patch };
  paintDigest();
}

function paintDigest() {
  const title = $(".land-title"), sub = $(".land-sub");
  if (title) title.textContent = dg.status === "empty" ? "All caught up" : "While you were away";
  if (sub) {
    sub.textContent = dg.status === "empty" ? "Nothing new needs you right now."
      : dg.count ? dg.count + (dg.count === 1 ? " unread conversation" : " unread conversations")
      : "";
  }
  const panel = $("#digest");
  if (!panel) return;
  const body = $(".dg-body", panel), redo = $(".dg-redo", panel);
  const show = v => { if (redo) redo.hidden = !v; };
  if (dg.status === "empty") {
    body.innerHTML = `<div class="dg-line">Nothing unread — you're caught up.</div>`;
    panel.dataset.ready = "1"; show(false);
  } else if (dg.status === "ready") {
    renderDigest(dg.text, dg.unread); panel.dataset.ready = "1"; show(true);
  } else if (dg.status === "error") {
    body.textContent = dg.error; panel.dataset.ready = ""; show(true);
  } else if (dg.status === "loading") {
    panel.dataset.ready = "";
    if (dg.text) body.textContent = dg.text;
    else body.innerHTML = `<span class="dots">Reading unread mail</span>`;
    show(false);
  } else {
    body.innerHTML = ""; panel.dataset.ready = ""; show(false);
  }
}

async function runDigest(force) {
  if (!aiOn || aiBroken) return;
  const rid = ++dgRun;
  // A silent refresh (landing re-rendered, digest already resolved) must not
  // blink the card back to a spinner before the cache answers.
  const quiet = !force && (dg.status === "ready" || dg.status === "empty");
  if (!quiet) dgSet({ status: "loading", count: dg.count });
  let threads;
  try {
    threads = (P.label === "INBOX" && !P.q && state.threads.length)
      ? state.threads
      : ((await py({ op: "list_threads", account: P.account, label: "INBOX", q: "" })).threads || []);
  } catch (e) {
    if (rid === dgRun) dgSet({ status: "error", error: e.message });
    return;
  }
  if (rid !== dgRun) return;
  const unread = threads.filter(t => t.unread);
  if (!unread.length) return dgSet({ status: "empty" });
  const key = P.account + "|" + unread.map(t => t.id + ":" + t.date).join(",");
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(AI_DIGEST) || "null"); } catch (e) {}
  if (!force && cached && cached.key === key)
    return dgSet({ status: "ready", key, text: cached.text, unread, count: unread.length });
  dgSet({ status: "loading", key, unread, count: unread.length });
  const ctx = unread.map((t, i) => `[${i + 1}] From ${fromName(t.from)} — "${t.subject}": ${t.snippet}`).join("\n");
  let acc = "";
  try {
    await fused.ai("Unread emails:\n" + ctx,
      { systemPrompt: DIGEST_PROMPT, effort: "low",
        onChunk: d => { if (rid !== dgRun) return; acc += d; dg.text = acc; paintDigest(); } });
  } catch (err) {
    if (rid !== dgRun) return;
    if (err.type === "ai_unavailable") {
      aiBroken = true; renderAiToggle();
      dgSet({});
      if (!state.thread) renderLanding();
      return;
    }
    dgSet({ status: "error", key, unread, error: aiFailText(err), count: unread.length });
    return;
  }
  if (rid !== dgRun) return;
  try { localStorage.setItem(AI_DIGEST, JSON.stringify({ key, text: acc })); } catch (e) {}
  dgSet({ status: "ready", key, text: acc, unread, count: unread.length });
}
// The [n] anchors are plumbing, not content: collect every leading ref, strip
// every bracket from the shown text (the model sometimes emits "[7] [8] [17]"
// despite instructions), link the bullet to the first ref that resolves.
function renderDigest(text, unread) {
  const body = $("#digest .dg-body");
  if (!body) return;
  body.innerHTML = text.trim().split("\n").map(line => {
    let rest = line.trim().replace(/^[-•*]\s*/, "");
    if (!rest) return "";
    const refs = [];
    let m;
    while ((m = /^\[(\d+)\]\s*/.exec(rest))) { refs.push(parseInt(m[1], 10)); rest = rest.slice(m[0].length); }
    rest = rest.replace(/\s*\[\d+\]/g, "").trim();          // stray inline refs too
    const t = refs.map(n => unread[n - 1]).find(Boolean);
    if (t) {
      const extra = refs.length > 1 ? ` <span class="dg-n">${refs.length} mails</span>` : "";
      return `<button class="dg-item" data-id="${esc(t.id)}"><span>${esc(rest)}</span>${extra}</button>`;
    }
    return `<div class="dg-line">${esc(rest)}</div>`;
  }).join("");
}
// The briefing lives inside #threadpane, whose innerHTML is rewritten wholesale
// — so its clicks are delegated from the pane, which is never replaced.
$("#threadpane").addEventListener("click", e => {

  if (e.target.closest(".dg-manage")) { setParam("manage", "1"); return; }
  if (e.target.closest(".dg-redo")) { runDigest(true); return; }
});
// Instant tooltip for the tabs — the native title delay made iconified tabs
// feel unlabeled. One floating pill, repositioned per tab, no delay.
let tabTipEl = null;
function tabTipHide() { if (tabTipEl) { tabTipEl.remove(); tabTipEl = null; } }
function showTip(el, text, key) {
  if (!tabTipEl) {
    tabTipEl = document.createElement("div");
    tabTipEl.id = "tabtip";
    document.body.appendChild(tabTipEl);
  }

}

// Real mail is often a FULL html document — injecting before <!DOCTYPE> puts
// the parser in quirks mode and renders blank. Splice into <head>. The frame
// is sandboxed with allow-same-origin (no allow-scripts): mail scripts stay
// disabled but contentDocument is readable, so the frame can size itself to
// its content — re-measured as images load, since they grow the layout late.
function hydrateMailFrame(f, html) {
  const inject = `<base target="_blank"><style>html,body{overflow:hidden}body{font:14px/1.5 -apple-system,sans-serif;margin:10px;color:#111;background:#fff}img{max-width:100%;height:auto}</style>`;
  f.srcdoc = /<head[^>]*>/i.test(html)
    ? html.replace(/<head[^>]*>/i, s => s + inject)
    : (/<html[^>]*>/i.test(html) ? html.replace(/<html[^>]*>/i, s => s + "<head>" + inject + "</head>") : inject + html);
  const resize = () => { f.style.height = f.contentDocument.documentElement.scrollHeight + "px"; };
  f.addEventListener("load", () => {
    resize();
    f.contentDocument.querySelectorAll("img").forEach(img => img.addEventListener("load", resize));
  });
}

function renderLanding() {

// ---------- thread list ----------
// Stale-while-revalidate caches: switching labels (or reopening a thread)
// paints instantly from the last known state while a fresh fetch runs behind
// it. These Maps are the hot path; every write is ALSO queued to disk
// (~/.fused-mail/cache via mail.py) so a page reload rehydrates them instead
// of starting cold. Mail bodies therefore live on disk next to the credential
// that fetched them — same trust boundary, and clearing the account clears it.
const listCache = new Map();     // "account|label|q" -> {threads, nextToken}
const threadCache = new Map();   // "account|threadId" -> get_thread result
const listKey = (label, q) => `${P.account}|${label}|${q}`;
const threadKey = id => `${P.account}|${id}`;

// ---------- disk persistence ----------
// Writes are batched: the page marks entries dirty and one flush per ~1.2s
// (plus one on hide/unload) hands the whole batch to mail.py. Without the
// batching, a list load would fire a write per row it touched.
let diskDirty = null, diskFlushT = null, diskAcct = "";
function diskMark(patch) {
  if (!P.account) return;
  if (!diskDirty || diskAcct !== P.account) {
    diskDirty = { lists: {}, threads: {}, drop_lists: [], drop_threads: [] };
    diskAcct = P.account;
  }
  if (patch.list) diskDirty.lists[patch.list[0]] = patch.list[1];
  if (patch.thread) diskDirty.threads[patch.thread[0]] = patch.thread[1];
  if (patch.dropList) diskDirty.drop_lists.push(patch.dropList);
  if (patch.dropThread) diskDirty.drop_threads.push(patch.dropThread);
  if (patch.clearLists) diskDirty.clear_lists = true;
  if (patch.labels) diskDirty.labels = patch.labels;
  clearTimeout(diskFlushT);
  diskFlushT = setTimeout(flushDisk, 1200);
}
// Flushes are chained, never concurrent: two overlapping cache_put calls
// would race on the same lists.json (and the loser's write would be dropped).
let diskChain = Promise.resolve();
function flushDisk() {
  clearTimeout(diskFlushT);
  if (!diskDirty || !diskAcct) return;
  const batch = diskDirty, acct = diskAcct;
  diskDirty = null;
  // key:null — a cache write must never cancel (or be cancelled by) the
  // user-facing mail calls sharing mail.py's stale-cancel channel.
  const send = () => fused.runPython(PY, { op: "cache_put", account: acct, cache: batch }, { key: null })
    .catch(() => {});   // a cache that fails to persist is not worth a toast
  diskChain = diskChain.then(send, send);
}
addEventListener("visibilitychange", () => { if (document.hidden) flushDisk(); });
addEventListener("pagehide", flushDisk);

// Every cache write goes through these two, so nothing lands in memory
// without also being queued for disk.
function putList(key, val) {
  listCache.set(key, val);
  diskMark({ list: [key, val] });
}
function putThread(key, val) {
  threadCache.set(key, val);
  diskMark({ thread: [key.slice(key.indexOf("|") + 1), val] });
}
function dropThread(key) {

// The page currently on screen was already fixed up in place; only the OTHER
// cached pages (Starred, Sent, All Mail…) went stale.
function dropOtherPages() {

}
// Server-mutating ops (triage, trash, send) make every cached page suspect.

// Boot rehydration: list pages + labels + the most recently used thread

// paints the same view it had, with no network in the critical path.
let hydratedAcct = null;
async function hydrateFromDisk() {
  if (!P.account || hydratedAcct === P.account) return;   // boot + first draw share one read
  const acct = hydratedAcct = P.account;
  let res;
  try { res = await py({ op: "cache_get", account: acct }); }
  catch (e) { hydratedAcct = null; return; }   // let a later draw retry
  if (!res || acct !== P.account) return;
  for (const [k, v] of Object.entries(res.lists || {}))
    if (k.startsWith(acct + "|")) listCache.set(k, v);
  for (const [id, t] of Object.entries(res.threads || {})) threadCache.set(`${acct}|${id}`, t);
  if ((res.labels || []).length && !state.labels.length) {

}
async function loadThreads(append) {
  const rid = ++listReq;
  const key = listKey(P.label, P.q);
  let hadCache = false;
  if (!append) {
    state.threads = []; state.nextToken = "";
    const hit = listCache.get(key);
    if (hit) {
      hadCache = true;
      state.threads = hit.threads; state.nextToken = hit.nextToken;
      renderList();               // instant paint; the fetch below refreshes it
    } else if (!P.manage) $("#list").innerHTML = `<div class="spin">Loading…</div>`;
  }

  // not, it tells the user newer mail is on its way.

    const res = await py({ op: "list_threads", account: P.account, label: P.label, q: P.q,
                           page_token: append ? state.nextToken : "" });

    state.threads = append ? state.threads.concat(res.threads) : res.threads;

    return;

  // cached) by the time it is opened. Only fires for a plain inbox view, and

// Background warm-up after each fresh list: visible threads first, then the
// first page of the other main labels. ONE global warm queue drained by one
// pump — sweeps (inbox load, board open, tab switch) only reorder/extend it,
// so a thread is never fetched twice and a generation bump abandons the rest.
let prefetchGen = 0;

let warmBusy = false;        // pump has a fetch in flight

function warmThreads(threads) {
  const ids = threads.map(t => t.id).filter(id => !threadCache.has(threadKey(id)));
  const front = new Set(ids);
  // The newest sweep's order wins: its ids move to the front, the rest keep queuing.
  warmQueue = [...ids, ...warmQueue.filter(id => !front.has(id))];

async function pumpWarm() {

      // cached, and one local read settles 50 of them for the price of a
      // single call — far cheaper than 50 network fetches. Each id is probed
      // at most once, so a disk miss falls through to the network below.
      const acct = P.account;
      const probe = warmQueue.slice(0, 50)
        .filter(id => !threadCache.has(threadKey(id)) && !warmProbed.has(id));
      if (probe.length) {

        try {
          const hit = await py({ op: "cache_threads", account: acct, ids: probe }, { bg: true });

        } catch (e) {}

      const id = warmQueue.shift();
      warmUI();
      if (threadCache.has(threadKey(id))) continue;
      try {
        const r = await py({ op: "get_thread", account: acct, thread: id, mark_read: false }, { bg: true });
        if (!r.error) putThread(`${acct}|${id}`, r);

    }

async function prefetch() {
  const gen = ++prefetchGen;
  warmThreads(state.threads.slice(0, 50));
  for (const l of ["INBOX", "STARRED", "SENT"]) {
    if (gen !== prefetchGen) return;
    if (l === P.label || listCache.has(listKey(l, ""))) continue;
    const acct = P.account;
    try {
      const r = await py({ op: "list_threads", account: acct, label: l, q: "", page_token: "" }, { bg: true });
      if (gen !== prefetchGen) return;

  if (row && (add.includes("UNREAD") || remove.includes("UNREAD"))) {
    row.unread = add.includes("UNREAD");
    renderList();
  }
  toast(msg);
  try { await modOp(tid, add, remove); }
  catch (e) {

      <p style="color:var(--fg-muted);margin:0 0 10px">
        Paste a Google <b>app password</b> — 16 characters from
        <a href="https://myaccount.google.com/apppasswords" target="_blank" style="color:var(--accent)">myaccount.google.com/apppasswords</a>
        (requires 2-Step Verification). Your <b>normal Gmail password will not work</b>,
        and Workspace admins can disable app passwords — if blocked, use OAuth instead.
      </p>
      <div class="field"><label>Email</label><input id="a-email" placeholder="you@gmail.com" autocomplete="off"></div>
      <div class="field"><label>App password</label><input id="a-pw" placeholder="xxxx xxxx xxxx xxxx" autocomplete="off"></div>
      <div class="actions">
        <span class="err" id="a-err"></span>
        <button class="btn-secondary" id="a-oauth">Use OAuth instead</button>
        <button class="btn-secondary" id="a-cancel">Cancel</button>
        <button class="btn-primary pill" id="a-connect">Connect</button>
      </div>
    </div>`);
  $("#a-cancel", ov).addEventListener("click", close);
  $("#a-connect", ov).addEventListener("click", async () => {
    const email = $("#a-email", ov).value.trim();
    const pw = $("#a-pw", ov).value.trim();
    if (!email || !pw) { $("#a-err", ov).textContent = "both fields required"; return; }
    $("#a-connect", ov).disabled = true;
    $("#a-err", ov).textContent = "connecting…";
    try {
      const res = await py({ op: "add_imap_account", account: email, app_password: pw });
      if (res.error) { $("#a-err", ov).textContent = res.error; $("#a-connect", ov).disabled = false; return; }
      close(); toast("Connected " + res.email);
      await loadAccounts();
      setParam("thread", ""); setParam("label", "INBOX"); setParam("account", res.email);
    } catch (e) { $("#a-err", ov).textContent = e.message; $("#a-connect", ov).disabled = false; }
  });
  $("#a-pw", ov).addEventListener("keydown", e => { if (e.key === "Enter") $("#a-connect", ov).click(); });
  $("#a-oauth", ov).addEventListener("click", () => { close(); addOauthAccount(); });
  $("#a-email", ov).focus();
}

async function addOauthAccount() {
  if (!state.hasCreds) {
    const { ov, close } = modal(`
      <div class="modal">
        <h3>One-time Google OAuth setup</h3>
        <ol>
          <li>Go to <code>console.cloud.google.com</code> → create (or pick) a project.</li>
          <li>Enable the <b>Gmail API</b> (APIs &amp; Services → Library).</li>
          <li>OAuth consent screen → Internal (Workspace) or External + add yourself as test user.</li>
          <li>Credentials → Create credentials → <b>OAuth client ID</b> → type <b>Desktop app</b>.</li>
          <li>Download the JSON and save it as <code>~/.fused-mail/credentials.json</code>.</li>
        </ol>
        <p style="color:var(--fg-muted)">Then click "Add account" again — a browser consent window opens per account. (The app-password path skips all of this.)</p>
        <div class="actions"><button class="btn-primary pill" id="s-ok">Got it</button></div>
      </div>`);
    $("#s-ok", ov).addEventListener("click", close);
    return;
  }
  try {
    const res = await py({ op: "start_auth" });
    if (res.error) return toast(res.error);
  } catch (e) { return toast(e.message); }
  toast("Opening Google consent…");
  let consentOpened = false;
  const poll = setInterval(async () => {
    const st = await py({ op: "auth_status" }).catch(() => null);
    if (!st) return;
    if (st.status === "pending") {
      // the detached worker can't open a browser itself — the app does it
      if (st.url && !consentOpened) { consentOpened = true; window.open(st.url, "_blank"); }
      return;
    }
    clearInterval(poll);
    if (st.status === "ok") {
      toast("Added " + st.email);
      await loadAccounts();
      setParam("account", st.email);
    } else if (st.status === "error") {
      toast("Auth failed: " + (st.error || "unknown"));
    }
  }, 2000);
  setTimeout(() => clearInterval(poll), 5 * 60 * 1000);
}

// ---------- wiring ----------
// Each section re-renders only when its own inputs changed; opening a thread
// just moves the active highlight. Two shells share the chrome: the mailbox,
// and the onboarding card (which hides every mailbox-shaped control).
function applyShell(onboarding) {
  onboardingNow = onboarding;
  document.body.dataset.shell = onboarding ? "onboard" : "mail";
  document.body.dataset.view = P.thread ? "thread" : "list";
  document.body.dataset.manage = P.manage ? "1" : "";
  $("#onboard").hidden = !onboarding;
  $("#listpane").hidden = onboarding;
  $("#threadpane").hidden = onboarding;
  $("#composebtn").hidden = onboarding;
  $("#labels").hidden = onboarding;
  $("#aibar").hidden = onboarding;
  $("#search").disabled = onboarding;
  renderAiToggle();
  requestAnimationFrame(positionSplitbar);
}

let lastKey = "", lastThread = null, lastManage = null;
async function draw() {
  $("#search").value = P.q;
  if (isOnboarding()) {
    applyShell(true);
    renderAccounts();          // renders "+ Add account" and nothing else
    lastKey = ""; lastThread = null;   // force a full draw once an account lands
    return;
  }
  applyShell(false);
  const key = [P.account, P.label, P.q].join("|");
  const acctChanged = !lastKey || lastKey.split("|")[0] !== P.account;
  const listChanged = key !== lastKey;
  const manageChanged = P.manage !== lastManage;
  const threadChanged = P.thread !== lastThread || manageChanged;
  lastKey = key; lastThread = P.thread; lastManage = P.manage;
  if (acctChanged) {
    // Switching accounts: land the outgoing account's pending writes, then
    // paint the incoming one from ITS disk cache before any fetch.
    flushDisk();
    state.labels = []; warmProbed.clear();
    await hydrateFromDisk();
    renderAccounts(); loadLabels();
  }
  else if (listChanged || manageChanged) renderLabels();   // active highlight moved
  // Leaving the triage board hands the middle pane back to the thread list.
  if (listChanged || (manageChanged && !P.manage)) await loadThreads(false);
  updateActiveRow();
  if (threadChanged || listChanged) loadThread();
}
// Handlers set several params in a row (thread + label + account); coalesce
// the resulting onChange storm into one draw per tick.
let drawQueued = false;
function scheduleDraw() {
  if (drawQueued) return;
  drawQueued = true;
  queueMicrotask(() => { drawQueued = false; draw(); });
}

// Draggable split between the middle pane and the reading pane. The width
// lives in a CSS var on <html> and survives reloads via localStorage.
const SPLIT_KEY = "fused.mail.listw";
function clampListW(w) {
  return Math.min(Math.max(w, 280), Math.max(320, window.innerWidth - 240 - 380));
}
function applyListW(w) {
  document.documentElement.style.setProperty("--listw", clampListW(w) + "px");
  positionSplitbar();
}
function positionSplitbar() {
  const r = $("#listpane").getBoundingClientRect();
  const sb = $("#splitbar");
  sb.hidden = !r.width || $("#listpane").hidden;
  sb.style.left = (r.right - 4) + "px";
}
{
  const saved = parseInt(localStorage.getItem(SPLIT_KEY) || "", 10);
  if (saved) applyListW(saved);
}
window.addEventListener("resize", positionSplitbar);
// Tab iconification depends on available width — re-fit after resizes settle.
let tabsRefitT = null;
window.addEventListener("resize", () => {
  clearTimeout(tabsRefitT);
  tabsRefitT = setTimeout(() => { if (P.manage && $("#mgtabs")) paintManage(); }, 150);
});
requestAnimationFrame(positionSplitbar);
$("#splitbar").addEventListener("mousedown", e => {
  e.preventDefault();
  document.body.classList.add("splitting");
  const left = $("#listpane").getBoundingClientRect().left;
  const move = ev => applyListW(ev.clientX - left);
  const up = () => {
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
    document.body.classList.remove("splitting");
    const w = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--listw"), 10);
    if (w) try { localStorage.setItem(SPLIT_KEY, String(w)); } catch (err) {}
    if (P.manage && $("#mgtabs")) paintManage();   // tabs re-fit to the new width
  };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
});

$("#composebtn").innerHTML = svg("pencil", 18) + `<span>Compose</span>`;
$("#composebtn").addEventListener("click", openCompose);
$(".onb-mark").innerHTML = svg("mail", 28);
$("#onb-connect").addEventListener("click", addAccount);
$("#settingsbtn").innerHTML = svg("gear", 17);
$("#settingsbtn").addEventListener("click", openSettings);
$("#refreshbtn").innerHTML = svg("refresh", 19);
$("#refreshbtn").addEventListener("mouseenter", e => showTip(e.currentTarget, warmTipText(), "refresh"));
$("#refreshbtn").addEventListener("mouseleave", tabTipHide);
$("#refreshbtn").addEventListener("click", async () => {
  const b = $("#refreshbtn");
  b.classList.add("spinning");
  try { await Promise.all([loadLabels(), loadThreads(false)]); }
  finally { b.classList.remove("spinning"); }
});
$("#aitoggle").addEventListener("click", toggleAi);
renderAiToggle();
$("#search").addEventListener("keydown", e => {
  if (e.key === "Enter") { setParam("manage", ""); setParam("thread", ""); setParam("q", e.target.value.trim()); }
  if (e.key === "Escape") { e.target.value = ""; setParam("q", ""); e.target.blur(); }
});

// Keyboard layer: j/k walk the list, e archive, u unread, c compose, / search,
// Esc closes modal → thread. Inert while typing, so shortcuts never eat input.
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    const ovs = document.querySelectorAll(".overlay");
    if (ovs.length) { ovs[ovs.length - 1].remove(); return; }
    const a = document.activeElement;
    if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) return; // field's own Esc
    if (P.thread) setParam("thread", "");   // the briefing IS the empty state now
    else if (P.manage) setParam("manage", "");
    return;
  }
  // Tab takes the suggested reply — unless real focus traversal is in play
  // (another field focused, or the reply box already has the user's own text).
  if (e.key === "Tab") {
    const box = $("#suggest"), ta = $("#replytext");
    if (box && !box.hidden && suggestText && ta) {
      const a = document.activeElement;
      const otherField = a && a !== ta && (a.tagName === "INPUT" || a.tagName === "TEXTAREA");
      const taBusy = a === ta && ta.value.trim();
      if (!otherField && !taBusy) { e.preventDefault(); acceptSuggestion(); return; }
    }
  }
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (document.querySelector(".overlay")) return;
  if (e.key === "j" || e.key === "k") {
    e.preventDefault();
    if (!state.threads.length) return;
    const idx = state.threads.findIndex(x => x.id === P.thread);
    const pick = idx === -1
      ? (e.key === "j" ? 0 : state.threads.length - 1)
      : (e.key === "j" ? Math.min(idx + 1, state.threads.length - 1) : Math.max(idx - 1, 0));
    setParam("thread", state.threads[pick].id);
    const el = $(`.row[data-id="${CSS.escape(state.threads[pick].id)}"]`);
    if (el) el.scrollIntoView({ block: "nearest" });
  } else if (e.key === "e" && P.thread) { e.preventDefault(); archiveThread(P.thread); }
  else if (e.key === "u" && P.thread) { e.preventDefault(); triage(P.thread, ["UNREAD"], [], "Marked unread"); }
  else if (e.key === "c") { e.preventDefault(); openCompose(); }
  else if (e.key === "/") { e.preventDefault(); $("#search").focus(); }
});

fused.params.onChange(scheduleDraw);
// Disk first, then draw: the cached view paints with no network in the path,
// and draw()'s own fetches reconcile it from there.
loadAccounts().then(hydrateFromDisk).then(draw).then(() => {
  // Warm the triage config once the first paint is done: it is a small local
  // file, and having it in memory is what lets the board open without a round
  // trip. Background priority, so it never delays anything on screen.
  if (typeof loadMgConfig === "function") loadMgConfig(true).catch(() => {});
});
</script>
