[project]
name = "docchat"
version = "0.1.0"
requires-python = ">=3.10"
# In-process embedding server (ragserver.py) + DuckDB vector store. No Ollama.
# sentence-transformers pulls torch/transformers; it auto-uses CUDA/MPS if present,
# else CPU. The HTTP layer is stdlib (http.server) so no web framework is needed.
dependencies = [
    "sentence-transformers>=3.0",
    "duckdb>=1.0",
    "numpy",
]

[tool.uv]
package = false
