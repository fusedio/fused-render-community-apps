[project]
name = "photo-editor-agent"
version = "0.1.0"
requires-python = ">=3.12"
# Only what the agent tools import: Pillow/numpy for pixels, and Vision (plus
# Quartz/Cocoa to read its mask) for remove_background. The editor's own
# pyproject.toml one folder up also pulls the MLX models and a vendored wheel
# that `fused app serve` cannot install, which is why this folder has its own.
dependencies = [
    "numpy>=1.26",
    "pillow>=11",
    "pyobjc-framework-Cocoa>=10",
    "pyobjc-framework-Quartz>=10",
    "pyobjc-framework-Vision>=10",
]

[tool.uv]
package = false
