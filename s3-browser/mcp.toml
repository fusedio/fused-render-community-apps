# MCP tools for the S3 Browser, served by `fused app serve <this folder>`.
# Each wraps the page's own backend (s3.py / preview.py / download.py); see tools.py.

[[tool]]
name = "list_accounts"
description = "List saved S3 Browser connections (id, label, auth type, region, pinned bucket/folder, endpoint; no secrets) and local AWS profiles. Pass a connection's id or label as `account` to the other tools."
file = "tools.py"
entrypoint = "list_accounts"
signature = "list_accounts()"

[[tool]]
name = "save_account"
description = "Add a saved connection, or edit one by passing its id or label as `account`. auth: anonymous (public data; needs `path` like s3://bucket/folder/), profile (a local AWS profile, see list_accounts), or keys (read from `credentials_file`: an AWS console access-key CSV, or a file of AWS_ACCESS_KEY_ID= / AWS_SECRET_ACCESS_KEY= / AWS_SESSION_TOKEN= lines; stored by the app, never returned). `path` pins the connection to a bucket/folder; `endpoint_url` targets S3-compatible stores (Wasabi, MinIO, R2). When editing, omitted fields keep their value and \"\" clears them."
file = "tools.py"
entrypoint = "save_account"
signature = "save_account(account: str='', label: str | None=None, auth: str | None=None, path: str | None=None, region: str | None=None, endpoint_url: str | None=None, profile: str | None=None, credentials_file: str='')"

[[tool]]
name = "delete_account"
description = "Remove a saved connection (by id or label) together with its stored credentials."
file = "tools.py"
entrypoint = "delete_account"
signature = "delete_account(account: str)"

[[tool]]
name = "list_buckets"
description = "List the S3 buckets visible to a connection."
file = "tools.py"
entrypoint = "list_buckets"
signature = "list_buckets(account: str='', profile: str='', region: str='', anonymous: bool=False, endpoint_url: str='')"

[[tool]]
name = "bucket_info"
description = "Bucket region, versioning status, default encryption and public-access-block settings."
file = "tools.py"
entrypoint = "bucket_info"
signature = "bucket_info(bucket: str, account: str='', profile: str='', region: str='', anonymous: bool=False, endpoint_url: str='')"

[[tool]]
name = "security_scan"
description = "Scan a bucket for public exposure: public ACL grants, public bucket policy, incomplete Block Public Access, missing default encryption."
file = "tools.py"
entrypoint = "security_scan"
signature = "security_scan(bucket: str, account: str='', profile: str='', region: str='', anonymous: bool=False, endpoint_url: str='')"

[[tool]]
name = "set_versioning"
description = "Enable or suspend versioning on a bucket (status: Enabled | Suspended)."
file = "tools.py"
entrypoint = "set_versioning"
signature = "set_versioning(bucket: str, status: str, account: str='', profile: str='', region: str='', anonymous: bool=False, endpoint_url: str='')"

[[tool]]
name = "get_bucket_config"
description = "Read a bucket's policy, CORS or lifecycle configuration (config_type: policy | cors | lifecycle)."
file = "tools.py"
entrypoint = "get_bucket_config"
signature = "get_bucket_config(bucket: str, config_type: str, account: str='', profile: str='', region: str='', anonymous: bool=False, endpoint_url: str='')"

[[tool]]
name = "put_bucket_config"
description = "Replace a bucket's policy (JSON policy document), CORS (JSON array of CORSRules) or lifecycle (JSON array of Rules) configuration."
file = "tools.py"
entrypoint = "put_bucket_config"
signature = "put_bucket_config(bucket: str, config_type: str, config: str, account: str='', profile: str='', region: str='', anonymous: bool=False, endpoint_url: str='')"

[[tool]]
name = "delete_bucket_config"
description = "Delete a bucket's policy, CORS or lifecycle configuration."
file = "tools.py"
entrypoint = "delete_bucket_config"
signature = "delete_bucket_config(bucket: str, config_type: str, account: str='', profile: str='', region: str='', anonymous: bool=False, endpoint_url: str='')"

[[tool]]
name = "list_objects"
description = "List one folder level of a bucket: sub-folders and objects (size, modified, storage class) under a prefix, paginated with a continuation token. Region is auto-resolved."
file = "tools.py"
entrypoint = "list_objects"
signature = "list_objects(bucket: str, prefix: str='', token: str='', max_keys: int=1000, delimiter: str='/', account: str='', profile: str='', region: str='', anonymous: bool=False, endpoint_url: str='')"

[[tool]]
name = "list_keys"
description = "List every object key under a prefix recursively (capped at 5000)."
file = "tools.py"
entrypoint = "list_keys"
signature = "list_keys(bucket: str, prefix: str='', account: str='', profile: str='', region: str='', anonymous: bool=False, endpoint_url: str='')"

[[tool]]
name = "head_object"
description = "Get an object's properties: size, content type, last modified, ETag, storage class, encryption, user metadata."
file = "tools.py"
entrypoint = "head_object"
signature = "head_object(bucket: str, key: str, account: str='', profile: str='', region: str='', anonymous: bool=False, endpoint_url: str='')"

[[tool]]
name = "read_object"
description = "Download an object to a local cache file and return its path; text objects up to 256 KB are also returned inline. Use to read CSV, JSON, text, or hand a Parquet/image path to other tools."
file = "tools.py"
entrypoint = "read_object"
signature = "read_object(bucket: str, key: str, max_bytes: int=52428800, account: str='', profile: str='', region: str='', anonymous: bool=False, endpoint_url: str='')"

[[tool]]
name = "upload_file"
description = "Upload a local file to s3://bucket/key (multipart above 64 MB)."
file = "tools.py"
entrypoint = "upload_file"
signature = "upload_file(bucket: str, key: str, local_path: str, content_type: str='', account: str='', profile: str='', region: str='', anonymous: bool=False, endpoint_url: str='')"

[[tool]]
name = "put_text"
description = "Write a small text object to s3://bucket/key (overwrites)."
file = "tools.py"
entrypoint = "put_text"
signature = "put_text(bucket: str, key: str, text: str, content_type: str='text/plain', account: str='', profile: str='', region: str='', anonymous: bool=False, endpoint_url: str='')"

[[tool]]
name = "download"
description = "Download objects (keys) and whole folders (prefixes, recursive) to a local directory, keeping key paths. Default ~/Downloads."
file = "tools.py"
entrypoint = "download"
signature = "download(bucket: str, dest_dir: str='~/Downloads', keys: list[str] | None=None, prefixes: list[str] | None=None, account: str='', profile: str='', region: str='', anonymous: bool=False, endpoint_url: str='')"

[[tool]]
name = "create_folder"
description = "Create an empty folder in a bucket."
file = "tools.py"
entrypoint = "create_folder"
signature = "create_folder(bucket: str, name: str, prefix: str='', account: str='', profile: str='', region: str='', anonymous: bool=False, endpoint_url: str='')"

[[tool]]
name = "rename_object"
description = "Rename or move an object within a bucket (refuses to overwrite)."
file = "tools.py"
entrypoint = "rename_object"
signature = "rename_object(bucket: str, src_key: str, dest_key: str, account: str='', profile: str='', region: str='', anonymous: bool=False, endpoint_url: str='')"

[[tool]]
name = "delete_objects"
description = "Permanently delete objects by key and whole folders by prefix (recursive, up to 5000 objects per folder per call; `truncated` true means call again). Refuses an empty prefix (the whole bucket)."
file = "tools.py"
entrypoint = "delete_objects"
signature = "delete_objects(bucket: str, keys: list[str] | None=None, prefixes: list[str] | None=None, account: str='', profile: str='', region: str='', anonymous: bool=False, endpoint_url: str='')"

[[tool]]
name = "change_storage_class"
description = "Change an object's storage class (STANDARD, STANDARD_IA, ONEZONE_IA, INTELLIGENT_TIERING, GLACIER_IR, GLACIER, DEEP_ARCHIVE)."
file = "tools.py"
entrypoint = "change_storage_class"
signature = "change_storage_class(bucket: str, key: str, storage_class: str, account: str='', profile: str='', region: str='', anonymous: bool=False, endpoint_url: str='')"

[[tool]]
name = "presign_url"
description = "Create a shareable (presigned) URL for an object, valid for `expires` seconds; method put gives an upload URL."
file = "tools.py"
entrypoint = "presign_url"
signature = "presign_url(bucket: str, key: str, expires: int=3600, method: str='get', version_id: str='', account: str='', profile: str='', region: str='', anonymous: bool=False, endpoint_url: str='')"

[[tool]]
name = "get_tags"
description = "Get an object's tags."
file = "tools.py"
entrypoint = "get_tags"
signature = "get_tags(bucket: str, key: str, account: str='', profile: str='', region: str='', anonymous: bool=False, endpoint_url: str='')"

[[tool]]
name = "set_tags"
description = "Replace an object's tags with a {name: value} map."
file = "tools.py"
entrypoint = "set_tags"
signature = "set_tags(bucket: str, key: str, tags: dict[str, str], account: str='', profile: str='', region: str='', anonymous: bool=False, endpoint_url: str='')"

[[tool]]
name = "list_versions"
description = "List an object's versions and delete markers."
file = "tools.py"
entrypoint = "list_versions"
signature = "list_versions(bucket: str, key: str, max_keys: int=1000, account: str='', profile: str='', region: str='', anonymous: bool=False, endpoint_url: str='')"

[[tool]]
name = "restore_version"
description = "Restore an older version of an object by copying it back as the current version."
file = "tools.py"
entrypoint = "restore_version"
signature = "restore_version(bucket: str, key: str, version_id: str, account: str='', profile: str='', region: str='', anonymous: bool=False, endpoint_url: str='')"
