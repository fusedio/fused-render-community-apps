    // The glyph is decoration and says so (the button already reads out the
    // filename); the pill is the text that carries the fact — the running time,
    // or the word when the container never said how long it is. A second ▶ there
    // would be the same claim twice.
    const dur = fmtDur(it.duration_s);
    return `<span class="vplay" aria-hidden="true"><i>▶</i></span>`
      + `<span class="vdur">${dur ? esc(dur) : "video"}</span>`;
  }

  function card(it, idx, weak, cap) {
    return `<button class="card${weak ? " weak" : ""}" type="button"
      tabindex="-1" data-idx="${idx}" data-id="${esc(it.id)}"
      data-cap="${esc(cap)}">
      <div class="shot"><img loading="lazy" decoding="async"
        src="${esc(thumbURL(it.id, 512))}"
        alt="${esc(baseName(it.path))}">${marksHTML(it)}</div>
      <div class="cap">${capHTML(it, cap)}</div>
    </button>`;
  }

  // The response as sections to draw, kept apart from the DOM so the painter
  // can decide how to apply them.
  //
  // The interesting part is the confidence horizon. Search always hands back
  // at least query.MIN_KEEP rows so a weak-signal query degrades to "here are
  // the closest" rather than to nothing — but rendering that padding exactly
  // like the answers is what made a good "beach" search look broken. The
  // daemon measures where the answers stop (`strong`, a count of leading rows
  // of the whole ranked set); this draws the line there.
  // Trips the daemon found, cleaned up for reading: every heading carries the
  // dates that distinguish it (two stays in one town produced two headings
  // reading "Banjar Kerobokan · Jul 2026"), and a "trip" of one or two photos
  // is a heading with more weight than its contents, so those fold together.
  const TRIP_MIN = 3;

  function tripBuckets(groups) {
    const out = [], loose = [];
    for (const g of groups) {
      if (g.trip && g.items.length >= TRIP_MIN) {
        out.push({ label: g.trip, when: dateSpan(g.start, g.end), items: g.items });
      } else {
        loose.push(...g.items);
      }
    }
    if (loose.length) {
      out.push({ label: "Not part of a trip", when: "", items: loose,
                 dateless: false });
    }
    return out;
  }

  // With no query at all the grid was an undated wall of burst duplicates.
  // Rows arrive newest-first, so one pass cuts them at each month boundary.
  function monthBuckets(items) {
    const out = [];
    let key = null;
    for (const it of items) {
      const k = (it.taken_at || "").slice(0, 7);
      if (k !== key || !out.length) {
        key = k;
        out.push({ label: monthLabel(k), when: "", items: [], dateless: !!k });
      }
      out[out.length - 1].items.push(it);
    }
    return out;
  }

  function buckets(data, byMonth) {
    const groups = data.groups || [];
    if (!byMonth) return tripBuckets(groups);
    return monthBuckets(groups.flatMap(g => g.items));
  }

  function buildModel(data, base = 0, q = "") {
    const groups = data.groups || [];
    const tripMode = !!(data.parsed && data.parsed.trip_mode);
    // null = the query had no semantic part, so every row is a filter match
    // and there is no confidence to grade
    const strong = Number.isFinite(data.strong) ? data.strong : null;
    // A cut that keeps half of everything it looked at has not cut anything.
    // Measured on the reference library: "beach" clears 3 of 86 photos and
    // "boat" 4, but nonsense like "asdkjhasd kjhasd" clears 84 of 86 — the
    // model finds *something* for any string, and its scores for nonsense are
    // statistically indistinguishable from those for a real but low-signal
    // query ("food", "city street"). So the view never claims to know a query
    // is meaningless; it reports the one thing it can measure — that this
    // ranking did not separate the library — and drops the horizon, because
    // there is nothing there to draw a line through.
    // An unfiltered view is a library, not a result set: give it the shape a
    // library has. Any query at all — even one that only filters — is an
    // answer to a question, and ranking order is what matters there.
    //
    // ...and a single trip's photos are neither: the heading above them already
    // says which days they span, so cutting them into months again answers a
    // question that has been answered, and a trip inside one month would get a
    // heading that repeats the one above it. Read off the response rather than
    // the URL — this model describes the rows we were handed, and the URL may
    // already have moved on.
    const byMonth = !tripMode && data.trip == null && !String(q || "").trim();
    const searched = Number.isFinite(data.searched) ? data.searched : 0;
    const broad = strong !== null && searched > 0
                  && strong / searched >= DISCRIMINATION_MAX;
    const items = [], sections = [];
    if (broad) {
      const q = (data.parsed && data.parsed.residual) || "";
      sections.push({ type: "note", text:
        `${strong} of the ${searched} photos searched scored about the same for `
        + `“${q}” — this is the closest lens can get, not a ranking.` });
    }
    const grouped = tripMode || byMonth;
    for (const g of (grouped ? buckets(data, byMonth) : groups)) {
      if (grouped) {
        sections.push({ type: "heading", text: g.label, when: g.when,
                        n: g.items.length });
      }
      // Which caption these cards get (see capHTML). Inside one trip the
      // sub-header above the grid already carries both the dates and the place,
      // so the clock is the only thing left that distinguishes a card.
      const cap = data.trip != null ? "time" : (g.dateless ? "nodate" : "date");
      const cards = g.items.map(it => {
        const idx = base + items.push(it) - 1;
        return { it, idx, cap,
                 weak: strong !== null && !broad && idx >= strong };
      });
      // Trip mode groups by trip, so strong and weak rows interleave across
      // headings and a single divider would be a lie about the order. There
      // the weight of each card carries the signal on its own.
      if (grouped || strong === null || broad) {
        if (cards.length) sections.push({ type: "grid", weak: false, cards });
        continue;
      }
      const hot = cards.filter(c => !c.weak), cold = cards.filter(c => c.weak);
      if (hot.length) sections.push({ type: "grid", weak: false, cards: hot });
      if (cold.length) {
        if (hot.length) sections.push({ type: "horizon", label: "weaker matches" });
        sections.push({ type: "grid", weak: true, cards: cold });
      }
    }
    return { sections, items, strong, tripMode, broad, searched, byMonth };
  }

  function sectionHTML(s) {
    if (s.type === "heading") {
      return `<h2>${esc(s.text)}` +
             (s.when ? `<span class="when">${esc(s.when)}</span>` : "") +
             `<span class="n">${esc(s.n)}</span></h2>`;
    }
    if (s.type === "note") {
      return `<p class="restnote">${esc(s.text)}</p>`;
    }
    if (s.type === "horizon") {
      return `<div class="horizon" role="separator"
        aria-label="${esc(s.label)}"><span>${esc(s.label)}</span></div>`;
    }
    return `<div class="grid${s.weak ? " weak" : ""}">` +
           s.cards.map(c => card(c.it, c.idx, c.weak, c.cap)).join("") +
           `</div>`;
  }

  // Reconcile #results against the model rather than rewriting it.
  //
  // `resEl.innerHTML = html` threw away and rebuilt every card on every
  // keystroke: a dozen to two hundred <img> elements destroyed and re-created,
  // the enter animation replayed on cards that had not moved, and the browser
  // asked again for thumbnails it was already holding. Refining a query keeps
  // most of the result set, so keying on the photo id keeps most of the DOM —
  // the cards that survive are the same nodes, with the same decoded images.
  //
  // Returns the cards this update genuinely created, which are the only ones
  // with anything to animate.
  const CARD_TPL = document.createElement("template");

  function makeCard(c) {
    CARD_TPL.innerHTML = card(c.it, c.idx, c.weak, c.cap);
    return CARD_TPL.content.firstElementChild;
  }

  // One tab stop for the whole grid; the arrow keys move within it. Tabbing
  // past a search result used to mean tabbing past every search result.
  function setRover(el) {
    for (const c of resEl.querySelectorAll('.card[tabindex="0"]')) c.tabIndex = -1;
    if (el) el.tabIndex = 0;
  }

  function rove(d) {
    const cards = [...resEl.querySelectorAll(".card")];
    if (!cards.length) return;
    const cur = cards.indexOf(document.activeElement);
    const next = cards[Math.max(0, Math.min(cards.length - 1, (cur < 0 ? 0 : cur + d)))];
    if (!next) return;
    setRover(next);
    next.focus();
  }

  // how many cards make up one row, so ↑/↓ move a row rather than a card
  function rowStride() {
    const grid = document.activeElement && document.activeElement.closest(".grid");
    if (!grid) return 1;
    const cols = getComputedStyle(grid).gridTemplateColumns.split(" ").length;
    return Math.max(1, cols);
  }

  function tuneCard(el, c) {
    // position in ITEMS and side of the horizon both move as a query narrows
    el.dataset.idx = c.idx;
    el.classList.toggle("weak", !!c.weak);
    // ...and so does which caption it should carry: a query narrowing can move
    // a card out from under a month heading, and opening a trip changes the
    // flavour outright. `cap` fully determines the caption, so comparing it is
    // the whole check.
    if (el.dataset.cap !== c.cap) {
      el.dataset.cap = c.cap;
      el.querySelector(".cap").innerHTML = capHTML(c.it, c.cap);
    }
    el.classList.remove("enter");
    el.style.animationDelay = "";
    return el;
  }

  function paint(model, { append = false } = {}) {
    const reusable = new Map();
    if (!append) {
      for (const el of resEl.querySelectorAll(".card")) reusable.set(el.dataset.id, el);
    }
    const frag = document.createDocumentFragment();
    const fresh = [];
    for (const s of model.sections) {
      if (s.type !== "grid") {
        const box = document.createElement("div");
        box.innerHTML = sectionHTML(s);
        frag.appendChild(box.firstElementChild);
        continue;
      }
      const grid = document.createElement("div");
      grid.className = "grid" + (s.weak ? " weak" : "");
      for (const c of s.cards) {
        const key = String(c.it.id);
        const kept = reusable.get(key);
        if (kept) {
          reusable.delete(key);
          grid.appendChild(tuneCard(kept, c));
        } else {
          const el = makeCard(c);
          fresh.push(el);
          grid.appendChild(el);
        }
      }
      frag.appendChild(grid);
    }
    if (!append) {
      resEl.replaceChildren(frag);
      setRover(resEl.querySelector(".card"));
      drawHorizon();
      return fresh;
    }
    // A page boundary is an artefact of how the rows were fetched, not
    // something about the photos — so it must not become a visible seam.
    const tail = resEl.lastElementChild, head = frag.firstElementChild;
    if (tail && head && tail.className === head.className &&
        tail.classList.contains("grid")) {
      tail.append(...head.children);
      head.remove();
    }
    resEl.appendChild(frag);
    if (!resEl.querySelector('.card[tabindex="0"]')) setRover(resEl.querySelector(".card"));
    drawHorizon();
    return fresh;
  }

  // The line is drawn, not just present: it grows out from the label to say
  // that *this* is where the answers stopped. Once per appearance — it is a
  // statement about the result set, and repeating it on every keystroke would
  // turn a statement into a tic.
  let horizonDrawn = false;
  function drawHorizon() {
    const el = resEl.querySelector(".horizon");
    if (!el) { horizonDrawn = false; return; }
    if (horizonDrawn || !motion()) return;
    horizonDrawn = true;
    gsap.fromTo(el, { "--draw": 0 },
                { "--draw": 1, duration: 0.5, ease: "power3.out" });
  }

  // The enter animation is gated to genuinely-new nodes, and capped: a stagger
  // across two hundred cards is a second and a half of nothing happening at
  // the bottom of the grid.
  function animateIn(fresh) {
    if (RMQ.matches) return;
    fresh.forEach((el, i) => {
      if (i < 20) el.style.animationDelay = (i * 12) + "ms";
      el.classList.add("enter");
    });
  }

  // ── scope ─────────────────────────────────────────────────────────────
  // Photographs, videos, or everything indexed. A home folder holds far more
  // software-made images (icons, screenshots, exported frames) than photos, and
  // they crowd out the real answers — so photos is the default and the other two
  // are one click away. Kept in the URL so a link carries what it was showing.
  //
  // The three do not partition the library and are not meant to: "all" also
  // holds the graphics, which are in neither of the others.
  const SCOPES = ["photos", "videos", "all"];
  // What one row of each scope is called, and where its count comes from — in one
  // place, because three scopes × two facts is exactly what goes out of step when
  // it is spelled at each use.
  const SCOPE_NOUN = { photos: "photo", videos: "video", all: "image" };
  const scopeCount = s => ({ photos: lib.photos_scope, videos: lib.videos_scope,
                             all: lib.all_scope })[s];

  function currentScope() {
    const s = fused.params.get("scope");
    return SCOPES.includes(s) ? s : "photos";
  }

  // ── which of the three states this page is in ──────────────────────────
  // "photos" (the grid), "trips" (the index of trips), "trip" (one trip's
  // photos). Anything unrecognised is the grid: a hand-edited or stale link
  // must land somewhere useful, never on an empty screen.
  function currentView() {
    const v = fused.params.get("view");
    if (v === "trips" || v === "people") return v;
    // `view=trip` without a trip to show is not a state — it is half a link
    // (a copied URL with the id dropped), and the index is what it meant. Same
    // for a person.
    if (v === "trip") return currentTrip() === null ? "trips" : "trip";
    if (v === "person") return currentPerson() === null ? "people" : "person";
    return "photos";
  }

  function currentTrip() {
    const n = parseInt(fused.params.get("trip"), 10);
    return Number.isFinite(n) && n > 0 ? n : null;
  }

  function currentPerson() {
    const n = parseInt(fused.params.get("person"), 10);
    return Number.isFinite(n) && n > 0 ? n : null;
  }

  function paintScope(scope) {
    for (const b of scopeEl.querySelectorAll("button")) {
      b.setAttribute("aria-pressed", String(b.dataset.scope === scope));
    }
  }

  // A daemon that predates these counts sends neither; leave the labels bare
  // rather than printing "undefined".
  function setScopeCounts(s) {
    rollTo(nPhotosEl, s.photos_scope);
    rollTo(nVideosEl, s.videos_scope);
    rollTo(nAllEl, s.all_scope);
    // ...and the trip count, which is a badge on the pill that opens them
    rollTo(nTripsEl, s.trips);
    // ...and the people count. Absent on a daemon that predates faces, which
    // rollTo renders as no badge rather than as "undefined".
    rollTo(nPeopleEl, s.faces && s.faces.people);
  }

  // `limit` is a URL param so a deep link can ask for fewer or more; the
  // daemon still reports how many matched, so the count line stays honest.
  function currentLimit() {
    const n = parseInt(fused.params.get("limit"), 10);
    return Number.isFinite(n) && n > 0 ? Math.min(n, 2000) : LIMIT_DEFAULT;
  }

  // ── trips ─────────────────────────────────────────────────────────────
  // A trip is the one grouping in this library nobody typed: the indexer found
  // it by looking for a gap in time and a distance from home (lens/trips.py).
  // It was already visible as a heading over a search for "trips" and as a
  // number in the status line — neither of which is a way *in*. This is.
  async function fetchTrips() {
    const out = await api("/trips");
    const trips = out.trips || [];
    TRIPS = new Map(trips.map(t => [t.id, t]));
    return trips;
  }

  function tripCard(t) {
    // `place` rather than `name`: the daemon's name is "Banjar Kerobokan · Jul
    // 2026", and printing it above a line that already says the dates says the
    // month twice. The name survives as the title, for the two trips to the same
    // town whose headings would otherwise read identically.
    const when = dateSpan(t.start, t.end);
    const sub = [when, plural(t.count, "photo")].filter(Boolean).join(" · ");
    const cover = t.cover_id == null ? "" :
      `<img loading="lazy" decoding="async" alt=""
        src="${esc(thumbURL(t.cover_id, 512))}">`;
    return `<button class="tcard" type="button" data-trip="${esc(t.id)}"
      title="${esc(t.name)}">
      <div class="shot${t.cover_id == null ? " none" : ""}">${cover}</div>
      <div class="tmeta"><b>${esc(t.place || t.name)}</b>
        <span>${esc(sub)}</span></div>
    </button>`;
  }

  async function showTrips() {
    // Shares reqSeq with search() on purpose: whichever request lands last owns
    // the page, so switching Trips → Photos mid-flight cannot let the trip cards
    // paint over the photo grid that has already replaced them.
    const seq = ++reqSeq;
    // Nothing on this screen is a photo, so nothing here can open the lightbox
    // — and ITEMS is what it indexes into.
    ITEMS = [];
    page = { q: "", scope: currentScope(), trip: null, person: null, total: 0,
             strong: null, loading: false };
    sentinelEl.hidden = true;
    resEl.classList.remove("hide-weak");
    closeLight();
    busyOn();
    let trips;
    try {
      trips = await fetchTrips();
    } catch (err) {
      if (seq !== reqSeq) return;
      busyOff();
      resEl.replaceChildren();
      chipsEl.innerHTML = "";
      // The daemon answered and refused, or did not answer at all. pollStatus
      // owns the second case; either way the trips are not on screen and
      // saying why beats an empty page.
      showMsg(`<div class="ico">⚠︎</div><h3>Could not read your trips</h3>
        <p>${esc(err.message)}</p>
        <button type="button" data-act="retrytrips">Try again</button>`);
      return;
    }
    if (seq !== reqSeq) return;
    busyOff();
    hideMsg();
    chipsEl.innerHTML = trips.length
      ? `<span id="count">${esc(plural(trips.length, "trip"))}</span>` : "";
    if (!trips.length) {
      resEl.replaceChildren();
      // Not an error and not an empty library: trips need photographs that carry
      // both a date and a coordinate, and a library can be large without having
      // any. Say which of the two it is.
      showMsg(`<div class="ico">🧳</div><h3>No trips yet</h3>
        <p>A trip is found where your photos jump more than 100&nbsp;km from
        where most of them were taken, with a two-day gap either side — so it
        needs photographs carrying both a date and GPS.</p>
        <button type="button" data-act="photos">Back to photos</button>`);
      return;
    }
    resEl.innerHTML = `<div class="tgrid">${trips.map(tripCard).join("")}</div>`;
    animateIn([...resEl.querySelectorAll(".tcard")]);
    painted = true;
  }

  // ── people ────────────────────────────────────────────────────────────
  // The one grouping in this library that is about *who* rather than where or
  // when — and the only one lens computes from the pixels themselves: a face
  // detector finds the faces, a recognition network turns each into a vector, and
  // faces that sit close together on that sphere are one person (lens/faces.py,
  // lens/persons.py). Nobody is identified: a person is a cluster with an id
  // until somebody types a name on it.
  // What `/people/<face id>/face.webp?s=<n>` was — the same synchronous shape
  // as thumbURL, off the same kind of map. `size` is ignored here and honoured
  // where the crop is actually made: lens_api.py renders a person's cover at
  // 400 (the retina card) and a details-panel chip at 200, and both arrive in
  // the response that mentions the face, so there is nothing left to choose
  // between at draw time. An empty string is a face with no crop — a cover
  // whose photograph is on an unplugged drive — and the card's own
  // `.shot.none` styling covers it, exactly as it did for the daemon's 404.
  const faceURL = (fid, size) => {
    const p = FACES.get(String(fid));
    return p ? fused.rawUrl(p) : "";
  };

  async function fetchPeople() {
    const out = await api("/people");
    const people = out.people || [];
    PEOPLE = new Map(people.map(p => [p.id, p]));
    return people;
  }

  // What to call somebody nobody has named. Positional — "Person 3" is the third
  // card, not person id 3 — because the id is an implementation detail and a
  // library whose ids happen to run 4, 9, 31 would otherwise read as a list with
  // gaps in it. The daemon's own ordering is what makes this stable between
  // polls (most photographed first, see LensServer.people).
  const personName = (p, n) => p.name || `Person ${n + 1}`;

  function personCard(p, n) {
    const label = personName(p, n);
    // "images", not "photos", and the word is load-bearing: this count is every
    // catalogued file their face is in — screenshots and video frames included —
    // while the grid behind the card obeys the scope toggle and will often show
    // fewer. "42 photos" over a grid of 15 is the kind of small lie this view
    // spends its comments avoiding, and "image" is already the status line's word
    // for everything indexed.
    const sub = p.photo_count === p.face_count
      ? plural(p.photo_count, "image")
      : `${plural(p.photo_count, "image")} · ${plural(p.face_count, "face")}`;
    const cover = p.cover_face_id == null ? "" :
      `<img loading="lazy" decoding="async" alt=""
         src="${esc(faceURL(p.cover_face_id, 400))}">`;
    const on = picked.has(p.id);
    return `<button class="pcard" type="button" data-person="${esc(p.id)}"
      aria-pressed="${on ? "true" : "false"}" title="${esc(label)}">
      <span class="face${p.cover_face_id == null ? " none" : ""}">${cover}</span>
      <span class="tick" aria-hidden="true">✓</span>
      <span class="pmeta"><b class="${p.name ? "" : "unnamed"}">${esc(label)}</b>
        <span>${esc(sub)}</span></span>
    </button>`;
  }

  // How many rows the face sweep has been over, out of how many it will. Said on
  // the People index while it is still running, because "5 people" from a tenth
  // of the library is a different fact from "5 people" from all of it — and the
  // sweep runs after the photographs are already searchable, so this is the
  // normal state of a fresh library rather than an error.
  function facesProgressNote() {
    const f = lib.faces;
    if (!f || !f.eligible || f.scanned >= f.eligible) return "";
    const pct = Math.floor(100 * f.scanned / f.eligible);
    return `Still looking: ${esc(f.scanned)} of ${esc(f.eligible)} files `
         + `scanned for faces (${esc(pct)}%). More people may appear.`;
  }

  async function showPeople() {
    // Shares reqSeq with search() and showTrips() for the same reason they share
    // it: whichever request lands last owns the page.
    const seq = ++reqSeq;
    ITEMS = [];
    page = { q: "", scope: currentScope(), trip: null, person: null, total: 0,
             strong: null, loading: false };
    sentinelEl.hidden = true;
    resEl.classList.remove("hide-weak");
    closeLight();
    busyOn();
    let people;
    try {
      people = await fetchPeople();
    } catch (err) {
      if (seq !== reqSeq) return;
      busyOff();
      resEl.replaceChildren();
      chipsEl.innerHTML = "";
      showMsg(`<div class="ico">⚠︎</div><h3>Could not read your people</h3>
        <p>${esc(err.message)}</p>
        <button type="button" data-act="retrypeople">Try again</button>`);
      return;
    }
    if (seq !== reqSeq) return;
    busyOff();
    hideMsg();
    // A pick that refers to somebody who is no longer here (a merge, a re-index)
    // must not keep the merge button armed for a person that does not exist.
    for (const id of [...picked]) if (!PEOPLE.has(id)) picked.delete(id);
    paintSelect();
    const note = facesProgressNote();
    // The merge control lives here, beside the count, and only when there are two
    // cards to merge: it is the fix for the one mistake this screen makes
    // (somebody found twice), so it belongs on the screen where that is visible
    // rather than inside a menu.
    chipsEl.innerHTML = (people.length
        ? `<span class="chip">${esc(plural(people.length, "person")
            .replace("persons", "people"))}</span>` : "")
      + (note ? `<span class="chip">${note}</span>` : "")
      + (people.length > 1
        ? `<button class="chip act" type="button" data-act="select"
             title="Two cards showing the same person? Merge them"
             >⇉ Same person…</button>` : "");
    if (!people.length) {
      resEl.replaceChildren();
      const f = lib.faces || {};
      // Three states, and they are genuinely different: the sweep has not
      // reached far enough yet, it found faces but no repeated ones, or there is
      // nobody in this library at all.
      if (note) {
        showMsg(`<div class="ico">⏳</div><h3>Looking for faces…</h3>
          <p>${note} Faces are found after your photos are searchable, so this
          runs in the background.</p>`);
      } else if (f.faces) {
        showMsg(`<div class="ico">👤</div><h3>No repeated faces yet</h3>
          <p>${esc(plural(f.faces, "face"))} found, and no-one appears three
          times or more — which is what it takes to become a person here, so a
          stranger in the background of one photo never gets a card.</p>`);
      } else {
        showMsg(`<div class="ico">👤</div><h3>No people found</h3>
          <p>lens looks for faces in every photo it indexes, entirely on this
          machine. It found none — which is a fact about the library, not an
          error.</p>
          <button type="button" data-act="photos">Back to photos</button>`);
      }
      painted = true;
      return;
    }
    resEl.innerHTML =
      `<div class="pgrid">${people.map(personCard).join("")}</div>`;
    animateIn([...resEl.querySelectorAll(".pcard")]);
    painted = true;
  }

  // Opening a person: `person` first, then `view`, the same order (and for the
  // same reason) a trip is opened in — `view=person` without an id is half a
  // state, so writing it first would flash the index on the way in.
  function openPerson(id) {
    exitSelect();
    fused.params.set("person", String(id));
    fused.params.set("view", "person");
  }

  // ── select two, merge them ────────────────────────────────────────────
  // The failure this exists for: one person found twice, because a five-year gap
  // or a pair of sunglasses put their faces on two sides of the threshold. It is
  // the single most likely thing to be wrong on this screen, so fixing it is two
  // presses and it happens where the mistake is visible.
  //
  // Select mode rather than drag-and-drop: dragging is invisible until you try
  // it, has no keyboard equivalent, and is precisely the interaction people get
  // wrong on a touchpad. Pressing two cards works everywhere, including from the
  // keyboard.
  function nameOf(id) {
    const list = [...PEOPLE.values()];
    const n = list.findIndex(p => p.id === id);
    return personName(PEOPLE.get(id) || {}, n < 0 ? 0 : n);
  }

  function paintSelect() {
    document.body.classList.toggle("selecting", selectMode);
    selBar.hidden = !selectMode;
    mergeBtn.disabled = picked.size !== 2;
    if (selectMode) {
      const names = [...picked].map(nameOf);
      selText.textContent =
        picked.size === 0 ? "Pick the two cards that are the same person."
        : picked.size === 1
          ? `${names[0]} selected — now pick the other card.`
          : `${names[0]} and ${names[1]} are the same person?`;
    }
    for (const el of resEl.querySelectorAll(".pcard")) {
      el.setAttribute("aria-pressed",
                      picked.has(+el.dataset.person) ? "true" : "false");
    }
  }

  function armSelect() {
    selectMode = true;
    picked.clear();
    paintSelect();
  }

  function exitSelect() {
    if (!selectMode && !picked.size) return;
    selectMode = false;
    picked.clear();
    paintSelect();
  }

  function togglePick(id) {
    if (picked.has(id)) picked.delete(id);
    // Two is the whole operation, so a third press replaces the older pick
    // rather than being ignored — being ignored looks like a broken card.
    else {
      if (picked.size >= 2) picked.delete([...picked][0]);
      picked.add(id);
    }
    paintSelect();
  }

  async function mergePicked() {
    if (picked.size !== 2) return;
    // The one with more photographs keeps its id: it is the more established
    // person, more likely to be the named one, and the one whose links are worth
    // keeping. (The daemon carries a name across either way — see
    // store.merge_persons — so this is about the id, not the label.)
    const [a, b] = [...picked].map(id => PEOPLE.get(id) || { id });
    const keep = (b.photo_count || 0) > (a.photo_count || 0) ? b : a;
    const absorb = keep === a ? b : a;
    mergeBtn.disabled = true;
    try {
      await postJSON("/people/merge", { keep: keep.id, absorb: absorb.id });
    } catch (err) {
      selText.textContent = "Could not merge those two: " + err.message;
      mergeBtn.disabled = false;
      return;
    }
    picked.clear();
    paintSelect();
    await showPeople();
    schedulePoll(400);          // the people count in the pill moved
  }

  // ── naming somebody ───────────────────────────────────────────────────
  function openRename() {
    const p = PEOPLE.get(currentPerson());
    nameInput.value = (p && p.name) || "";
    renameBtn.hidden = true;
    nameForm.hidden = false;
    nameInput.focus();
    nameInput.select();
  }

  function closeRename() {
    nameForm.hidden = true;
    renameBtn.hidden = false;
  }

  async function saveName() {
    const id = currentPerson();
    if (id === null) return;
    const name = nameInput.value.trim();
    try {
      const out = await postJSON(`/people/${encodeURIComponent(id)}/rename`,
                                 { name });
      const p = PEOPLE.get(id);
      // The list we hold is what the heading reads, so it is updated from the
      // daemon's answer rather than from the input: the daemon trims and caps,
      // and the heading must show what was actually stored.
      if (p) p.name = (out.person || {}).name || null;
      closeRename();
      fillSubhead(id);
      // A name is also a search term now ("photos of Ana"), and the vocabulary
      // is read per query — so nothing needs invalidating, but the People index
      // and the pill count are stale.
      schedulePoll(400);
    } catch (err) {
      // Kept open with the message beside it: the name the user typed is still
      // in the field, which is the only copy of it.
      subwhenEl.textContent = "Could not save that name: " + err.message;
    }
  }

  // The heading over one trip's or one person's photos. Its own name and counts
  // come from the index we have already been given, so opening either is one
  // request, not two.
  function fillSubhead(id) {
    const person = currentView() === "person";
    backBtn.textContent = person ? "‹ People" : "‹ Trips";
    subFaceEl.hidden = true;
    renameBtn.hidden = !person;
    if (!person) {
      const t = TRIPS.get(id);
      subtitleEl.textContent = t ? (t.place || t.name) : "Trip";
      subwhenEl.textContent = t
        ? [dateSpan(t.start, t.end), plural(t.count, "photo")]
            .filter(Boolean).join(" · ")
        : "";
      return;
    }
    const list = [...PEOPLE.values()];
    const n = list.findIndex(p => p.id === id);
    const p = PEOPLE.get(id);
    subtitleEl.textContent = p ? personName(p, n < 0 ? 0 : n) : "Person";
    subwhenEl.textContent = p
      ? [plural(p.photo_count, "image"),      // see personCard on the word
         p.face_count === p.photo_count ? "" : plural(p.face_count, "face"),
         p.name ? "" : "not named yet"].filter(Boolean).join(" · ")
      : "";
    renameBtn.textContent = p && p.name ? "✎ Rename" : "✎ Name";
    if (p && p.cover_face_id != null) {
      subFaceImg.src = faceURL(p.cover_face_id, 200);
      subFaceEl.hidden = false;
    }
  }

  async function paintSubhead(view) {
    if (view !== "trip" && view !== "person") {
      subheadEl.hidden = true;
      closeRename();
      return;
    }
    const id = view === "person" ? currentPerson() : currentTrip();
    subheadEl.hidden = false;
    closeRename();
    fillSubhead(id);
    const have = view === "person" ? PEOPLE.has(id) : TRIPS.has(id);
    if (have) return;
    // A pasted link into a trip or a person arrives before either index has been
    // fetched, so the heading has no name yet. Fetch it and fill it in — best
    // effort, because the photos below do not depend on it, and guarded on the
    // same thing still being on screen, since this races a press on ‹ Back.
    try {
      if (view === "person") await fetchPeople(); else await fetchTrips();
    } catch (err) {
      return;                    // the grid is the answer; the name is a label
    }
    if (currentView() !== view) return;
    if (view === "person" ? currentPerson() === id : currentTrip() === id) {
      fillSubhead(id);
    }
  }

  // Opening a trip is two params for one state change, and `trip` goes first:
  // `view=trip` on its own is half a state (currentView sends it back to the
  // index), so writing it first would flash the index on the way in. With the
  // id written first, the intermediate is the screen the user is already looking
  // at — and route() drops it.
  function openTrip(id) {
    fused.params.set("trip", String(id));
    fused.params.set("view", "trip");
  }

  // ── routing ───────────────────────────────────────────────────────────
  // Three states, all of them in the URL, all of them reached the same way:
  // fused.params.onChange calls this for a click, for back/forward and for a
  // pasted link alike, so there is no state here the URL does not hold.
  //
  // `routed` is what was last rendered, keyed on *only the params this view
  // actually reads*. A state change that needs two writes arrives here as two
  // calls with an intermediate in between, and the key is what makes the
  // intermediate free: with `view=trips` on screen the trip id is not an input,
  // so setting it does not change the key and nothing repaints. Without this,
  // opening a trip re-fetched and re-animated the whole trip index first.
  let routed = null;
  function route() {
    const view = currentView();
    // The two index screens: neither of them applies the query, the scope or the
    // limit, so none of those is a reason to redraw one.
    const index = view === "trips" || view === "people";
    const key = [
      view,
      view === "trip" ? currentTrip() : "",
      view === "person" ? currentPerson() : "",
      index ? "" : fused.params.get("q") || "",
      index ? "" : currentScope(),
      index ? "" : currentLimit(),
      // The separator is written as an escape, never as the byte: a literal NUL
      // in this source made the whole file `binary` to grep, diff and every
      // review tool that asks the OS what it is looking at — the same rule
      // bannerKey states, and this line is where it had been lost. It stays a
      // NUL because no param value can contain one, so no set of params can
      // forge another state's key.
    ].join("\u0000");
    if (key === routed) return;
    routed = key;
    paintPills(view === "trips" || view === "trip" ? "trips"
               : (view === "people" || view === "person" ? "people" : "photos"));
    // Leaving the People index abandons a half-made merge: the two cards it was
    // about are no longer on screen, and a selection nobody can see is a button
    // that will act on a choice the user has forgotten making.
    if (view !== "people") exitSelect();
    paintSubhead(view);
    if (view === "trips") return showTrips();
    if (view === "people") return showPeople();
    return search();
  }

  // Re-render whatever is on screen even though the URL has not moved, because
  // the library underneath it has: an index run finished, or the daemon came
  // back. Deliberately not route() — its key guard exists to drop a repeated
  // state, and this is the one case where repeating one is the whole point.
  function refresh() {
    const view = currentView();
    if (view === "trips") return showTrips();
    if (view === "people") return showPeople();
    return search();
  }

  async function search() {
    const q = fused.params.get("q") || "";
    const scope = currentScope();
    // null unless this is one trip's photos. Read here rather than inside the
    // fetch so that everything below — the request, the page identity, the empty
    // state — is talking about the same trip.
    const trip = currentView() === "trip" ? currentTrip() : null;
    // ...and null unless this is one person's photographs. Same rule: read once,
    // here, so the request, the page identity and the empty state are all talking
    // about the same person.
    const person = currentView() === "person" ? currentPerson() : null;
    // Sync the box from the URL (back/forward, a deep link) — but never while
    // the user is in it. The first query of a session is the slow one (the
    // text tower's first forward pass), and it used to land *after* the first
    // keystrokes and write the old, empty param straight back over them: the
    // typing vanished and no search for it was ever issued.
    if (qEl.value !== q && document.activeElement !== qEl) qEl.value = q;
    document.body.classList.toggle("has-q", q.length > 0);
    paintScope(scope);

    const seq = ++reqSeq;
    // Skeletons are for a wait, and the usual wait here is ~120ms. Showing
    // them sooner just adds a state nobody asked to see; once something is
    // painted they never come back at all (the old results hold).
    clearTimeout(skelT);
    if (!painted) skelT = setTimeout(() => { if (seq === reqSeq) skeleton(); }, 400);
    busyOn();

    // An unreadable library and a query the API refused are different
    // failures, and the distinction is the same one this code was written
    // against when it was fetch(): a refusal carries a `code` (a bad page size,
    // a vector that does not match the index), and the library is fine — so
    // pollStatus must NOT treat the next poll as a recovery and re-issue the
    // rejected query forever. Anything with no code is the library itself not
    // answering.
    let data;
    try {
      data = await api("/query?q=" + encodeURIComponent(q)
                       + "&limit=" + currentLimit()
                       + "&scope=" + encodeURIComponent(scope)
                       + (trip === null ? "" : "&trip=" + encodeURIComponent(trip))
                       + (person === null ? "" : "&person="
                          + encodeURIComponent(person)));
    } catch (err) {
      if (seq !== reqSeq) return;
      busyOff();
      if (err.code) { searchFailed(err.code, err.message); return; }
      online = false;
      storeUnavailable(err);
      return;
    }
    // Re-checked after the await for the reason it always was: every `await` is
    // a point where a newer search can overtake this one, and without this a
    // slow-but-earlier response repaints over the newer query's results.
    if (seq !== reqSeq) return;
    online = true;                             // it answered: it is up
    {
      busyOff();                               // only the winner clears it
      hideMsg();

      clearTimeout(skelT);
      const model = buildModel(data, 0, q);
      ITEMS = model.items;
      const shown = ITEMS.length;
      const total = Number.isFinite(data.total) ? data.total : shown;
      page = { q, scope, trip, person, total, strong: model.strong,
               loading: false };
      renderChips(data.parsed || {}, shown, total, model.strong, q);
      animateIn(paint(model));
      painted = true;
      // nothing cleared the bar: the rows are still here, but they are the
      // closest-anyway tail, so they stay folded away behind the honest answer
      resEl.classList.toggle("hide-weak", model.strong === 0 && shown > 0);
      syncSentinel();                        // ...which decides the sentinel

      if (shown && model.strong === 0) {
        // A query with no strong match used to look exactly like a query with
        // several — a full grid of confident-looking cards. This is the state
        // the design critique found unreachable, and it is the whole point of
        // the horizon: say so, and let the user open the tail deliberately.
        showMsg(`<div class="ico">🤔</div><h3>No strong matches</h3>
          <p>Nothing in your library looks much like “${esc(q)}”.
          The ${esc(shown)} closest are here if you want to judge for
          yourself.</p>
          <button type="button" data-act="weak">Show the ${esc(shown)} closest</button>
          <button type="button" data-act="clear">Clear search</button>`);
      } else if (!shown) {
        resEl.replaceChildren();
        if (person !== null) {
          // Inside one person's photographs the library-wide counts are the wrong
          // scale — "nothing in 86 photos matches" is not what is on screen —
          // and an empty person is a real state: switching to the videos scope
          // empties somebody whose photographs are all stills.
          const who = PEOPLE.has(person) ? nameOf(person) : "this person";
          showMsg(`<div class="ico">🔍</div>
            <h3>${q ? "No matches for " + esc(who) : "Nothing to show here"}</h3>
            <p>${q ? `Nothing of ${esc(who)} matches “${esc(q)}”.`
                   : `${esc(who)} has no photos in the current scope.`}</p>
            ${q ? `<button type="button" data-act="clear">Clear search</button>` : ""}
            <button type="button" data-act="people">Back to people</button>`);
        } else if (trip !== null) {
          // Inside a trip, the library-wide counts are the wrong scale entirely
          // — "nothing in 86 photos matches" is not what the user is looking at.
          // And an empty trip with no query at all is a real state: the trip was
          // computed from photographs, so switching to a scope that excludes
          // them empties it.
          const t = TRIPS.get(trip);
          const where = t ? `“${esc(t.place || t.name)}”` : "this trip";
          showMsg(`<div class="ico">🔍</div>
            <h3>${q ? "No matches in this trip" : "Nothing to show in this trip"}</h3>
            <p>${q ? `Nothing in ${where} matches “${esc(q)}”.`
                   : `${where} holds no images in the current scope.`}</p>
            ${q ? `<button type="button" data-act="clear">Clear search</button>` : ""}
            <button type="button" data-act="trips">Back to trips</button>`);
        } else if (q) {
          // a filtered query found nothing. Never depends on the /status
          // counts, which are still null until the first poll lands.
          const searched = scopeCount(scope);
          const within = Number.isFinite(searched)
            ? ` in ${plural(searched, SCOPE_NOUN[scope])}`
            : "";
          // the rest of the library is indexed, just out of this scope — offer it
          // rather than let "no matches" read as "not in your library"
          const rest = scope !== "all" && Number.isFinite(lib.all_scope)
            && lib.all_scope > (searched || 0)
            ? `<button type="button" data-act="allscope">Search all
               ${esc(lib.all_scope)} images</button>` : "";
          showMsg(`<div class="ico">🔍</div><h3>No matches</h3>
            <p>Nothing${within} matches “${esc(q)}”.</p>
            ${rest}
            <button type="button" data-act="clear">Clear search</button>`);
        } else if (lib.indexing) {
          // mid-scan, and nothing has landed in this scope yet. Neither "no
          // photos yet" nor "none of them are photographs" is a claim anyone
          // can make about a library still being built.
          showMsg(`<div class="ico">⏳</div><h3>Indexing…</h3>
            <p>Reading your folders now — photos appear here as they are
            found.</p>`);
        } else if (scope === "videos" && lib.all_scope > 0) {
          // The library is not empty, it just holds no video — which is a fact
          // about the folders, not an error, and the extensions lens reads are
          // the actionable half of it.
          showMsg(`<div class="ico">🎬</div><h3>No videos here</h3>
            <p>${esc(plural(lib.all_scope, "file"))} indexed and none of them is
            a video. lens reads <code>.mp4</code>, <code>.mov</code>,
            <code>.m4v</code> and <code>.webm</code> in the folders you point it
            at.</p>
            <button type="button" data-act="allscope">Show all
              ${esc(lib.all_scope)} files</button>
            <button type="button" data-act="roots">Choose folders</button>`);
        } else if (scope === "photos" && lib.all_scope > 0) {
          // the library is not empty — it just holds no camera photos. Saying
          // "no photos yet" here would be a lie about indexed files.
          showMsg(`<div class="ico">🖼</div><h3>No photographs found</h3>
            <p>${esc(plural(lib.all_scope, "image"))} indexed, none of them
            identifiable as a camera photo (no camera, GPS or capture date).</p>
            <button type="button" data-act="allscope">Show all
              ${esc(lib.all_scope)} images</button>
            <button type="button" data-act="roots">Choose folders</button>`);
        } else if (lib.library !== "ready") {
          // ── the first run ────────────────────────────────────────────────
          // `!== "ready"` and not `=== "empty"`, because of a race that only
          // ever bites the state this branch is for. `route()` and
          // `pollStatus()` are started side by side at the bottom of this file,
          // so on the very first paint the query can land before the status
          // does and `lib.library` is simply not known yet. Unknown is treated
          // as first-run: on a machine where nothing is indexed that is what it
          // almost always is, and getting it wrong the other way — telling a
          // brand-new install "the last index run found nothing" — is the exact
          // first impression this whole branch exists to prevent. The mistake in
          // the harmless direction (an indexed library whose folders have since
          // been emptied, briefly shown the invitation) is corrected by the
          // repaint `pollStatus` does when its first status lands on a screen
          // that is showing a message rather than photographs.
          //
          // The whole screen a new install gets, and the only place lens is
          // ever asked to say what it is. It used to be a two-line "No photos
          // yet" — which was already the friendliest thing here, and still read
          // as an app that had lost its data rather than one that had not been
          // pointed at any yet. (Before that it was worse: lens_api.py refused
          // every op with "no library", so the screen was the red "Your library
          // isn't available" and there was no way forward at all.)
          //
          // Two states, not one, because there are two different next actions
          // and offering the wrong one is the whole failure mode: someone who
          // has already added a folder does not need to be asked to add a
          // folder, they need the scan to start. `root_paths` from /status is
          // what tells them apart.
          //
          // Same vocabulary as every other empty state on this page — one .ico,
          // one <h3>, prose, then the actions — because it is the same kind of
          // thing and a bespoke splash would be a second design language for
          // the screen a user sees exactly once.
          const roots = Array.isArray(lib.root_paths) ? lib.root_paths : [];
          if (!roots.length) {
            showMsg(`<div class="ico">🔍</div>
              <h3>Search your photos by describing them</h3>
              <p>Point lens at a folder of photos and videos and it reads every
              one of them — on this machine, nothing uploaded anywhere. Then you
              can search them the way you remember them: “beach at sunset”,
              “my red bike”, “Ana in Lisbon”.</p>
              <p>It also reads the dates, cameras and GPS in the files, groups
              them into trips, and finds the faces that keep coming back.</p>
              <button type="button" data-act="roots">Choose a photo folder</button>`);
          } else {
            // Folders are configured and nothing has ever been scanned. The
            // cost is said out loud rather than discovered: a first run is
            // minutes, and a button that silently starts one is how a laptop
            // gets warm for reasons nobody asked for.
            showMsg(`<div class="ico">🗂︎</div>
              <h3>Ready to read ${esc(plural(roots.length, "folder"))}</h3>
              <p>Nothing has been indexed yet. The first scan reads every photo
              and video under ${roots.length === 1 ? "it" : "them"}, makes a
              thumbnail and embeds it — minutes for a folder, longer for a whole
              library. It runs in the background and you can watch it in the
              activity list.</p>
              <button type="button" data-act="index">Start indexing</button>
              <button type="button" data-act="roots">Change folders</button>`);
          }
        } else {
          // An unfiltered query found nothing on a library that HAS been
          // indexed — so the folders are empty, or everything in them has been
          // deleted since. Not a first run (see the branch above), and saying
          // "point lens at a folder" here would be advice they already took.
          showMsg(`<div class="ico">🖼</div><h3>No photos yet</h3>
            <p>The last index run found nothing in the folders lens is watching.
            Add another folder, or re-scan if the photos have arrived since.</p>
            <button type="button" data-act="roots">Choose folders</button>`);
        }
      }
    }
  }

  // ── paging ────────────────────────────────────────────────────────────
  // A library of 1,700 files answers some queries with hundreds of rows, and
  // rendering hundreds of cards is the slow path — so the daemon serves a page
  // and the grid grows as the user reaches the bottom of it. The trigger is an
  // element below the last row rather than a button: reaching the end of the
  // results *is* the request for more.
  const sentinelEl = document.getElementById("sentinel");

  function syncSentinel() {
    // display:none is what stops the observer firing at all. Nothing below the
    // horizon is on screen while the weak tail is folded away, so there is no
    // "end of the results" to reach — and asking for page two of a set the
    // user has not been shown any of would page forever.
    sentinelEl.hidden = ITEMS.length >= page.total ||
                        resEl.classList.contains("hide-weak");
  }

  async function loadMore() {
    if (page.loading || ITEMS.length >= page.total) return;
    // Two things can retire this page while it is in flight, and the sequence
    // number only catches one of them. `reqSeq` says a newer *request* exists;
    // it does not say the request that landed was for the same query, because
    // search() reads page.q afresh. Query A's page two could be requested,
    // query B could land and replace the grid, and A's rows would then be
    // appended to B's results. search() installs a brand-new `page` object for
    // every query, so identity is the check that actually holds.
    const pageRef = page;
    const seq = reqSeq;
    const stale = () => pageRef !== page || seq !== reqSeq;
    pageRef.loading = true;
    let data;
    try {
      data = await api("/query?q=" + encodeURIComponent(pageRef.q)
                       + "&limit=" + currentLimit()
                       + "&scope=" + encodeURIComponent(pageRef.scope)
                       + (pageRef.trip == null ? ""
                          : "&trip=" + encodeURIComponent(pageRef.trip))
                       + (pageRef.person == null ? ""
                          : "&person=" + encodeURIComponent(pageRef.person))
                       + "&offset=" + ITEMS.length);
    } catch (err) {
      // A page that will not load is not worth destroying what is on screen
      // for. Stop asking; the results the user has stay exactly as they are.
      if (!stale()) { pageRef.loading = false; sentinelEl.hidden = true; }
      return;
    }
    if (stale()) return;                    // a newer query owns the UI now
    const model = buildModel(data, ITEMS.length, pageRef.q);
    // the note and the divider belong to the result set, not to each page of
    // it — whichever page happens to straddle the horizon draws it once
    const lastH2 = [...resEl.querySelectorAll("h2")].pop();
    model.sections = model.sections.filter((s, i) => {
      if (s.type === "note") return false;
      if (s.type === "horizon") return !resEl.querySelector(".horizon");
      // a month that straddles the page boundary is one month, not two: drop
      // the repeated heading so the grid below merges into the one above it
      if (s.type === "heading" && i === 0 && lastH2 &&
          lastH2.firstChild && lastH2.firstChild.textContent === s.text) return false;
      return true;
    });
    // Rows can shift between pages — an index run finishing mid-scroll
    // renumbers the ranking under us — so a page can re-serve a photo the grid
    // already holds. Appending it would put the same photo on screen twice and
    // give two cards the same key for the next reconcile to fight over.
    const have = new Set(ITEMS.map(it => String(it.id)));
    let dropped = 0;
    for (const sec of model.sections) {
      if (sec.type !== "grid") continue;
      sec.cards = sec.cards.filter(c => !have.has(String(c.it.id)));
      dropped += sec.cards.length;
    }
    model.sections = model.sections.filter(
      s => s.type !== "grid" || s.cards.length);
    if (!dropped) {
      // every row of this page is already on screen: another one would say the
      // same, so stop rather than spin against the observer
      pageRef.loading = false;
      sentinelEl.hidden = true;
      return;
    }
    const fresh = model.items.filter(it => !have.has(String(it.id)));
    // renumber what survived, so data-idx keeps indexing ITEMS
    let n = ITEMS.length;
    for (const sec of model.sections) {
      if (sec.type === "grid") for (const c of sec.cards) c.idx = n++;
    }
    ITEMS = ITEMS.concat(fresh);
    animateIn(paint(model, { append: true }));
    pageRef.total = Number.isFinite(data.total) ? data.total : pageRef.total;
    pageRef.loading = false;
    updateCount();
    syncSentinel();
  }

  // 600px of lead time: the next page is usually in hand before the last row
  // is on screen, so scrolling never stops at a spinner.
  new IntersectionObserver(entries => {
    if (entries.some(e => e.isIntersecting)) loadMore();
  }, { rootMargin: "600px" }).observe(sentinelEl);

  // ── EXIF panel ────────────────────────────────────────────────────────
  async function loadMeta(id) {
    if (META.has(id)) return META.get(id);
    const m = await api("/meta/" + encodeURIComponent(id));
    META.set(id, m);
    return m;
  }

  // every cell goes through esc(): these are values a stranger's camera wrote
  // into a file on disk, so they are untrusted input, not our own strings
  function tableRows(pairs) {
    return pairs
      .filter(([, v]) => v !== null && v !== undefined && v !== "")
      .map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`)
      .join("");
  }

  // "2026-07-14T13:25:27" → "14 Jul 2026, 13:25". Same reason as fmtDate for not
  // going near new Date(): these strings are local and tz-naive, and parsing
  // them would shift the time by the viewer's offset.
  function fmtWhen(iso) {
    const day = fmtDate(iso);
    if (!day) return "";
    const t = /T(\d{2}):(\d{2})/.exec(iso || "");
    return t ? `${day}, ${t[1]}:${t[2]}` : day;
  }

  // A file size a person can hold in their head. KB up to a megabyte, then MB —
  // "2412 KB" is a number you have to divide before it means anything.
  function fmtSize(bytes) {
    if (!bytes) return "";
    return bytes >= 1024 * 1024 ? (bytes / (1024 * 1024)).toFixed(1) + " MB"
                                : Math.round(bytes / 1024) + " KB";
  }

  function renderInfo(m) {
    // Read up here because two sections below it need it: the raw dump at the
    // bottom, and what Apple Photos knows about this picture — which travels
    // under `_apple` because the catalog has no column for an album list.
    const raw = (m.raw_exif && typeof m.raw_exif === "object") ? m.raw_exif : {};
    const ap = (raw._apple && typeof raw._apple === "object") ? raw._apple : null;
    const place = [m.place_city, m.place_region, m.place_country]
      .filter(Boolean).join(" · ");
    const when = fmtWhen(m.taken_at);
    // Where and when, at title size, because that is what the question "what is
    // this photo" is asking — and it used to be row eleven of an alphabetized
    // table, under "Folder" and "Format". With no place at all the date takes
    // the title, since it is then the whole answer.
    const head =
      (place ? `<p class="place">${esc(place)}</p>`
             + (when ? `<p class="when">${esc(when)}</p>` : "")
             : `<p class="place">${esc(when || "Undated")}</p>`)
      + (m.lat != null && m.lon != null
          // the geocode above is city-level, so the coordinates are the precise
          // fact and the place name is the readable one — both, in that order
          ? `<p class="sub">${esc(m.lat.toFixed(5))}, ${esc(m.lon.toFixed(5))}</p>`
          : "")
      + `<p class="fname">${esc(baseName(m.path))}</p>`;

    // An index error is the one thing here that is about lens rather than about
    // the photograph, and it belongs at the top: everything below it may be
    // missing *because* of it.
    const err = m.error
      ? `<div class="sec">Could not be indexed</div>
         <p class="err">${esc(m.error)}</p>` : "";

    const t = m.trip_id == null ? null : TRIPS.get(m.trip_id);
    const trip = m.trip_id == null ? "" :
      `<div class="sec">Trip</div>
       <button class="link" type="button" data-trip="${esc(m.trip_id)}"
         >${esc(t ? (t.place || t.name) : "Trip #" + m.trip_id)}</button>`;

    // What the Photos library knows and a file cannot say. The albums are
    // pressable for the same reason the auto-tags are: an album name is a
    // search (it is matched as a phrase — see store.apple_phrases), so the chip
    // runs the one it names.
    const apple = !ap ? "" :
      `<div class="sec">Apple Photos</div>`
      + (ap.title ? `<p class="body">${esc(ap.title)}${
            ap.favorite ? ` <span title="Favourite">★</span>` : ""}</p>`
          : (ap.favorite ? `<p class="body"><span title="Favourite">★</span>
               Favourite</p>`
              // A photo with no title, no albums and no star still has
              // something to say here, and it is the thing this section is for:
              // where the row came from. An empty heading says nothing.
              : ((ap.albums || []).length
                  ? "" : `<p class="body">In your Photos library</p>`)))
      + (ap.description ? `<p class="sub">${esc(ap.description)}</p>` : "")
      + ((ap.albums || []).length
          ? `<div class="chips">${(ap.albums || []).map(a =>
              `<button class="chip" type="button" data-tag="${esc(a)}"
                 title="${esc("Search this album")}">${esc(a)}</button>`).join("")}</div>`
          : "");

    // What a video is, where a photograph's Camera and Exposure cards go — the
    // same shape, because it answers the same question ("what am I looking at",
    // technically) with the facts a container has instead of the ones an IFD has.
    // A movie carries no camera and no exposure, so those two sections are
    // absent for it rather than empty.
    const v = (raw._video && typeof raw._video === "object") ? raw._video : null;
    const vfacts = m.kind !== "video" ? [] : [
      fmtDur(m.duration_s),
      m.width && m.height ? `${m.width} × ${m.height}` : null,
      v && v.fps ? `${v.fps} fps` : null,
      v && v.codec ? String(v.codec).toUpperCase() : null,
      m.format,
    ].filter(Boolean);
    const spec = vfacts.length
      ? `<div class="sec">Video</div><div class="chips">${vfacts.map(
          c => `<span class="chip">${esc(c)}</span>`).join("")}</div>`
      : "";

    const camera = (m.camera || m.lens)
      ? `<div class="sec">Camera</div>`
        + (m.camera ? `<p class="body">${esc(m.camera)}</p>` : "")
        + (m.lens ? `<p class="sub">${esc(m.lens)}</p>` : "")
      : "";

    // Four numbers that only mean anything together. As four table rows —
    // "Aperture" three lines above "Shutter", "ISO" between them — they read as
    // four unrelated facts; as one row of chips they read as one setting.
    const shot = [
      m.f_number ? "ƒ/" + m.f_number : null,
      m.exposure ? m.exposure + " s" : null,
      m.iso ? "ISO " + m.iso : null,
      m.focal_length ? m.focal_length + " mm" : null,
    ].filter(Boolean);
    const exposure = shot.length
      ? `<div class="sec">Exposure</div><div class="chips">${
          shot.map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div>`
      : "";

    // A video's dimensions and container are already in its own card above, so
    // its file line is only how much of the disk it is using.
    const facts = (m.kind === "video"
      ? [fmtSize(m.size)]
      : [m.width && m.height ? `${m.width} × ${m.height}` : null,
         fmtSize(m.size), m.format]
      ).filter(Boolean).join(" · ");
    // The full path, not the folder: it is what you paste into a terminal, and
    // it was previously split across a "Folder" row and a filename heading with
    // neither of them copyable.
    const file = `<div class="sec">File</div>`
      + (facts ? `<p class="body">${esc(facts)}</p>` : "")
      + `<div class="file"><code>${esc(m.path)}</code>
           <button class="copy" type="button"
                   aria-label="Copy file path">Copy</button></div>`;

    // Who is in it. Chips like the album names and the auto-tags, and pressable
    // for the same reason: a person is a filter, so pressing one opens their
    // photographs. A face lens has seen nowhere else is shown too, unnamed and
    // unpressable — "somebody is in this photo and I have not seen them again"
    // is the honest thing to say, and it is what tells a photo that has been
    // looked at from one that has not.
    const who = Array.isArray(m.people) ? m.people : [];
    const people = !who.length ? "" :
      `<div class="sec" title="Faces found in this photo, grouped into people
        entirely on this machine">In this photo</div>
       <div class="chips">${who.map(f => {
          const known = f.person_id != null;
          const label = f.name || (known ? "Unnamed person" : "Unknown face");
          const crop = `<img alt="" loading="lazy" decoding="async"
            src="${esc(faceURL(f.face_id, 200))}">`;
          return known
            ? `<button class="chip who" type="button"
                 data-person="${esc(f.person_id)}"
                 title="${esc("Show every photo of " + label)}"
                 >${crop}${esc(label)}</button>`
            : `<span class="chip who" title="${esc("Seen only here so far")}"
                 >${crop}${esc(label)}</span>`;
        }).join("")}</div>`;

    // Filled in by renderTags once /tags answers — it is the one thing on this
    // panel that is a computation rather than a lookup.
    const tags = `<div class="sec" title="The closest labels from a fixed
      vocabulary, scored against this photo’s own embedding">Looks like</div>
      <div id="tagbox"><p class="none">Reading…</p></div>`;

    const pairs = [];
    for (const k of Object.keys(raw).sort()) {
      // both shown as sections above, not as one JSON blob in a table row
      if (k === "_apple" || k === "_video") continue;
      let v = raw[k];
      if (v !== null && typeof v === "object") v = JSON.stringify(v);
      // Tags like GPSVersionID and the padding inside MakerNote are raw bytes.
      // Printed as-is they were rows of blank cells; printed escaped they were
      // rows of "\u0000\u0000\u0000". Neither is information — a value with
      // nothing printable in it has nothing to say, so it is not a row.
      if (typeof v === "string" && !/[^\x00-\x20\x7f]/.test(v)) continue;
      pairs.push([k, v]);
    }
    const exif = tableRows(pairs);
    // The raw dump is reference material for one photo in a hundred; everything
    // above it is what the panel is for. The order of these pieces is the whole
    // redesign: where and when, which trip, what took it, how it was exposed,
    // where the file is, what is in it — and only then the hundred tags.
    infoEl.innerHTML = head + err + apple + people + trip + spec + camera
      + exposure + file + tags +
      (exif
        ? `<details><summary>EXIF · ${esc(plural(pairs.length, "tag"))}</summary>
             <table>${exif}</table></details>`
        : `<div class="sec">EXIF</div>
           <p class="none">${m.kind === "video"
              ? "A movie container has no EXIF tags — what this one does say is "
                + "in the Video card above."
              : "This file carries no readable EXIF tags."}</p>`);
    renderTags(m.id);
  }

  // ── auto-tags ─────────────────────────────────────────────────────────
  // What the photo looks like, scored against a fixed ~70-label vocabulary
  // (lens/tags.py). The labels are embedded through the *same* sentence a typed
  // query is wrapped in, which is what makes a chip pressable: the score behind
  // the chip and the score behind the search it runs are the same number.
  async function loadTags(id) {
    if (TAGS.has(id)) return TAGS.get(id);
    const out = await api("/tags/" + encodeURIComponent(id));
    const tags = out.tags || [];
    TAGS.set(id, tags);
    return tags;
  }

  let tagSeq = 0;
  async function renderTags(id) {
    const seq = ++tagSeq;
    let tags;
    try {
      tags = await loadTags(id);
    } catch (err) {
      // The panel is rebuilt for every photo, so the box this fetch was started
      // for may be gone — and a newer photo's tags may already be in it.
      const box = document.getElementById("tagbox");
      if (seq === tagSeq && box) {
        box.innerHTML = `<p class="none">Could not read tags (${esc(err.message)}).</p>`;
      }
      return;
    }
    const box = document.getElementById("tagbox");
    if (seq !== tagSeq || !box) return;
    box.innerHTML = tags.length
      ? `<div class="chips">${tags.map(t =>
          `<button class="chip" type="button" data-tag="${esc(t.label)}"
             title="${esc("cosine " + t.score.toFixed(3) + " — search for this")}"
             >${esc(t.label)}</button>`).join("")}</div>`
      // Not "no tags": the labels are computed from this photo's vector, and a
      // row without one has not been embedded yet. That is a fact about the
      // index, not about the picture.
      : `<p class="none">No embedding for this file yet, so there is nothing to
         compare the labels against.</p>`;
  }

  function infoOpen() { return lightbox.classList.contains("info"); }
  const infoRoom = { w: 0 };            // px the EXIF panel has taken so far

  function setInfo(on) {
    lightbox.classList.toggle("info", on);
    infoBtn.setAttribute("aria-pressed", on ? "true" : "false");
    // The panel used to slide over the photo, so opening it meant losing sight
    // of the thing it describes. The frame gives up the width instead, in the
    // same beat as the panel arrives, and the photo re-centres in what is
    // left. Tweened through a number because the property it feeds sits inside
    // a calc(), and nothing can interpolate a string.
    const want = on ? Math.min(430, innerWidth * 0.92) : 0;
    const setRoom = w => lightbox.style.setProperty("--inforoom", w + "px");
    if (motion()) {
      gsap.to(infoRoom, {
        w: want, duration: 0.3, ease: "power3.out", overwrite: "auto",
        onUpdate: () => setRoom(infoRoom.w),
      });
    } else {
      infoRoom.w = want;
      setRoom(want);
    }
    if (on) refreshInfo();
  }

  async function refreshInfo() {
    const it = ITEMS[lightIdx];
    if (!it) return;
    const want = it.id;
    if (!META.has(want)) infoEl.innerHTML = `<p class="none">Loading metadata…</p>`;
    try {
      const m = await loadMeta(want);
      // navigation and closing both race this fetch
      if (infoOpen() && ITEMS[lightIdx] && ITEMS[lightIdx].id === want) renderInfo(m);
    } catch (err) {
      if (infoOpen() && ITEMS[lightIdx] && ITEMS[lightIdx].id === want) {
        infoEl.innerHTML =
          `<p class="none">Could not read this photo’s metadata (${esc(err.message)}).</p>`;
      }
    }
  }

  // ── dialogs: containment ──────────────────────────────────────────────
  const isOpen = el => el.classList.contains("open");
  const headerEl = document.querySelector("header");
  const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]),' +
    'select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

  // Which dialog owns the keyboard right now. The folder browser opens on top
  // of the settings sheet, and both open on top of the lightbox, so "topmost"
  // is a fixed order rather than a stack.
  function topDialog() {
    if (isOpen(browser)) return browser;
    if (isOpen(panel)) return panel;
    if (isOpen(lightbox)) return lightbox;
    return null;
  }

  // `aria-modal` is a promise to assistive tech, not a mechanism: Tab still
  // walked straight out of the lightbox into the 87 cards behind it. `inert`
  // is the mechanism — it takes the page behind the dialog out of the tab
  // order, out of the accessibility tree and out of pointer reach at once.
  function syncInert() {
    const top = topDialog();
    const closed = top === null;
    for (const el of [headerEl, bannerEl, subheadEl, selBar, chipsEl, resEl,
                      msgEl]) {
      el.inert = !closed;
    }
    panel.inert = top === browser;         // the sheet the browser sits over
    lightbox.inert = !closed && top !== lightbox;
  }

  function visible(el) {
    return el.checkVisibility
      ? el.checkVisibility({ visibilityProperty: true, contentVisibilityAuto: true })
      : el.offsetParent !== null;
  }

  // Tab cycles inside the open dialog instead of escaping it. Focus that has
  // drifted outside (a click on the backdrop, a removed node) is pulled back
  // to whichever end the user was heading for.
  function trapTab(e) {
    const top = topDialog();
    if (!top || e.key !== "Tab") return;
    const items = [...top.querySelectorAll(FOCUSABLE)].filter(visible);
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    const cur = document.activeElement;
    const inside = top.contains(cur);
    if (e.shiftKey ? (cur === first || !inside) : (cur === last || !inside)) {
      e.preventDefault();
      (e.shiftKey ? last : first).focus();
    }
  }

  // ── photo folders (roots) ─────────────────────────────────────────────
  // drawn rather than typed: the 🗀 codepoint has no glyph in the system font
  // stack and lands as a fallback box
  const FOLDER_SVG = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor"
    stroke-width="1.3" aria-hidden="true"><path d="M1.8 4.2h4l1.4 1.6h7v6.4a1 1 0
    0 1-1 1H2.8a1 1 0 0 1-1-1V4.2Z"/></svg>`;

  // ── the seam ──────────────────────────────────────────────────────────
  // Every call this page makes goes through here, and it still looks exactly
  // like the daemon's HTTP surface — `api("/trips")`, `postJSON("/roots", {…})`
  // — because that surface is what the four thousand lines around it are
  // written against. What changed is only what happens inside: a path is
  // translated into an `op` and its parameters, and fused.runPython answers it.
  //
  // The error contract is unchanged and is the reason this is not two lines:
  // lens_api.py returns `{error, message}` for anything it can explain, and
  // callers here branch on `err.code` (`confirm_home` asks for a second press,
  // `indexing unavailable` is rendered as a sentence). A rejection from
  // runPython itself — the subprocess died, the environment is missing — has no
  // `.code`, which is how the callers tell "it refused" from "nothing
  // answered".

  // What `/thumb/<id>` and `/people/<id>/face.webp` used to be. The daemon
  // rendered and served those bytes; now every response that mentions a photo
  // or a face carries the path of its cached file, and these two maps remember
  // them so that `thumbURL()` / `faceURL()` can stay the synchronous,
  // call-anywhere functions the rendering code needs. Harvested centrally, in
  // `remember()` below, rather than at each call site: a path arrives on a
  // query item, a trip cover, a person card, a meta row and a face chip, and
  // five places doing it is five places to forget it in.
  const MEDIA = new Map();          // photo id -> {thumb, full}
  const FACES = new Map();          // face id  -> crop path

  function remember(data) {
    if (!data || typeof data !== "object") return data;
    const photo = it => {
      if (it && it.id != null && (it.thumb || it.full)) {
        MEDIA.set(String(it.id), { thumb: it.thumb || null, full: it.full || null });
      }
    };
    // Array.isArray on every one of these, not `|| []`. The keys collide across
    // responses and not always with the same TYPE: /status carries `trips` as a
    // COUNT, and iterating a number throws — which would have been thrown on
    // the very first poll, before anything was ever drawn. The `people` key is
    // the other collision, and there it really is a list both times: person
    // cards on /people, face chips on /meta. Two loops with two guards rather
    // than one branch, because a response is allowed to be neither.
    const arr = v => (Array.isArray(v) ? v : []);
    photo(data);
    for (const g of arr(data.groups)) for (const it of arr(g.items)) photo(it);
    for (const t of arr(data.trips)) {
      if (t && t.cover_id != null && t.cover) {
        MEDIA.set(String(t.cover_id), { thumb: t.cover, full: null });
      }
    }
    for (const p of arr(data.people)) {
      if (p && p.cover_face_id != null && p.cover) FACES.set(String(p.cover_face_id), p.cover);
    }
    if (data.person && data.person.cover_face_id != null && data.person.cover) {
      FACES.set(String(data.person.cover_face_id), data.person.cover);
    }
    for (const f of arr(data.people)) {
      if (f && f.face_id != null && f.face_url) FACES.set(String(f.face_id), f.face_url);
    }
    return data;
  }

  // path (+ method) -> {op, params}. Named `endpoint` rather than `route`
  // because this page already has a `route()` — the one that decides which view
  // is on screen. Deliberately a translation of the daemon's
  // routes rather than a new vocabulary: the routes are what every call site in
  // this file already spells, and a table here is one place to read the mapping
  // instead of a hundred edited strings.
  function endpoint(path, opts) {
    const method = ((opts || {}).method || "GET").toUpperCase();
    const body = (opts || {}).body ? JSON.parse(opts.body) : {};
    const [base, qs] = path.split("?");
    const q = new URLSearchParams(qs || "");
    const num = k => (q.get(k) === null ? undefined : q.get(k));

    if (base === "/status") return { op: "status" };
    if (base === "/query") {
      return { op: "query", q: q.get("q") || "", limit: num("limit"),
               scope: num("scope"), offset: num("offset"),
               trip: num("trip"), person: num("person") };
    }
    if (base === "/trips") return { op: "trips" };
    if (base === "/people") return { op: "people" };
    if (base === "/people/merge") return { op: "people_merge", ...body };
    if (base === "/validate") return { op: "validate" };
    if (base === "/runs") return { op: "runs", limit: num("limit") };
    if (base === "/fs/dirs") return { op: "fs_dirs", path: q.get("path") || "" };
    if (base === "/reindex") return { op: "reindex" };
    if (base === "/config") return { op: "config", ...body };
    if (base === "/roots") {
      return method === "POST" ? { op: "roots_add", ...body } : { op: "roots" };
    }
    if (base === "/roots/remove") return { op: "roots_remove", ...body };
    let m = /^\/meta\/(\d+)$/.exec(base);
    if (m) return { op: "meta", id: m[1] };
    m = /^\/tags\/(\d+)$/.exec(base);
    if (m) return { op: "tags", id: m[1] };
    m = /^\/people\/(\d+)\/rename$/.exec(base);
    if (m) return { op: "person_rename", id: m[1], ...body };
    m = /^\/people\/(\d+)\/face$/.exec(base);
    if (m) return { op: "face", id: m[1], size: num("s") };
    return null;
  }

  // Params ride in a URL, so every value has to be a string. `undefined` means
  // "not asked for" and is dropped so `main()`'s own default applies; `null`
  // means the same thing and is dropped for the same reason — a literal "null"
  // reaching a typed parameter would be a coercion error rather than a default.
  function strings(params) {
    const out = {};
    for (const [k, v] of Object.entries(params)) {
      if (v === undefined || v === null) continue;
      out[k] = typeof v === "string" ? v : String(v);
    }
    return out;
  }

  // Vectors this page has already paid for, keyed by the exact sentence that
  // was embedded. Paging a result set, switching scope inside a query and
  // re-running the same search after an index all ask for the same sentence,
  // and each embedding is a forward pass through a 400M-parameter tower.
  const VECS = new Map();

  async function embedOne(text) {
    if (VECS.has(text)) return VECS.get(text);
    const vecs = await embedMany([text]);
    return vecs[0];
  }

  // fused.ai.embed takes at most 64 items per call (the server's own batch
  // ceiling), and the tag vocabulary is longer than that — so the chunking
  // lives here rather than at the one call site that needs it today.
  async function embedMany(texts) {
    const out = [];
    for (let i = 0; i < texts.length; i += 64) {
      const batch = texts.slice(i, i + 64);
      const res = await withModel(() =>
        fused.ai.embed({ texts: batch, model: EMBED_MODEL }));
      out.push(...res.vectors);
      batch.forEach((t, n) => VECS.set(t, res.vectors[n]));
    }
    return out;
  }

  // The first embedding on a machine that has never held these weights pulls
  // ~4.6GB. That is not a failure — the call *started* the download and handed
  // back its job id — so this shows it in the shell's download manager, waits,
  // and retries once. Anything else is rethrown with the code the callers
