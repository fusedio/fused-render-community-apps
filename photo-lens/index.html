  // branch on, so an unavailable model reads as a refusal rather than a crash.
  async function withModel(call) {
    try {
      return await call();
    } catch (err) {
      if (err.type !== "model_loading" || !err.jobId) throw asApiError(err);
      setStatus("busy", "loading the search model…");
      try {
        await fused.watchJob(err.jobId).watch(job => {
          const pct = job && job.total ? Math.round(100 * job.done / job.total) : null;
          setStatus("busy", pct === null
            ? "downloading the search model…"
            : `downloading the search model… ${pct}%`);
        });
      } catch (watchErr) {
        /* the watch is a progress display; the retry below is the real test */
      }
      try {
        return await call();
      } catch (again) {
        throw asApiError(again);
      }
    }
  }

  // An AI-side rejection, in the shape this page's own error handling reads.
  function asApiError(err) {
    const out = new Error(err.type === "ai_unavailable"
      ? "The search model isn’t available on this machine — " + err.message
      : err.message || "the embedding failed");
    out.code = err.type || "embed failed";
    return out;
  }

  async function api(path, opts) {
    const spec = endpoint(path, opts);
    if (!spec) {
      const err = new Error("No route for " + path);
      err.code = "not found";
      throw err;
    }
    // `key: null` opts out of fused-render's stale-request cancellation. Every
    // op shares one .py, so the default (cancel the previous call to this file)
    // would have the /status poll aborting the query it fired beside — and this
    // page already owns its own staleness, through `reqSeq` and the `page`
    // identity check that were written when this was fetch().
    const call = params => fused.runPython(API, strings(params), { key: null });

    let data = await call(spec);
    // The two handshakes. lens_api.py cannot embed anything, so where it needs
    // a vector it says which sentence to embed and this asks again with it.
    // Callers never see either state — they asked for a ranking or for tags,
    // and that is what comes back.
    if (data && data.need_embed) {
      const vec = await embedOne(data.need_embed);
      data = await call({ ...spec, vec: JSON.stringify(vec) });
    } else if (data && data.need_vocab) {
      const vecs = await embedMany(data.need_vocab);
      const built = await call({ op: "tag_vocab_build", vecs: JSON.stringify(vecs) });
      if (built && built.error) data = built;          // fall through to the throw
      else data = await call(spec);
    }
    if (data && data.error) {
      // lens_api.py says *why* it refused, in a sentence for the user and a
      // code to branch on — the daemon's `{error, message}` body, unchanged.
      const err = new Error(data.message || data.error);
      err.code = data.error;
      throw err;
    }
    return remember(data || {});
  }
  const postJSON = (path, obj) => api(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(obj),
  });

  function note(el, text, bad) {
    el.textContent = text || "";
    el.classList.toggle("bad", !!bad);
  }

  // every path here is a string from disk, so it is escaped like any other
  // untrusted value — both as text and inside the data-* attributes
  function renderRoots(roots) {
    if (!roots.length) {
      rootListEl.innerHTML = `<p class="none">No folders yet. Add one and lens
        will index the photos it finds — nothing leaves this machine.</p>`;
      return;
    }
    rootListEl.innerHTML = roots.map(r => {
      const p = esc(r.path);
      // A list of paths cannot answer the question this panel is opened with —
      // is this the folder my photos are in? The counts are the answer, and a
      // folder that contributed nothing is worth knowing about too.
      const n = Number.isFinite(r.photos)
        ? (r.images
            ? `${plural(r.photos, "photo")} · ${plural(r.images, "image")} indexed`
            : (r.exists ? "nothing indexed here yet" : ""))
        : "";
      return `<div class="row">
        <span class="p">${p}${n ? `<small>${esc(n)}</small>` : ""}</span>
        ${r.exists ? "" : `<span class="badge" title="lens can’t see this folder
          right now — its photos stay in the library">missing</span>`}
        ${r.path === askPath
          ? `<span class="ask">Remove?</span>
             <button class="btn danger" type="button" data-remove="${p}">Remove</button>
             <button class="btn" type="button" data-cancel="1">Cancel</button>`
          : `<button class="btn" type="button" data-ask="${p}"
                     title="Remove this folder"
                     aria-label="Remove ${p}">✕</button>`}
      </div>`;
    }).join("");
  }

  // ── Apple Photos ──────────────────────────────────────────────────────
  // A second source of photographs, and the only one that needs asking twice:
  // reading it wants a macOS permission the user grants by hand, and the first
  // sync of a real library is long. Both are things to opt into.
  const APPLE_ASK = `Read your Apple Photos library? lens indexes the originals
    where they are — it never copies them and never writes to the library. The
    first sync can take a while, and macOS may ask you to allow access.`;

  function appleStatusLine(a) {
    const last = a.last;
    if (!a.enabled) {
      return "Off. Your library is not read.";
    }
    if (last && last.error) return "";        // the error itself says more
    const bits = [];
    bits.push(plural(a.rows, "photo") + " indexed");
    // The offloaded count is the one number that explains a total the user may
    // find short: those originals are in iCloud, not on this Mac, and lens will
    // not download them.
    if (last && last.offloaded) {
      bits.push(last.offloaded + " still in iCloud, not on this Mac");
    }
    if (last && last.movies) bits.push(plural(last.movies, "video") + " skipped");
    if (last && last.at) bits.push("synced " + fmtWhen(last.at));
    return bits.join(" · ");
  }

  function renderApple(a) {
    if (!a) {
      appleBoxEl.innerHTML =
        `<p class="none">This daemon is too old to read Apple Photos.</p>`;
      return;
    }
    const err = a.enabled && a.last && a.last.error ? a.last.error : "";
    const line = appleStatusLine(a);
    appleBoxEl.innerHTML = `<div class="row">
        <span class="p">Your Photos library${
          line ? `<small>${esc(line)}</small>` : ""}</span>
        ${err ? `<span class="badge" title="${esc(err)}">blocked</span>`
              : (a.enabled ? `<span class="badge ok">on</span>` : "")}
        <button class="btn${a.enabled ? "" : " primary"}" type="button"
                data-apple="${a.enabled ? "off" : "on"}">${
          a.enabled ? "Turn off" : "Turn on"}</button>
      </div>
      ${err ? `<p class="note bad">${esc(err)}</p>` : ""}
      <div class="confirm ask" id="appleconfirm" hidden>
        <span>${esc(APPLE_ASK)}</span>
        <button class="btn primary" type="button" data-apple="yes">Turn it on</button>
      </div>`;
  }

  async function setApple(enabled) {
    try {
      afterEdit(await postJSON("/config", { apple_photos: enabled }),
                enabled ? "Reading your Photos library"
                        : "Apple Photos turned off",
                "That is already the setting.");
    } catch (err) {
      note(panelNote, "Could not change that setting: " + err.message, true);
      loadRoots();
    }
  }

  // ── last index run + memory limit ───────────────────────────────────────
  // What each stage is called and drawn in, in the settings panel's stage
  // bar. One dict rather than two parallel ones, so a stage can never have a
  // label without a colour or the other way round.
  const STAGE_INFO = {
    walk_s: ["walk", "#7c7f88"], metadata_s: ["metadata", "#7fb2ff"],
    thumbs_s: ["thumbs", "#c792ea"], embed_s: ["embed", "#e5ff44"],
    faces_s: ["faces", "#ff8a5b"], trips_s: ["trips", "#9bd48c"],
    apple_s: ["apple", "#ffb3b3"],
  };

  function fmtRunDuration(s) {
    if (s == null) return "—";
    if (s < 60) return s.toFixed(1) + "s";
    const m = Math.floor(s / 60), r = Math.round(s % 60);
    return `${m}m ${r}s`;
  }

  // The bar reads real measurements off the daemon (see indexer.index_once's
  // `stages`), so it is only ever as detailed as the run that just finished —
  // a stage with no time in it (Apple Photos switched off, no faces found to
  // scan) simply has no segment, rather than a sliver claiming a duration
  // that was never spent.
  function renderRunStats(li) {
    if (!li || li.duration_s == null) {
      runStatsEl.innerHTML = `<p class="none">No index run yet.</p>`;
      return;
    }
    const stages = li.stages || {};
    const total = Object.keys(STAGE_INFO)
      .reduce((sum, k) => sum + (stages[k] || 0), 0) || 1;
    const segs = Object.keys(STAGE_INFO).filter(k => stages[k] > 0);
    const bar = segs.map(k => {
      const [label, colour] = STAGE_INFO[k];
      const pct = (stages[k] / total * 100).toFixed(1);
      return `<i class="stageseg" style="flex:${pct} 0 0;background:${colour}"
                title="${esc(label)} · ${esc(stages[k].toFixed(1))}s"></i>`;
    }).join("");
    const legend = segs.map(k => {
      const [label, colour] = STAGE_INFO[k];
      return `<span><i style="background:${colour}"></i>${esc(label)}
        · ${esc(stages[k].toFixed(1))}s</span>`;
    }).join("");
    const errNote = li.error ? `<p class="note bad">${esc(li.error)}</p>` : "";
    runStatsEl.innerHTML = `
      <div class="runline">
        <span><b>${esc(fmtRunDuration(li.duration_s))}</b><small>duration</small></span>
        <span><b>${li.rate != null ? esc(li.rate) : "—"}</b><small>files/s (embed)</small></span>
        <span><b>${li.mem_peak_gb != null ? esc(li.mem_peak_gb) + "GB" : "—"}</b><small>peak memory</small></span>
      </div>
      <div class="stagebar" role="img" aria-label="Time spent per index stage">${bar}</div>
      <div class="statlegend">${legend}</div>
      ${errNote}`;
    if (motion() && segs.length) {
      gsap.from(runStatsEl.querySelectorAll(".stageseg"), {
        scaleX: 0, transformOrigin: "0% 50%", duration: 0.4, ease: "power2.out",
        stagger: 0.03, overwrite: "auto", clearProps: "transform",
      });
    }
  }

  function renderMemLimit(gb) {
    memBoxEl.innerHTML = `<div class="memrow">
        <label for="meminput">Pause and checkpoint safely if an index run
          passes this<small>Progress is always saved — raising this only
          changes when lens decides to stop and wait instead of pressing on.</small></label>
        <input id="meminput" type="number" min="0.5" step="0.5"
               value="${esc(gb)}" aria-label="Memory limit in gigabytes">
        <span class="unit">GB</span>
        <button class="btn" type="button" id="memsave">Save</button>
      </div>`;
    document.getElementById("memsave").addEventListener("click", async () => {
      const v = parseFloat(document.getElementById("meminput").value);
      if (!(v > 0)) {
        note(panelNote, "Enter a number greater than 0.", true);
        return;
      }
      try {
        const out = await postJSON("/config", { max_index_memory_gb: v });
        note(panelNote, `Memory limit set to ${out.max_index_memory_gb}GB.`);
        renderMemLimit(out.max_index_memory_gb);
      } catch (err) {
        note(panelNote, "Could not set the memory limit: " + err.message, true);
      }
    });
  }

  async function loadRoots() {
    try {
      const out = await api("/roots");
      renderRoots(out.roots || []);
      renderApple(out.apple);
      renderMemLimit(out.max_index_memory_gb);
      renderRunStats(lib.last_index);
    } catch (err) {
      rootListEl.innerHTML =
        `<p class="none">Could not read the folder list (${esc(err.message)}).</p>`;
      appleBoxEl.innerHTML = "";
      runStatsEl.innerHTML = "";
      memBoxEl.innerHTML = "";
    }
  }

  // An edit is only half the story: the daemon reindexes to pick it up, unless
  // the edit changed nothing (no scan, and none needed) or a run was already
  // going — then it kept the old roots and this change needs the next one,
  // which is what the Reindex button is for.
  function afterEdit(out, what, nothing) {
    renderRoots(out.roots || []);
    renderApple(out.apple);
    if (out.changed === false) {
      note(panelNote, nothing);
    } else if (out.reindexing) {
      wasIndexing = true;                  // so finishing re-runs the query
      setStatus("busy", "indexing…");
      note(panelNote, what + " — indexing…");
    } else {
      note(panelNote, what + " — a scan is already running; press “Reindex now”"
                    + " when it finishes to pick this up.");
    }
    schedulePoll(400);
  }

  function hideHomeConfirm() {
    homeConfirm.hidden = true;
    pendingHome = null;
  }

  async function addRoot(path, confirm) {
    if (!path) return false;
    hideHomeConfirm();
    try {
      afterEdit(await postJSON("/roots", { path, confirm: !!confirm }),
                "Added " + path, "That folder is already in the list.");
      return true;
    } catch (err) {
      // the home directory is allowed, but only when asked for twice: its
      // first scan is long enough that a mis-click must not start one
      if (err.code === "confirm_home") {
        pendingHome = path;
        homeAsk.textContent = err.message;
        homeConfirm.hidden = false;
        note(browserNote, "");
        return false;
      }
      note(panelNote, "Could not add that folder: " + err.message, true);
      note(browserNote, "Could not add that folder: " + err.message, true);
      return false;
    }
  }

  async function removeRoot(path) {
    askPath = null;
    try {
      afterEdit(await postJSON("/roots/remove", { path }), "Removed " + path,
                "That folder isn’t in the list.");
    } catch (err) {
      note(panelNote, "Could not remove that folder: " + err.message, true);
      loadRoots();
    }
  }

  function openPanel() {
    if (isOpen(panel)) return;
    panelFocus = document.activeElement;
    askPath = null;
    note(panelNote, "");
    rootListEl.innerHTML = `<p class="none">Loading…</p>`;
    appleBoxEl.innerHTML = "";
    panel.classList.add("open");
    syncInert();                 // before the focus move, or it lands on <body>
    loadRoots();
    document.getElementById("addbtn").focus();
  }
  function closePanel() {
    if (!isOpen(panel)) return;
    closeBrowser();
    panel.classList.remove("open");
    askPath = null;
    syncInert();                 // the page is reachable again before focus returns
    if (panelFocus && panelFocus.isConnected) panelFocus.focus();
  }

  async function browseTo(path) {
    dirListEl.innerHTML = `<p class="none">Loading…</p>`;
    let out;
    try {
      out = await api("/fs/dirs" + (path ? "?path=" + encodeURIComponent(path) : ""));
    } catch (err) {
      dirListEl.innerHTML =
        `<p class="none">Could not open that folder (${esc(err.message)}).</p>`;
      return;
    }
    browseDir = out.path;
    browseParent = out.parent;
    crumbEl.textContent = out.path;          // textContent needs no escaping
    upBtn.disabled = !out.parent;
    const dirs = out.dirs || [];
    dirListEl.innerHTML = dirs.length
      ? dirs.map(d => `<button class="dir" type="button" data-dir="${esc(d.path)}">
          ${FOLDER_SVG}<span class="nm">${esc(d.name)}</span>
          <span class="go" aria-hidden="true">›</span></button>`).join("")
      : `<p class="none">No subfolders here — “Use this folder” adds this one.</p>`;
  }

  function openBrowser() {
    note(browserNote, "");
    hideHomeConfirm();
    pasteEl.value = "";
    browser.classList.add("open");
    syncInert();
    browseTo(null);                          // starts at the home directory
    document.getElementById("usebtn").focus();
  }
  function closeBrowser() {
    if (!isOpen(browser)) return;
    browser.classList.remove("open");
    syncInert();
    document.getElementById("addbtn").focus();
  }

  // ── lightbox ──────────────────────────────────────────────────────────
  // What `/thumb/<id>?s=<n>` was. Synchronous, because it is called from inside
  // template strings that are building HTML — so the path has to already be
  // known, which is what `MEDIA` (filled by `remember()`, at the seam) is for.
  //
  // Two sizes, and only two, exactly as the daemon offered: 512 is the tile,
  // anything larger is the lightbox. The daemon answered the large one by
  // rendering a 2048px thumbnail on demand; nothing in a page's subprocess can
  // — a HEIC needs pillow-heif, a video frame needs ffmpeg — so the large size
  // resolves to the *original file* where the browser can decode it itself, and
  // falls back to the 512px thumbnail where it cannot. setLightImage already
  // treats the thumbnail as a perfectly good fallback, which is what makes that
  // degradation invisible rather than broken.
  const thumbURL = (id, size) => {
    const m = MEDIA.get(String(id));
    if (!m) return "";
    const want = size > 512 ? (m.full || m.thumb) : m.thumb;
    return want ? fused.rawUrl(want) : "";
  };
  const cardFor = idx => resEl.querySelector(`.card[data-idx="${idx}"] img`);

  // Show the 512px thumbnail the grid already has — it is decoded, so the
  // frame is filled and *laid out* on the spot — then swap in the full-size
  // render when it arrives. Without this the lightbox opened onto an empty
  // box, and there was no geometry for the Flip to animate towards.
  let fullSeq = 0;
  function setLightImage(it) {
    const seq = ++fullSeq;
    lightimg.src = thumbURL(it.id, 512);
    lightimg.alt = baseName(it.path);
    const full = new Image();
    full.src = thumbURL(it.id, 2048);
    full.decode().then(() => {
      if (seq === fullSeq && lightIdx >= 0) lightimg.src = full.src;
    }).catch(() => { /* the thumbnail is a perfectly good fallback */ });
  }

  function lightCaption(it, idx) {
    lightcap.innerHTML =
      `<b>${esc(baseName(it.path))}</b>` +
      [fmtDate(it.taken_at), it.place_city, it.camera, fmtDur(it.duration_s)]
        .filter(Boolean).map(x => `<span>${esc(x)}</span>`).join("") +
      `<span>${idx + 1} / ${ITEMS.length}</span>`;
  }

  // ── playing a video ───────────────────────────────────────────────────
  // The bytes come from fused-render's own raw-file route, not from the lens
  // daemon: the runtime already serves any absolute path off local disk with a
  // correct content-type and Range support, which is what a <video> needs to seek
  // — and it means the daemon never has to become a media server.
  //
  // The poster is the 512px thumbnail, which is decoded and in the browser's
  // cache because the tile behind the lightbox is showing it. So the frame is
  // there before a single byte of video has arrived, and it is the same frame:
  // the index rendered it from the middle of the clip (thumbs.ensure_video_thumb).
  function setLightVideo(it) {
    stopVideo();
    fallText.textContent = "";
    lightvid.poster = thumbURL(it.id, 512);
    lightvid.src = fused.rawUrl(it.path);
    const played = lightvid.play();
    // A refused autoplay is not a failure — the controls are right there. It
    // rejects rather than throwing, and an unhandled rejection in the console is
    // noise that looks like a bug.
    if (played && played.catch) played.catch(() => {});
  }

  // Pausing is not enough: a <video> holding a src keeps its request open and
  // keeps buffering off disk after the element is hidden. Closing the lightbox
  // has to let go of the file.
  function stopVideo() {
    if (!lightvid.getAttribute("src")) return;
    lightvid.pause();
    lightvid.removeAttribute("src");
    lightvid.removeAttribute("poster");
    lightvid.load();                     // drops the buffer and the open read
  }

  // The browser refused the file — a codec it does not ship (ffmpeg decodes far
  // more than Chromium will play), or a container it will not demux. lens has
  // already rendered a true frame of it, so the honest answer is that frame, what
  // happened, and the path: no browser can hand a local file to another
  // application, and a file:// link from an http page is blocked outright, so the
  // path *is* the way out.
  function playbackFailed() {
    const it = ITEMS[lightIdx];
    if (!it || !isVideo(it) || !lightvid.getAttribute("src")) return;
    // it is hidden from here on, and a hidden <video> left running keeps reading
    // the file and playing its sound
    lightvid.pause();
    lightbox.classList.add("fallback");
    fallShot.src = thumbURL(it.id, 2048);
    fallShot.alt = baseName(it.path);
    fallText.textContent =
      "This browser will not play this file — the frame above is from it. "
      + "Open it in your usual player:";
    fallPath.textContent = it.path;
  }

  // One of two things, chosen by the row rather than by anything the user did.
  function setLightMedia(it) {
    lightbox.classList.toggle("video", isVideo(it));
    lightbox.classList.remove("fallback");
    if (isVideo(it)) setLightVideo(it);
    else { stopVideo(); setLightImage(it); }
  }

  // ── signature moment: the lightbox remembers where it came from ─────────
  // The photo grows out of the card that was clicked and, on the way out,
  // flies back to whichever card is showing now — which is not the same card
  // if the arrow keys have been used since.
  async function openLight(idx) {
    const it = ITEMS[idx];
    if (!it) return;
    const opening = !isOpen(lightbox);
    // navLight() re-enters here while the lightbox is open; capturing then
    // would overwrite the originating card with our own close button
    if (opening) lastFocus = document.activeElement;
    const from = opening ? cardFor(idx) : null;

    lightIdx = idx;
    setLightMedia(it);
    lightCaption(it, idx);
    lightbox.classList.add("open");
    syncInert();
    if (infoOpen()) refreshInfo();       // keep the panel with the new photo
    document.getElementById("close").focus();

    if (!opening || !motion()) return;
    // The photo grows out of the card it came from; a video does not. The flight
    // is a transform on a decoded still, and a <video> is being decoded and
    // composited by the browser as it plays — tweening it fights that for no
    // visible gain, and the element the Flip would measure is showing a poster
    // that is about to be replaced. It arrives with the backdrop instead.
    if (isVideo(it)) {
      gsap.fromTo(lightbox, { opacity: 0 },
                  { opacity: 1, duration: 0.2, ease: "none", overwrite: "auto" });
      return;
    }
    // The destination rect only exists once the thumbnail is decoded and the
    // grid row has sized itself around it.
    await lightimg.decode().catch(() => {});
    if (lightIdx !== idx) return;        // closed or navigated while decoding
    if (from && from.isConnected) {
      // Flip.fit does the geometry — put the photo exactly over the card it
      // came from — and then it is let go of, back to where it belongs.
      //
      // (Not Flip.from() with a shared data-flip-id: the card is still in the
      // DOM behind the backdrop, so Flip resolves the recorded element to the
      // card itself and animates that instead. The photo arrived by jump-cut.)
      Flip.fit(lightimg, from, { scale: true });
      gsap.to(lightimg, {
        x: 0, y: 0, scaleX: 1, scaleY: 1,
        duration: 0.42, ease: EASE_SHEET, overwrite: "auto",
        clearProps: "transform",
      });
    }
    // the backdrop arrives with the photo, not ahead of it
    gsap.fromTo(lightbox, { opacity: 0 },
                { opacity: 1, duration: 0.2, ease: "none", overwrite: "auto" });
  }

  function finishClose() {
    lightbox.classList.remove("open");
    lightbox.style.opacity = "";
    if (gsap) gsap.set(lightimg, { clearProps: "all" });
    setInfo(false);
    lightIdx = -1;
    fullSeq++;                            // retire any full-size load in flight
    syncInert();
    lightimg.removeAttribute("src");
    stopVideo();                          // …and let go of the file it was reading
    lightbox.classList.remove("video", "fallback");
    if (lastFocus && lastFocus.isConnected) lastFocus.focus();
  }

  function closeLight() {
    if (!isOpen(lightbox)) return;
    const target = cardFor(lightIdx);
    // whatever else fails, the lightbox closes: a stuck-open dialog holds
    // `inert` over the whole page behind it — and a video closes without the
    // flight, for the same reason it opened without one
    if (!motion() || !target || isVideo(ITEMS[lightIdx])) return finishClose();
    // the grid comes to meet it: closing onto a card that is scrolled off
    // screen would be a flight to nowhere
    target.scrollIntoView({ block: "center", behavior: "auto" });
    lastFocus = target.closest(".card") || lastFocus;
    try {
      Flip.fit(lightimg, target, {
        duration: 0.34, ease: EASE_SHEET, scale: true, onComplete: finishClose,
      });
      gsap.to(lightbox, { opacity: 0, duration: 0.28, ease: "none" });
    } catch (err) {
      finishClose();
    }
  }

  function navLight(d) {
    if (lightIdx < 0 || !ITEMS.length) return;
    const next = (lightIdx + d + ITEMS.length) % ITEMS.length;
    // The slide is a transform on #lightimg, and a step onto or off a video swaps
    // which element is in the row — so there is nothing continuous to animate.
    // A plain swap, rather than a tween of the wrong element.
    if (!motion() || isVideo(ITEMS[next]) || isVideo(ITEMS[lightIdx])) {
      return openLight(next);
    }
    // out the way it is going, in from the way it came
    gsap.timeline()
      .to(lightimg, { x: d * -24, opacity: 0, duration: 0.18, ease: "power2.in" })
      .add(() => openLight(next))
      .fromTo(lightimg, { x: d * 24, opacity: 0 },
              { x: 0, opacity: 1, duration: 0.26, ease: "power3.out" }, "-=0.12");
  }

  // ── events ────────────────────────────────────────────────────────────
  function pushQuery(v) {
    if ((fused.params.get("q") || "") === v) return;   // no redundant refetch
    fused.params.set("q", v);
  }

  // Written to the URL even for the default, so the link says what it shows —
  // and paintScope runs immediately, because a segmented control that waits for
  // a round trip feels broken.
  function pushScope(v) {
    if (currentScope() === v) return;
    paintScope(v);
    fused.params.set("scope", v);
  }

  // 200ms is the coalescing window for the keystrokes *between* words. It is
  // not a wait the user has to sit through at the end of one: Enter says the
  // query is finished, and answers immediately.
  //
  // (OpenIndex splits this further — structured-only queries answer on the
  // keystroke because they never touch the model. Lens cannot tell a
  // structured query from a semantic one without asking the daemon to parse
  // it, so it keeps one window and gives Enter the escape hatch.)
  qEl.addEventListener("input", () => {
    document.body.classList.toggle("has-q", qEl.value.length > 0);
    // Typing while the trip index is on screen is a search, and there is nothing
    // on that screen for a search to filter — so the first keystroke leaves it.
    // Done here rather than in pushQuery so it happens once, on the transition,
    // instead of on every keystroke of the word being typed.
    if (qEl.value && (currentView() === "trips" || currentView() === "people")) {
      fused.params.set("view", "");
    }
    clearTimeout(debounceT);
    debounceT = setTimeout(() => pushQuery(qEl.value), 200);
  });
  qEl.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    clearTimeout(debounceT);
    pushQuery(qEl.value);
  });
  document.getElementById("clear").addEventListener("click", () => {
    clearTimeout(debounceT);
    qEl.value = "";
    pushQuery("");
    qEl.focus();
  });

  resEl.addEventListener("click", e => {
    const el = e.target.closest(".card");
    if (el) { setRover(el); openLight(+el.dataset.idx); return; }
    const t = e.target.closest(".tcard");
    if (t) { openTrip(t.dataset.trip); return; }
    const p = e.target.closest(".pcard");
    // One press, two meanings, decided by the mode the user turned on — never by
    // a modifier key nobody would find.
    if (p) {
      if (selectMode) togglePick(+p.dataset.person);
      else openPerson(p.dataset.person);
    }
  });
  resEl.addEventListener("keydown", e => {
    if (!document.activeElement || !document.activeElement.closest(".card")) return;
    const moves = { ArrowRight: 1, ArrowLeft: -1,
                    ArrowDown: rowStride(), ArrowUp: -rowStride() };
    if (!(e.key in moves)) return;
    e.preventDefault();
    rove(moves[e.key]);
  });
  // broken thumb → labelled placeholder instead of a browser broken-image box
  resEl.addEventListener("error", e => {
    if (e.target.tagName === "IMG") e.target.parentElement.classList.add("bad");
  }, true);

  msgEl.addEventListener("click", e => {
    const act = e.target.dataset.act;
    if (act === "retry") { hideMsg(); skeleton(); refresh(); }
    if (act === "retrytrips") { hideMsg(); showTrips(); }
    if (act === "retrypeople") { hideMsg(); showPeople(); }
    if (act === "trips") nav("trips");
    if (act === "people") nav("people");
    if (act === "photos") nav("photos");
    if (act === "clear") { pushQuery(""); qEl.focus(); }
    if (act === "roots") openPanel();
    if (act === "index") startIndexing();
    if (act === "allscope") pushScope("all");
    // the weak tail was never hidden from the user, only from the impression
    // that it answered the question
    if (act === "weak") {
      hideMsg();
      resEl.classList.remove("hide-weak");
      syncSentinel();                        // there is an end to reach again
    }
  });

  scopeEl.addEventListener("click", e => {
    const btn = e.target.closest("button[data-scope]");
    if (btn) pushScope(btn.dataset.scope);
  });

  chipsEl.addEventListener("click", e => {
    if (e.target.closest('button[data-act="select"]')) armSelect();
  });

  selBar.addEventListener("click", e => {
    if (e.target === mergeBtn) mergePicked();
    if (e.target.id === "selcancel") exitSelect();
  });

  // Naming is a form so that Enter submits and Esc cancels without either being
  // wired by hand — and so a screen reader is told it is one.
  renameBtn.addEventListener("click", openRename);
  document.getElementById("namecancel").addEventListener("click", () => {
    closeRename();
    fillSubhead(currentPerson());          // drop any error left in the sub-line
  });
  nameForm.addEventListener("submit", e => { e.preventDefault(); saveName(); });
  nameInput.addEventListener("keydown", e => {
    // Esc inside the field means "stop editing", not "leave this person" — the
    // document-level handler would otherwise clear the query or go back.
    if (e.key === "Escape") { e.stopPropagation(); closeRename(); }
  });

  pillsEl.addEventListener("click", e => {
    const b = e.target.closest("button[data-nav]");
    // the current pill is not a link to where you already are
    if (b && b.getAttribute("aria-current") !== "page") nav(b.dataset.nav);
  });
  backBtn.addEventListener("click", () =>
    nav(currentView() === "person" ? "people" : "trips"));

  // The details panel is three kinds of control in one, so it is one delegated
  // listener: the panel's HTML is rebuilt for every photo, and per-element
  // listeners would have to be re-bound with it.
  infoEl.addEventListener("click", e => {
    const tag = e.target.closest("button[data-tag]");
    if (tag) {
      // A tag is a query, so pressing it runs one — and closes the lightbox,
      // because the answer is behind it and a grid of results under an open
      // photo is a search nobody can see. `view` and `trip` are left alone:
      // pressed inside a trip this means "more of this, here", and the heading
      // above the grid says so.
      const q = tag.dataset.tag;
      closeLight();
      qEl.value = q;
      clearTimeout(debounceT);
      pushQuery(q);
      return;
    }
    const t = e.target.closest("button[data-trip]");
    if (t) { closeLight(); openTrip(t.dataset.trip); return; }
    const who = e.target.closest("button[data-person]");
    if (who) { closeLight(); openPerson(who.dataset.person); return; }
    const copy = e.target.closest("button.copy");
    if (copy) {
      // read back out of the DOM rather than off a data-* attribute: a photo
      // path can be any length, and there is no reason to carry a second copy
      // of it through the markup
      const code = copy.parentElement.querySelector("code");
      navigator.clipboard.writeText(code ? code.textContent : "").then(
        () => { copy.textContent = "Copied"; },
        () => { copy.textContent = "Select it"; });
    }
  });

  document.getElementById("bannerx").addEventListener("click", () => {
    bannerDismissed = bannerKey(bannerTextEl.textContent);   // session-only
    bannerEl.hidden = true;
  });

  // ── folder settings events ────────────────────────────────────────────
  document.getElementById("gear").addEventListener("click", openPanel);
  document.getElementById("panelclose").addEventListener("click", closePanel);
  document.getElementById("addbtn").addEventListener("click", openBrowser);
  document.getElementById("browserclose").addEventListener("click", closeBrowser);
  panel.addEventListener("click", e => { if (e.target === panel) closePanel(); });
  browser.addEventListener("click", e => { if (e.target === browser) closeBrowser(); });

  rootListEl.addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (!btn) return;
    // removal is one row's inline confirm, not a browser dialog box
    if (btn.dataset.ask) { askPath = btn.dataset.ask; loadRoots(); }
    else if (btn.dataset.cancel) { askPath = null; loadRoots(); }
    else if (btn.dataset.remove) removeRoot(btn.dataset.remove);
  });

  appleBoxEl.addEventListener("click", e => {
    const btn = e.target.closest("button[data-apple]");
    if (!btn) return;
    const act = btn.dataset.apple;
    // Turning it *on* asks twice — the first sync is long and macOS may put a
    // permission dialog in front of it, so a mis-click must not start one.
    // Turning it off is undone by turning it on again, so it just happens.
    if (act === "on") {
      const ask = document.getElementById("appleconfirm");
      if (ask) ask.hidden = false;
      // ...and the button that asked steps aside: two primary buttons reading
      // "Turn on" and "Turn it on" is two calls to action for one decision.
      btn.hidden = true;
      note(panelNote, "");
      return;
    }
    setApple(act === "yes");
  });

  rescanBtn.addEventListener("click", () => {
    if (rescanBtn.disabled) return;
    reindexBtn.click();                      // one implementation, one path
    note(panelNote, "Indexing…");
  });

  dirListEl.addEventListener("keydown", e => {
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    const dirs = [...dirListEl.querySelectorAll(".dir")];
    const i = dirs.indexOf(document.activeElement);
    if (i < 0) return;
    e.preventDefault();
    const next = dirs[i + (e.key === "ArrowDown" ? 1 : -1)];
    if (next) next.focus();
  });
  dirListEl.addEventListener("click", e => {
    const btn = e.target.closest("button[data-dir]");
    // moving elsewhere retracts a pending confirmation: it was about the
    // folder the user has just navigated away from
    if (btn) { note(browserNote, ""); hideHomeConfirm(); browseTo(btn.dataset.dir); }
  });
  upBtn.addEventListener("click", () => {
    if (!browseParent) return;
    hideHomeConfirm();
    browseTo(browseParent);
  });
  document.getElementById("homeyes").addEventListener("click", async () => {
    const path = pendingHome;
    if (path && await addRoot(path, true)) closeBrowser();
  });
  document.getElementById("usebtn").addEventListener("click", async () => {
    if (browseDir && await addRoot(browseDir)) closeBrowser();
  });
  document.getElementById("pasteadd").addEventListener("click", async () => {
    if (await addRoot(pasteEl.value.trim())) closeBrowser();
  });
  pasteEl.addEventListener("keydown", async e => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    if (await addRoot(pasteEl.value.trim())) closeBrowser();
  });

  lightbox.addEventListener("click", e => {
    if (e.target === lightbox) closeLight();          // backdrop only
  });
  document.getElementById("close").addEventListener("click", closeLight);
  document.getElementById("prev").addEventListener("click", () => navLight(-1));
  document.getElementById("next").addEventListener("click", () => navLight(1));
  infoBtn.addEventListener("click", () => setInfo(!infoOpen()));

  // The browser gave up on the file. `error` also fires when a src is *removed*
  // (which is how stopVideo lets go of one), so playbackFailed checks there is
  // still a source before it says anything.
  lightvid.addEventListener("error", playbackFailed);

  // ...and the failure that raises nothing at all. When the container is readable
  // but its *video* track is not — HEVC in a Chromium build without it, which is
  // most of them — the element plays quite happily: clock running, sound coming
  // out, `error` null, and no picture. Measured: readyState 4 and
  // videoWidth 0 on the two HEVC clips in the reference library. A player showing
  // black is worse than an honest fallback, and zero dimensions after the metadata
  // has loaded is the one fact that gives it away.
  lightvid.addEventListener("loadeddata", () => {
    if (!lightvid.videoWidth && !lightvid.videoHeight) playbackFailed();
  });
  document.getElementById("fallcopy").addEventListener("click", e => {
    navigator.clipboard.writeText(fallPath.textContent).then(
      () => { e.target.textContent = "Copied"; },
      () => { e.target.textContent = "Select it and copy"; });
  });

  // Re-scan. `op=reindex` launches a detached worker (scripts/index_worker.py)
  // and answers `{started: true}` — but it can also refuse, with a sentence: no
  // folders configured, a run already going, no embedding engine on this
  // machine. So the spinner starts only on the success path, after the await,
  // never before it: it would be a lie for as long as it turned. A refusal is
  // shown in the banner, which is where a fact about the last index run already
  // lives.
  // The first-run invitation's own button, and it deliberately does NOT forward
  // to ↻ the way the ⚙ panel's copy does. Two reasons, both about that one
  // screen: the invitation is still on top of the grid, and it is the only state
  // where the next poll has nothing new to repaint — zero photos before the run
  // and zero for the first seconds of it — so `pollStatus`'s "did the library
  // grow?" test would leave the same screen up and the press would read as a
  // dead click. So this awaits the answer and repaints either way: a run that
  // started swaps the invitation for the "Indexing…" state, and a refusal (no
  // embedding engine on this machine is the likely one) leaves the invitation
  // standing with the reason in the banner, which is where a fact about
  // indexing already lives.
  async function startIndexing() {
    const btn = msgEl.querySelector('button[data-act="index"]');
    if (btn) { btn.disabled = true; btn.textContent = "Starting…"; }
    try {
      await api("/reindex", { method: "POST" });
      wasIndexing = true;                  // a run really started: let it finish
      // Written onto the cached status rather than waited for, so the repaint
      // below lands on the "Indexing…" branch instead of flashing the
      // invitation again for the 400ms until the next poll corrects it.
      lib.indexing = true;
      reindexBtn.classList.add("spin");
      setStatus("busy", "reindexing…");
      refresh();
    } catch (err) {
      setBanner(err.message);
      if (btn) { btn.disabled = false; btn.textContent = "Start indexing"; }
    }
    schedulePoll(400);                     // pollStatus owns the button again
  }

  reindexBtn.addEventListener("click", async () => {
    reindexBtn.disabled = true;
    try {
      await api("/reindex", { method: "POST" });
      wasIndexing = true;                  // a run really started: let it finish
      reindexBtn.classList.add("spin");
      setStatus("busy", "reindexing…");
    } catch (err) {
      setBanner(err.message);
      if (isOpen(panel)) note(panelNote, err.message, true);
    }
    schedulePoll(400);                     // pollStatus owns the button again
  });

  document.addEventListener("keydown", e => {
    trapTab(e);                    // no-op unless a dialog is open
    // Esc peels the folder layers one at a time, and "/" must not steal focus
    // out of a dialog into the search box
    if (isOpen(browser)) {
      if (e.key === "Escape") { e.preventDefault(); closeBrowser(); }
      return;
    }
    if (isOpen(panel)) {
      if (e.key === "Escape") { e.preventDefault(); closePanel(); }
      return;
    }
    const open = lightbox.classList.contains("open");
    if (open) {
      // Esc peels one layer at a time: panel first, then the lightbox
      if (e.key === "Escape") {
        e.preventDefault();
        if (infoOpen()) setInfo(false); else closeLight();
      }
      if (e.key === "i" || e.key === "I") { e.preventDefault(); setInfo(!infoOpen()); }
      // ...but not out from under a video player the user is standing in: the
      // controls own the arrow keys, where they seek. Focus starts on ✕, so the
      // arrows navigate the results until someone deliberately tabs into the
      // player.
      if (e.target !== lightvid) {
        if (e.key === "ArrowLeft") { e.preventDefault(); navLight(-1); }
        if (e.key === "ArrowRight") { e.preventDefault(); navLight(1); }
      }
      return;
    }
    const typing = e.target === qEl;
    if (e.key === "/" && !typing) { e.preventDefault(); qEl.focus(); qEl.select(); }
    if (e.key === "Escape") {
      // Esc peels one layer at a time here too: a query first, then — inside a
      // trip, with nothing left to clear — the trip itself.
      if (selectMode) { e.preventDefault(); exitSelect(); }
      else if (qEl.value) { clearTimeout(debounceT); qEl.value = ""; pushQuery(""); }
      else if (typing) qEl.blur();
      else if (currentView() === "trip") { e.preventDefault(); nav("trips"); }
      else if (currentView() === "person") { e.preventDefault(); nav("people"); }
    }
  });

  fused.params.onChange(route);
  qEl.value = fused.params.get("q") || "";
  document.body.classList.toggle("has-q", qEl.value.length > 0);
  paintScope(currentScope());
  route();
  pollStatus();
  } // !IS_THUMBNAIL
</script>
</body>
</html>
