<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
<!-- The one line that makes this folder a fused app. Filenames declare
     nothing — `index.html` included — so without this tag lens does not appear
     on the /apps hub and never resolves as this folder's entry page. It sits
     immediately after <meta charset> because detection reads only the first
     4 KiB of the file, and the stylesheet below is long enough to push it out
     of range if it were written any lower.

     Deliberately NOT on views/explain.html or views/validate.html: the marker
     marks *entry* pages, and those two are reached from the pills inside this
     one. Tagging them would list lens three times on the hub. -->
<meta name="fused-app" />
<title>Lens — local photo search</title>
<style>
  /* Card peek on the /apps hub: one still, nothing else — see IS_THUMBNAIL. */
  body.is-thumbnail { margin: 0; overflow: hidden; background: #10131a; }
  body.is-thumbnail .thumb-still {
    display: block; width: 100vw; height: 100vh; object-fit: cover;
  }
  :root {
    color-scheme: dark;
    /* palette lifted from the fused-render explorer shell */
    --bg: #10131a;
    --bg-header: #131417f2;
    --surface: #1c1e24;
    --surface-2: #202329;
    --line: #ffffff14;
    --line-strong: #ffffff2b;
    --text: #e8e8e8;
    --text-dim: #b4b6bd;
    --text-mute: #7c7f88;
    --accent: #e5ff44;
    --accent-dim: #e5ff4421;
    --ok: #3fca6b;
    --warn: #ff6b6b;
    /* a partial-failure notice is not an emergency: amber, not red */
    --amber: #e0b155;
    /* type scale — 5 steps, ~1.3 ratio. The top rung is a real title, not
       decoration: the empty states are the only place this product gets to
       say what it is. */
    --fs-xs: 11px;
    --fs-sm: 14px;
    --fs-md: 18px;
    --fs-lg: 24px;
    --fs-xl: 32px;
    /* elevation, in steps. One surface colour and one shadow meant a sheet
       floating over a modal over the page all read as the same plane. */
    --e1: 0 1px 2px #0000003d;
    --e2: 0 6px 18px #00000052, 0 1px 0 #ffffff0a inset;
    --e3: 0 24px 70px #000000a6, 0 1px 0 #ffffff0f inset;
    --maxw: 1680px;
    /* spacing scale */
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
    --r: 10px;
    --ease: cubic-bezier(.22, .61, .36, 1);
    /* Reserved for the things that are literally strings from disk — a file
       path, a filename, an exposure value. A proportional font makes a burst of
       IMG_4185/IMG_4186 unscannable and turns aligned numbers into ragged ones. */
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: var(--fs-sm)/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-dim); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #ffffff1f; border-radius: 99px;
    border: 3px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #ffffff33; }

  /* ── header ─────────────────────────────────────────────────────────── */
  header {
    position: sticky; top: 0; z-index: 6;
    background: var(--bg-header); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    padding: var(--s3) var(--s5);
    /* wrap, not overflow: below ~700px the gear is the only route to the
       folder settings, and it used to leave the viewport entirely */
    display: flex; gap: var(--s4); align-items: center; flex-wrap: wrap;
    row-gap: var(--s2);
  }
  .mark { flex: none; font-size: var(--fs-md); font-weight: 600;
          letter-spacing: -.03em; color: var(--text);
          /* the one place the product is named; it yields the row first */
          margin-right: calc(var(--s2) * -1); }
  @media (max-width: 900px) { .mark { display: none; } }
  .field { position: relative; flex: 1; max-width: 620px; display: flex; }
  .field svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%;
    width: 15px; height: 15px; color: var(--text-mute); pointer-events: none;
    transition: color .18s var(--ease); }
  .field:focus-within svg { color: var(--accent); }
  #q {
    width: 100%; background: var(--surface); color: inherit;
    border: 1px solid var(--line); border-radius: var(--r);
    padding: 10px 76px 10px 34px; font-size: var(--fs-md); font-family: inherit;
    outline: none; transition: border-color .18s var(--ease), background .18s var(--ease);
  }
  #q::placeholder { color: var(--text-mute); font-size: var(--fs-sm); }
  #q::-webkit-search-cancel-button { display: none; }
  #q:hover { border-color: var(--line-strong); }
  #q:focus { border-color: var(--accent); background: var(--surface-2); }
  .slash {
    position: absolute; right: 10px; top: 50%; translate: 0 -50%;
    font-size: var(--fs-xs); color: var(--text-mute);
    border: 1px solid var(--line-strong); border-radius: 5px;
    padding: 1px 6px; pointer-events: none; transition: opacity .18s var(--ease);
  }
  .field:focus-within .slash, body.has-q .slash { opacity: 0; }
  #clear {
    position: absolute; right: 8px; top: 50%; translate: 0 -50%;
    width: 22px; height: 22px; border: 0; border-radius: 50%;
    background: #ffffff14; color: var(--text-dim); cursor: pointer;
    font-size: 13px; line-height: 1; display: none; place-items: center;
    transition: background .15s var(--ease), color .15s var(--ease);
  }
  body.has-q #clear { display: grid; }
  #clear:hover { background: var(--warn); color: #fff; }

  #st { margin-left: auto; display: flex; align-items: center; gap: var(--s2);
        font-size: var(--fs-xs); color: var(--text-dim); white-space: nowrap;
        letter-spacing: .02em; }
  .hbtn {
    flex: none; display: inline-flex; align-items: center; gap: 5px;
    background: var(--surface); color: var(--text-dim);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 10px; font: inherit; font-size: var(--fs-xs);
    letter-spacing: .02em; cursor: pointer;
    transition: background .15s var(--ease), border-color .15s var(--ease),
                color .15s var(--ease), opacity .15s var(--ease);
  }
  .hbtn:hover:not(:disabled) { background: var(--surface-2);
    border-color: var(--line-strong); color: var(--text); }
  .hbtn:focus-visible { outline: none; border-color: var(--accent); }
  .hbtn:disabled { opacity: .45; cursor: default; }
  .hbtn .gl { display: inline-block; line-height: 1; }
  #gear { padding: 5px 8px; font-size: var(--fs-sm); }
  #reindex.spin .gl { animation: spin 1.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok);
         flex: none; }
  #st.busy .dot { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  #st.off .dot { background: var(--warn); }
  #st.off { color: var(--warn); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

  /* Progress line for a query in flight, or an index run. It lives *inside*
     the header, sitting on its bottom border: as a sibling it scrolled under
     the sticky header and vanished the moment the page moved. */
  #bar { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
         overflow: hidden; opacity: 0; pointer-events: none;
         transition: opacity .2s var(--ease); }
  body.busy #bar, body.indexing #bar { opacity: 1; }
  #bar::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: sweep 1.1s var(--ease) infinite; }
  /* a real fraction beats a sweep: once the daemon reports done/total the bar
     stops pretending and fills */
  body.indexing.determinate #bar::after { animation: none;
    background: var(--accent); right: auto;
    width: var(--progress, 0%); transition: width .4s var(--ease); }
  @keyframes sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

  /* screen-reader-only: still announced, no longer taking header width */
  .vh { position: absolute !important; width: 1px; height: 1px; padding: 0;
        margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
        border: 0; }

  /* below ~720px the search field takes its own row and the controls sit
     under it; the gear stays pinned to the right, always reachable */
  @media (max-width: 720px) {
    header { padding: var(--s3) var(--s4); gap: var(--s2); }
    .field { flex: 1 1 100%; max-width: none; order: -1; }
    #st { margin-left: var(--s2); }
    #gear { margin-left: auto; }
  }
  @media (max-width: 520px) {
    /* the status collapses to its dot — the words are still in the live
       region for anyone listening, just not eating the row */
    #sttext { position: absolute; width: 1px; height: 1px; padding: 0;
              margin: -1px; overflow: hidden; clip: rect(0 0 0 0);
              white-space: nowrap; }
    #reindex .lbl { display: none; }
    #st { margin-left: 0; }
  }

  /* ── chips / result meta ────────────────────────────────────────────── */
  .chipbar { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap;
             max-width: var(--maxw); margin-inline: auto;
             padding: var(--s3) var(--s5) 0; }
  .chipbar:empty { display: none; }
  /* Accent was doing six jobs — chips, section labels, folder icons, focus,
     the primary button, the progress line — so it had stopped meaning
     anything. It now means one: this is where your attention goes (focus,
     the primary action, work in progress). A parsed filter is information. */
  .chip {
    background: var(--surface-2); border: 1px solid var(--line-strong);
    border-radius: 999px; padding: 3px 11px;
    font-size: var(--fs-xs); color: var(--text-dim); letter-spacing: .01em;
  }
  .chip .ico { opacity: .75; }
  /* A chip that is a control rather than a fact. The only one is "Same person…"
     on the People index, and it looks pressable because it is — the plain chips
     beside it are parsed filters, which are not. */
  .chipbar button.chip.act { cursor: pointer; font: inherit;
    font-size: var(--fs-xs); color: var(--text-dim);
    transition: background .15s var(--ease), border-color .15s var(--ease),
                color .15s var(--ease); }
  .chipbar button.chip.act:hover { background: var(--accent-dim);
    border-color: #e5ff4440; color: var(--accent); }
  .chipbar button.chip.act:focus-visible { outline: none;
    border-color: var(--accent); color: var(--accent); }
  #count { margin-left: auto; font-size: var(--fs-xs); color: var(--text-mute);
           white-space: nowrap; }

  /* one quiet line: "some files could not be read" is worth saying once, not
     worth a full-width red slab above every search the user runs after it */
  #banner { display: flex; align-items: center; gap: var(--s2);
            max-width: calc(var(--maxw) - var(--s5) * 2);
            margin: var(--s3) auto 0; padding: 3px var(--s3);
            border: 1px solid #e0b15533; background: #e0b1550f;
            border-radius: 8px; font-size: var(--fs-xs); color: #dcbe8b; }
  #banner[hidden] { display: none; }
  #banner .bico { color: var(--amber); flex: none; }
  #bannertext { min-width: 0; overflow: hidden; text-overflow: ellipsis;
                white-space: nowrap; }
  #bannerx { margin-left: auto; flex: none; width: 18px; height: 18px;
             display: grid; place-items: center; border: 0; border-radius: 50%;
             background: none; color: inherit; opacity: .6; cursor: pointer;
             font: inherit; font-size: 11px; line-height: 1;
             transition: background .15s var(--ease), opacity .15s var(--ease); }
  #bannerx:hover { opacity: 1; background: #ffffff14; }
  #bannerx:focus-visible { outline: none; opacity: 1;
                           box-shadow: 0 0 0 1px var(--amber); }

  /* ── scope toggle ───────────────────────────────────────────────────── */
  .seg { flex: none; display: flex; gap: 2px; padding: 2px;
         background: var(--surface); border: 1px solid var(--line);
         border-radius: 9px; }
  .seg button { border: 0; background: none; color: var(--text-mute);
    font: inherit; font-size: var(--fs-xs); letter-spacing: .02em;
    padding: 4px 10px; border-radius: 7px; cursor: pointer; white-space: nowrap;
    transition: background .15s var(--ease), color .15s var(--ease); }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--accent-dim);
                                     color: var(--accent); }
  .seg button:focus-visible { outline: none;
                              box-shadow: inset 0 0 0 1px var(--accent); }
  .seg .n { margin-left: 5px; opacity: .6;
            font-variant-numeric: tabular-nums; }
  .seg .n:empty { display: none; }
  /* a count from the last successful poll is not a fact about a daemon that
     has stopped answering */
  body.offline .seg .n, body.offline .pills .n { visibility: hidden; }

  /* ── the pill nav ─────────────────────────────────────────────────────
     One control, on all four surfaces (Photos / Trips / ⓘ / audit). Photos and
     Trips are two states of this page and cost a param write; the other two are
     files of their own. Built to the same shape as the scope toggle above,
     because they are the same kind of thing — a small set of exclusive states,
     one of them current.

     It gives up the `margin-left: auto` the other two pages give it: this
     header already has one (on #st), and two auto margins split the free space
     between them instead of pushing the whole group right. */
  .pills { flex: none; margin-left: 0; display: flex; gap: 2px; padding: 2px;
           background: var(--surface); border: 1px solid var(--line);
           border-radius: 999px; }
  .pills button { border: 0; background: none; color: var(--text-mute);
    font: inherit; font-size: var(--fs-xs); letter-spacing: .02em;
    padding: 4px 11px; border-radius: 999px; cursor: pointer;
    white-space: nowrap;
    transition: background .15s var(--ease), color .15s var(--ease); }
  .pills button:hover { color: var(--text); }
  .pills button[aria-current="page"] { background: var(--accent-dim);
    color: var(--accent); cursor: default; }
  .pills button:focus-visible { outline: none;
    box-shadow: inset 0 0 0 1px var(--accent); }
  .pills .info { font-style: normal; font-size: var(--fs-sm); line-height: 1;
                 padding: 3px 9px; }
  /* The trip count lives here rather than in the status line. It used to be
     half of "1,696 images · 5 trips" — a number with nothing to press, beside
     a view that exists. Now the number *is* the way in. */
  .pills .n { margin-left: 5px; opacity: .6;
              font-variant-numeric: tabular-nums; }
  .pills .n:empty { display: none; }

  /* ── grid ───────────────────────────────────────────────────────────── */
  /* 12 columns of 197px at 2560px is a wall, not a grid: cap the measure and
     let the cells breathe. */
  #results { max-width: var(--maxw); margin-inline: auto; }
  h2 { position: sticky; top: 57px; z-index: 4;
       display: flex; align-items: baseline; gap: var(--s2);
       margin: var(--s6) 0 var(--s3); padding: var(--s2) var(--s5);
       background: linear-gradient(var(--bg) 70%, transparent);
       font-size: var(--fs-md); font-weight: 600; color: var(--text);
       letter-spacing: -.01em; }
  h2 .when { font-size: var(--fs-xs); font-weight: 400; color: var(--text-mute);
             letter-spacing: .01em; }
  h2 .n { margin-left: auto; font-size: var(--fs-xs); font-weight: 500;
          color: var(--text-mute); background: var(--surface);
          border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
  .grid { display: grid; gap: var(--s4); padding: var(--s3) var(--s5) var(--s5);
          grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .card { border: 0; padding: 0; background: none; text-align: left;
          font: inherit; color: inherit; cursor: pointer; display: block; }
  /* opt-in, and only ever set on a card this update actually created: the
     enter animation used to replay on all 200 every keystroke, including the
     dozen that had not moved */
  .card.enter, .tcard.enter { animation: cardIn .34s var(--ease) both; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(8px); } }
  .shot { position: relative; overflow: hidden; border-radius: var(--r);
          background: var(--surface); aspect-ratio: 1;
          border: 1px solid var(--line); box-shadow: var(--e1);
          transition: border-color .16s var(--ease), box-shadow .16s var(--ease); }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block;
              transition: transform .16s var(--ease); }
  /* an overlay, not filter: brightness() repaints every pixel of a 512px
     thumbnail on hover, and a grid of them made scrolling stutter */
  .shot::after { content: ""; position: absolute; inset: 0; pointer-events: none;
                 background: #ffffff00; transition: background .12s var(--ease); }
  .card:hover .shot { border-color: var(--line-strong); box-shadow: var(--e2); }
  .card:hover .shot::after { background: #ffffff14; }
  .card:hover .shot img { transform: scale(1.03); }
  .card:active .shot img { transform: scale(1.01); }
  .card:focus-visible { outline: none; }
  .card:focus-visible .shot { border-color: var(--accent);
                              box-shadow: 0 0 0 2px var(--accent-dim), var(--e2); }
  .cap { display: flex; gap: var(--s2); align-items: baseline;
         margin-top: 6px; padding: 0 2px; font-size: var(--fs-xs);
         color: var(--text-mute); overflow: hidden; }
  .cap b { font-weight: 500; color: var(--text-dim); white-space: nowrap; }
  .cap span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* thumb that failed to load */
  .shot.bad { display: grid; place-items: center; }
  .shot.bad img { display: none; }
  .shot.bad::after { content: "⚠︎ thumb unavailable"; font-size: var(--fs-xs);
                     color: var(--text-mute); }

  /* ── a video tile ─────────────────────────────────────────────────────
     A frame out of a video looks exactly like a photograph, which is the whole
     problem: pressing it does something else. Two marks, doing two jobs — the
     glyph says "this plays" at a glance across a grid of forty, and the running
     time is the one fact about a video a still cannot have. Both sit above the
     hover overlay (.shot::after), which is painted after the image. */
  .vplay { position: absolute; inset: 0; z-index: 1; display: grid;
           place-items: center; pointer-events: none; }
  .vplay i { display: grid; place-items: center; width: 42px; height: 42px;
             padding-left: 3px; border-radius: 50%; font-style: normal;
             font-size: 14px; color: #fff;
             background: #06070a99; border: 1px solid #ffffff2b;
             backdrop-filter: blur(3px);
             transition: transform .16s var(--ease), background .16s var(--ease); }
  .card:hover .vplay i { transform: scale(1.09); background: #06070ad9; }
  .card:active .vplay i { transform: scale(1.02); }
  .vdur { position: absolute; right: 6px; bottom: 6px; z-index: 1;
          padding: 1px 7px; border-radius: 999px;
          background: #06070ab8; border: 1px solid #ffffff1f;
          backdrop-filter: blur(3px);
          font-size: var(--fs-xs); font-variant-numeric: tabular-nums;
          letter-spacing: .01em; color: #f0f0f0; }
  /* the weak tail's cells are 150px: a 42px disc over one is most of the frame */
  .grid.weak .vplay i, .card.weak .vplay i { width: 30px; height: 30px;
                                             font-size: 11px; }

  /* ── trips ───────────────────────────────────────────────────────────────
     A trip is not a photo, so a trip card is not a photo card: it is landscape
     rather than square (a cover crop reads as a place, not as a frame), it is
     wider, and it carries three lines of its own — where, when, how many.
     Everything else about it — the hover lift, the focus ring, the enter
     animation — is deliberately the photo card's, because it behaves like one:
     you press it and it opens. */
  .tgrid { display: grid; gap: var(--s5);
           padding: var(--s4) var(--s5) var(--s6);
           grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .tcard { border: 0; padding: 0; background: none; text-align: left;
           font: inherit; color: inherit; cursor: pointer; display: block; }
  .tcard .shot { aspect-ratio: 4 / 3; }
  .tcard:hover .shot { border-color: var(--line-strong); box-shadow: var(--e2); }
  .tcard:hover .shot::after { background: #ffffff14; }
  .tcard:hover .shot img { transform: scale(1.03); }
  .tcard:active .shot img { transform: scale(1.01); }
  .tcard:focus-visible { outline: none; }
  .tcard:focus-visible .shot { border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-dim), var(--e2); }
  /* a cover the daemon could not name (a trip whose photos never got a hash) */
  .tcard .shot.none { display: grid; place-items: center; }
  .tcard .shot.none::after { content: "no cover"; font-size: var(--fs-xs);
                             color: var(--text-mute); }
  .tmeta { margin-top: var(--s3); padding: 0 2px; }
  .tmeta b { display: block; font-size: var(--fs-md); font-weight: 600;
             color: var(--text); letter-spacing: -.01em;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tmeta span { display: block; margin-top: 3px; font-size: var(--fs-xs);
                color: var(--text-mute); letter-spacing: .01em; }

  /* ── people ──────────────────────────────────────────────────────────────
     A person card is a face and a name, and it is round, which is the one place
     this view deviates from the square-crop rule: a circle says "this is
     somebody" in a way a rectangle cannot, and every product that has ever shown
     a face has taught people to read it that way. Smaller cells than a trip,
     because a face needs less room than a place does — and the name sits under
     it, centred, because it is a label rather than a caption. */
  .pgrid { display: grid; gap: var(--s5);
           padding: var(--s4) var(--s5) var(--s6);
           grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .pcard { border: 0; padding: 0; background: none; font: inherit;
           color: inherit; cursor: pointer; display: block; text-align: center;
           position: relative; }
  /* `display: block` on both spans, and it is not cosmetic: a <button> may only
     contain phrasing content, so these are spans rather than divs — and an inline
     span ignores width, aspect-ratio and border-radius, which rendered the whole
     grid as raw square thumbnails with their labels adrift. */
  .pcard .face { display: block; position: relative; width: 100%; aspect-ratio: 1;
                 border-radius: 50%; overflow: hidden; background: var(--surface);
                 border: 1px solid var(--line); box-shadow: var(--e1);
                 transition: border-color .16s var(--ease),
                             box-shadow .16s var(--ease); }
  .pcard .face img { width: 100%; height: 100%; object-fit: cover; display: block;
                     transition: transform .16s var(--ease); }
  .pcard:hover .face { border-color: var(--line-strong); box-shadow: var(--e2); }
  .pcard:hover .face img { transform: scale(1.04); }
  .pcard:active .face img { transform: scale(1.01); }
  .pcard:focus-visible { outline: none; }
  .pcard:focus-visible .face { border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-dim), var(--e2); }
  /* a cover whose photo lens cannot render right now (an unplugged drive) */
  .pcard .face.none { display: grid; place-items: center; }
  .pcard .face.none::after { content: "☺"; font-size: var(--fs-xl);
                             color: var(--text-mute); }
  .pmeta { display: block; margin-top: var(--s3); padding: 0 2px; }
  .pmeta b { display: block; font-size: var(--fs-sm); font-weight: 600;
             color: var(--text); letter-spacing: -.01em;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* An unnamed person is not a person with a blank name — the card says so in
     its own voice, quieter than a real name, so a library of "Person 3, Person 4"
     reads as work still to do rather than as a set of labels. */
  .pmeta b.unnamed { color: var(--text-dim); font-weight: 500; font-style: italic; }
  .pmeta span { display: block; margin-top: 2px; font-size: var(--fs-xs);
                color: var(--text-mute); letter-spacing: .01em; }

  /* Select mode: the same cards, now answering a different question ("which two
     are the same person?"). A checkbox would be a second control per card; the
     card itself is the control, and the ring is the state. */
  .pcard[aria-pressed="true"] .face { border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim), var(--e2); }
  .pcard .tick { position: absolute; top: 4px; right: 4px; width: 22px;
    height: 22px; border-radius: 50%; display: none; place-items: center;
    background: var(--accent); color: #10131a; font-size: 12px;
    font-weight: 700; box-shadow: var(--e1); }
  .pcard[aria-pressed="true"] .tick { display: grid; }
  body.selecting .pcard .face img { transform: none; }

  /* the strip that appears above the grid while selecting */
  .selbar { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
            max-width: calc(var(--maxw) - var(--s5) * 2);
            margin: var(--s3) auto 0; padding: var(--s2) var(--s3);
            border: 1px solid var(--line-strong); border-radius: 8px;
            background: var(--surface); font-size: var(--fs-xs);
            color: var(--text-dim); }
  .selbar[hidden] { display: none; }
  .selbar .grow { flex: 1; }

  /* ── the person sub-header ─────────────────────────────────────────────
     Same sticky bar a trip gets, plus the two things only a person has: a face,
     and a name that can be edited in place. */
  #subhead .avatar { flex: none; width: 34px; height: 34px; border-radius: 50%;
    overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
  #subhead .avatar[hidden] { display: none; }
  #subhead .avatar img { width: 100%; height: 100%; object-fit: cover;
                         display: block; }
  #subhead #rename { flex: none; }
  #nameform { display: flex; align-items: center; gap: var(--s2); }
  #nameform[hidden] { display: none; }
  #nameinput { background: var(--surface); color: inherit;
    border: 1px solid var(--accent); border-radius: 8px;
    padding: 5px 10px; font: inherit; font-size: var(--fs-md);
    letter-spacing: -.01em; outline: none; min-width: 0; width: min(320px, 60vw); }

  /* ── sub-header: which trip you are inside ────────────────────────────
     Sticky under the real header, because the answer to "what am I looking at"
     must not scroll away from a forty-photo trip. */
  #subhead { position: sticky; top: 57px; z-index: 5;
             display: flex; align-items: center; gap: var(--s3);
             max-width: var(--maxw); margin-inline: auto;
             padding: var(--s4) var(--s5) var(--s3);
             background: linear-gradient(var(--bg) 72%, transparent); }
  #subhead[hidden] { display: none; }
  #subhead h1 { margin: 0; font-size: var(--fs-lg); font-weight: 600;
                letter-spacing: -.02em; color: var(--text);
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #subhead .when { flex: none; font-size: var(--fs-xs); color: var(--text-mute);
                   letter-spacing: .01em; }
  #back { flex: none; }
  @media (max-width: 520px) {
    #subhead { flex-wrap: wrap; row-gap: var(--s2); }
    #subhead h1 { font-size: var(--fs-md); }
  }

  /* ── the confidence horizon ─────────────────────────────────────────────
     Search hands back the closest dozen even when only three of them are
     answers (query.MIN_KEEP). Rendering the padding identically to the
     matches is what made "beach" look like it returned random black-and-white
     frames — so the boundary the daemon measured gets drawn. */
  .horizon { display: flex; align-items: center; gap: var(--s3);
             margin: var(--s6) var(--s5) var(--s4); }
  .horizon::before, .horizon::after { will-change: transform; }
  .horizon::before, .horizon::after { content: ""; height: 1px; flex: 1;
    background: linear-gradient(90deg, transparent, var(--line-strong));
    transform: scaleX(var(--draw, 1)); transform-origin: right; }
  .horizon::after { background: linear-gradient(90deg, var(--line-strong), transparent);
    transform-origin: left; }
  .horizon span { flex: none; font-size: var(--fs-xs); color: var(--text-mute);
    letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  /* said once, above the grid, when the ranking failed to separate anything */
  .restnote { margin: var(--s3) var(--s5) 0; padding: 5px var(--s3);
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); font-size: var(--fs-xs); color: var(--text-mute); }

  /* below the line: smaller cells and less contrast, so weight tracks
     confidence without hiding anything */
  .grid.weak { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
               opacity: .7; }
  .card.weak { opacity: .7; }
  .grid.weak .card:hover, .card.weak:hover,
  .grid.weak .card:focus-visible, .card.weak:focus-visible { opacity: 1; }
  #results.hide-weak .horizon, #results.hide-weak .grid.weak { display: none; }

  /* skeleton — first paint only */
  .sk .shot { background: linear-gradient(100deg, var(--surface) 30%,
              var(--surface-2) 50%, var(--surface) 70%);
              background-size: 250% 100%; animation: shimmer 1.3s linear infinite; }
  @keyframes shimmer { from { background-position: 150% 0; } to { background-position: -50% 0; } }
  /* The old results stay at full opacity until the new ones are ready.
     Dimming the grid the moment a keystroke lands turned one query into three
     visible states — dim, blank, restage — and that flicker, not the 120ms
     round trip, is what made search feel slow. The 2px bar in the header is
     the only thing that says "in flight". */

  /* the paging trigger: an element the observer can see coming, not a button
     the user has to find. Hidden — display:none — when there is no next page,
     which is also what stops the observer firing. */
  #sentinel { height: 1px; margin-top: calc(var(--s5) * -1); }
  #sentinel[hidden] { display: none; }

  /* ── messages / empty states ────────────────────────────────────────── */
  /* centred in what is left of the viewport, not pinned 72px from the top
     with 800px of nothing under it */
  #msg { display: grid; align-content: center; justify-items: center;
         min-height: min(62vh, 520px); padding: var(--s6) var(--s5);
         text-align: center; color: var(--text-dim); }
  #msg[hidden] { display: none; }
  #msg .ico { font-size: var(--fs-lg); line-height: 1; opacity: .8; }
  #msg h3 { margin: var(--s3) 0 var(--s2); font-size: var(--fs-xl);
            font-weight: 600; letter-spacing: -.02em; color: var(--text);
            line-height: 1.15; }
  #msg .row2 { display: flex; gap: var(--s2); flex-wrap: wrap;
               justify-content: center; }
  #msg p { margin: 0 auto; max-width: 460px; font-size: var(--fs-sm);
           color: var(--text-mute); }
  #msg code { background: var(--surface); border: 1px solid var(--line);
              border-radius: 6px; padding: 2px 7px; font-size: var(--fs-xs);
              color: var(--accent); }
  #msg .cmd { display: inline-flex; align-items: center; gap: var(--s2);
              margin-top: var(--s3); }
  #msg .cmd button { margin: 0; padding: 1px 7px; font-size: var(--fs-xs);
                     background: #ffffff14; border-color: var(--line); }
  #msg button { margin-top: var(--s4); background: var(--surface);
    color: var(--text); border: 1px solid var(--line-strong);
    border-radius: 8px; padding: 7px 16px; font: inherit;
    font-size: var(--fs-sm); cursor: pointer;
    transition: background .15s var(--ease), border-color .15s var(--ease); }
  #msg button:hover { background: var(--surface-2); border-color: var(--accent); }

  /* ── lightbox ───────────────────────────────────────────────────────── */
  #lightbox {
    position: fixed; inset: 0; z-index: 20;
    display: grid; place-items: center; gap: var(--s3);
    /* `1fr` is min-content-sized by default, so the image row grew past the
       viewport and pushed the caption and counter out of reach — max-height
       on the image could never bind against a row that had already given up.
       minmax(0,1fr) is what makes the row shrinkable. */
    grid-template-rows: minmax(0, 1fr) auto;
    /* the EXIF panel takes its width out of the frame, not out of the photo:
       shrinking the image alone left it centred in the old box and so still
       half under the panel */
    padding: var(--s5);
    padding-right: calc(var(--s5) + var(--inforoom, 0px));
    background: #06070ae6; backdrop-filter: blur(6px);
    opacity: 0; visibility: hidden; pointer-events: none;
  }
  #lightbox.open { opacity: 1; visibility: visible; pointer-events: auto; }
  #lightimg {
    min-width: 0; min-height: 0;          /* see grid-template-rows above */
    max-width: 100%; max-height: 100%; object-fit: contain;
    border-radius: var(--r); box-shadow: var(--e3);
    will-change: transform;
  }
  /* ── the lightbox, playing ─────────────────────────────────────────────
     A video takes the same grid row the photo does — same max size, same
     rounding, same shadow — so the caption, the counter and the details panel
     below and beside it do not know which one is there. Only one of the two is
     ever in the layout: the other is display:none, so it takes no row. */
  #lightvid { display: none; min-width: 0; min-height: 0;
              max-width: 100%; max-height: 100%; background: #000;
              border-radius: var(--r); box-shadow: var(--e3); }
  #lightbox.video #lightimg { display: none; }
  #lightbox.video #lightvid { display: block; }
  /* ...and when the browser will not play the file, the frame lens rendered is
     still a true picture of it. Shown with the one thing that always works. */
  #lightfall { display: none; justify-items: center; gap: var(--s3);
               max-width: min(560px, 92vw); padding: var(--s5);
               background: var(--surface); border: 1px solid var(--line);
               border-radius: var(--r); box-shadow: var(--e3);
               text-align: center; }
  #lightbox.fallback #lightvid { display: none; }
  #lightbox.fallback #lightfall { display: grid; }
  #lightfall img { max-width: 100%; max-height: 40vh; border-radius: 8px;
                   border: 1px solid var(--line); }
  #lightfall p { margin: 0; font-size: var(--fs-sm); color: var(--text-dim); }
  #lightfall .file { display: flex; align-items: center; gap: var(--s2);
                     width: 100%; }
  #lightfall code { flex: 1; min-width: 0; font-family: var(--mono);
                    font-size: var(--fs-xs); color: var(--text-mute);
                    text-align: left; overflow-wrap: anywhere; }
  #lightfall button { flex: none; background: #ffffff14; color: var(--text-dim);
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px;
    font: inherit; font-size: var(--fs-xs); cursor: pointer;
    transition: background .15s var(--ease), color .15s var(--ease); }
  #lightfall button:hover { background: var(--surface-2); color: var(--text); }
  #lightfall button:focus-visible { outline: none; border-color: var(--accent); }

  #lightcap { font-size: var(--fs-xs); color: var(--text-dim);
              display: flex; gap: var(--s3); align-items: center; }
  #lightcap b { color: var(--text); font-weight: 500; }
  .lb-btn {
    position: absolute; top: 50%; translate: 0 -50%;
    width: 40px; height: 40px; border-radius: 50%;
    background: #ffffff14; border: 1px solid var(--line);
    color: var(--text); font-size: var(--fs-md); cursor: pointer;
    display: grid; place-items: center;
    transition: background .15s var(--ease), border-color .15s var(--ease);
  }
  .lb-btn:hover { background: #ffffff2b; border-color: var(--line-strong); }
  /* the browser's default blue ring on a near-black backdrop is both invisible
     and off-palette */
  .lb-btn:focus-visible { outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-dim), 0 0 0 1px var(--accent); }
  #prev { left: var(--s4); } #next { right: var(--s4); }
  #close, #infobtn { position: absolute; top: var(--s4); translate: none;
    width: 34px; height: 34px; font-size: var(--fs-sm); z-index: 2; }
  #close { right: var(--s4); }
  #infobtn { right: calc(var(--s4) + 42px); font-style: italic;
             font-family: Georgia, serif; }
  #infobtn[aria-pressed="true"] { background: var(--accent-dim);
    border-color: #e5ff4440; color: var(--accent); }

  /* ── EXIF panel ─────────────────────────────────────────────────────── */
  #info {
    position: absolute; top: 0; right: 0; bottom: 0; width: min(430px, 92vw);
    background: #0b0d12f7; border-left: 1px solid var(--line);
    box-shadow: var(--e3);
    overflow-y: auto; overscroll-behavior: contain;
    padding: 58px var(--s4) var(--s5); text-align: left;
    transform: translateX(101%); visibility: hidden;
    transition: transform .24s var(--ease), visibility .24s;
  }
  #lightbox.info #info { transform: none; visibility: visible; }
  #lightbox.info #next { right: calc(min(430px, 92vw) + var(--s4)); }
  /* ── the spec card ───────────────────────────────────────────────────
     This panel used to be one alphabetized table of every column the catalog
     has: "Aperture" three rows above "Shutter", "Folder" above "Taken", the
     filename in a heading and the place buried at row eleven. Every fact was
     present and none of them was findable, because an alphabet is not an order
     anyone reads a photograph in.
     It now reads the way a photograph is described: where and when, then what
     took it, then how it was exposed, then where the file is — and only then
     the raw tag dump, behind a disclosure. The order is the design. */
  #info .place { margin: 0; font-size: var(--fs-lg); font-weight: 600;
                 line-height: 1.15; letter-spacing: -.02em; color: var(--text);
                 overflow-wrap: anywhere; }
  #info .when { margin: 3px 0 0; font-size: var(--fs-sm); color: var(--text-dim); }
  /* the filename is an identifier, not a title: it is the smallest line here,
     and it is monospaced so a burst of IMG_4185/IMG_4186 is scannable */
  #info .fname { margin: var(--s2) 0 0; font-family: var(--mono);
                 font-size: var(--fs-xs); color: var(--text-mute);
                 overflow-wrap: anywhere; }
  #info .sec { margin: var(--s5) 0 var(--s2); font-size: var(--fs-xs);
    letter-spacing: .08em; text-transform: uppercase; color: var(--text-mute); }
  #info .body { margin: 0; font-size: var(--fs-sm); color: var(--text);
                overflow-wrap: anywhere; }
  #info .sub { margin: 2px 0 0; font-size: var(--fs-xs); color: var(--text-mute);
               overflow-wrap: anywhere; }
  #info .none { margin: 0; font-size: var(--fs-xs); color: var(--text-mute); }
  /* Exposure is four numbers that are only meaningful together — ƒ, shutter,
     ISO, focal length. As four table rows they were four unrelated facts; as a
     row of chips they are one setting, read at a glance. */
  #info .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 0; }
  #info .chip { font-family: var(--mono); font-size: var(--fs-xs);
    color: var(--text-dim); background: var(--surface-2);
    border: 1px solid var(--line-strong); border-radius: 999px;
    padding: 3px 10px; white-space: nowrap; }
  /* A tag is a chip you can press: it is this photo's own best guess at what it
     shows, and pressing it runs that guess as a search. So it looks pressable
     and the plain exposure chips do not. */
  #info button.chip { cursor: pointer; font-family: inherit;
    transition: background .15s var(--ease), border-color .15s var(--ease),
                color .15s var(--ease); }
  #info button.chip:hover { background: var(--accent-dim);
    border-color: #e5ff4440; color: var(--accent); }
  #info button.chip:focus-visible { outline: none; border-color: var(--accent);
    color: var(--accent); }
  /* A person chip carries their face, because a name is a weaker identifier than
     a picture when there are three unnamed people in the photograph — and the
     crop is already cached, since the People view has been drawing it. */
  #info button.chip.who { display: inline-flex; align-items: center; gap: 6px;
    padding-left: 3px; }
  #info button.chip.who img { width: 20px; height: 20px; border-radius: 50%;
    object-fit: cover; display: block; }
  #info .file { display: flex; align-items: flex-start; gap: var(--s2);
                margin: var(--s2) 0 0; }
  #info .file code { flex: 1; min-width: 0; font-family: var(--mono);
    font-size: var(--fs-xs); color: var(--text-mute); overflow-wrap: anywhere; }
  #info .copy { flex: none; background: #ffffff14; color: var(--text-dim);
    border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px;
    font: inherit; font-size: var(--fs-xs); cursor: pointer;
    transition: background .15s var(--ease), color .15s var(--ease); }
  #info .copy:hover { background: var(--surface-2); color: var(--text); }
  #info .copy:focus-visible { outline: none; border-color: var(--accent); }
  /* a coordinate pair, a trip name: one line each, and the trip one opens it */
  #info .link { background: none; border: 0; padding: 0; font: inherit;
    font-size: var(--fs-sm); color: var(--accent); cursor: pointer;
    text-align: left; text-decoration: underline;
    text-decoration-color: #e5ff4459; text-underline-offset: 3px; }
  #info .link:hover { text-decoration-color: var(--accent); }
  #info .link:focus-visible { outline: none; text-decoration-color: var(--accent); }
  #info .err { margin: 0; font-size: var(--fs-xs); color: #ffb3b3; }
  /* The only table left is the raw EXIF dump inside the disclosure — that one
     genuinely is a key/value listing of a hundred tags, which is what a table
     is for. Everything above it is prose. */
  #info table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  #info th, #info td { text-align: left; vertical-align: top;
    padding: 4px 10px 4px 0; border-bottom: 1px solid var(--line);
    font-size: var(--fs-xs); font-weight: 400; line-height: 1.45; }
  #info th { width: 44%; color: var(--text-mute); overflow-wrap: anywhere; }
  #info td { color: var(--text-dim); overflow-wrap: anywhere; }
  #info tr:last-child th, #info tr:last-child td { border-bottom: 0; }
  /* the raw tag dump is reference material, not the answer to "what is this
     photo" — it opens when asked for */
  #info details { margin-top: var(--s5); }
  #info summary { cursor: pointer; font-size: var(--fs-xs);
    letter-spacing: .08em; text-transform: uppercase; color: var(--text-mute);
    padding: var(--s2) 0; list-style: none; }
  #info summary::-webkit-details-marker { display: none; }
  #info summary::before { content: "▸ "; display: inline-block;
    transition: transform .15s var(--ease); }
  #info details[open] summary::before { content: "▾ "; }
  #info summary:hover { color: var(--text); }
  #info summary:focus-visible { outline: none; color: var(--accent); }

  /* ── settings + folder browser ───────────────────────────────────────── */
  .modal {
    position: fixed; inset: 0; z-index: 30;
    display: grid; place-items: center; padding: var(--s5);
    background: #06070ae6; backdrop-filter: blur(6px);
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .22s var(--ease), visibility .22s;
  }
  .modal.open { opacity: 1; visibility: visible; pointer-events: auto; }
  #browser { z-index: 31; }               /* opens on top of the settings panel */
  .sheet {
    display: flex; flex-direction: column; text-align: left;
    width: min(580px, 100%); max-height: min(78vh, 620px);
    background: var(--surface); border: 1px solid var(--line-strong);
    border-radius: var(--r); box-shadow: var(--e3);
    transform: scale(.97) translateY(12px); opacity: 0;
    transition: transform .28s var(--ease), opacity .28s var(--ease);
  }
  .modal.open .sheet { transform: none; opacity: 1; }
  /* the folder browser is a layer *over* the settings sheet, and moves like
     one: sideways, not up */
  #browser .sheet { transform: translateX(16px) scale(.99); }
  #browser.open .sheet { transform: none; }
  .sheet-head { display: flex; align-items: center; gap: var(--s3);
    padding: var(--s4) var(--s4) var(--s3);
    border-bottom: 1px solid var(--line); }
  .sheet-head h3 { margin: 0; font-size: var(--fs-md); font-weight: 600;
    letter-spacing: -.01em; }
  .sheet-head .sub { font-size: var(--fs-xs); color: var(--text-mute); }
  .sheet-body { flex: 1; overflow-y: auto; overscroll-behavior: contain;
    padding: var(--s2) var(--s4);
    /* a hard edge at the fold reads as the end of the list; a fade says
       there is more under it */
    mask-image: linear-gradient(#000 calc(100% - 24px), transparent);
    -webkit-mask-image: linear-gradient(#000 calc(100% - 24px), transparent); }
  .sheet-foot { display: flex; align-items: center; gap: var(--s2);
    flex-wrap: wrap; padding: var(--s3) var(--s4) var(--s4);
    border-top: 1px solid var(--line); }
  .btn {
    background: var(--surface); color: var(--text-dim);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 11px; font: inherit; font-size: var(--fs-xs); cursor: pointer;
    transition: background .15s var(--ease), border-color .15s var(--ease),
                color .15s var(--ease), opacity .15s var(--ease);
  }
  .btn:hover:not(:disabled) { background: var(--surface-2);
    border-color: var(--line-strong); color: var(--text); }
  .btn:focus-visible { outline: none; border-color: var(--accent); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.primary { background: var(--accent); border-color: transparent;
    color: #10131a; font-weight: 600; }
  .btn.primary:hover:not(:disabled) { background: #eeff77; color: #10131a; }
  .btn.danger { border-color: #ff6b6b59; color: #ffb3b3; }
  .btn.danger:hover { background: var(--warn); border-color: var(--warn);
    color: #fff; }
  .btn.x { margin-left: auto; padding: 4px 8px; }
  .grow { flex: 1; }

  /* root rows */
  .row { display: flex; align-items: center; gap: var(--s2);
    padding: var(--s3) 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .p { flex: 1; min-width: 0; font-size: var(--fs-sm);
    color: var(--text-dim); overflow-wrap: anywhere; }
  .row .p small { display: block; font-size: var(--fs-xs); color: var(--text-mute);
                  font-variant-numeric: tabular-nums; }
  .row .ask { font-size: var(--fs-xs); color: #ffb3b3; }

<script>
  // ── am I a thumbnail? ──────────────────────────────────────────────────
  // The /apps hub shows this page twice: opened, and PEEKED — hovering the
  // card mounts the entry page live in a scaled-down iframe. Lens is the
  // heaviest app on that grid (a Python process, the SigLIP embedder warming,
  // hundreds of thumbnails), and a hover is not a use of it. So a peek gets a
  // still — the same preview.png the card shows before the hover — and none
  // of the app boots: no runtime calls, no GSAP, no polling.
  //
  // The `path=` in the address is identical either way, so the URL alone does
  // not say which case this is. The shell does: every thumbnail frame it mounts
  // carries `_preview=1` (thumb-frame.ts / router.ts), inherited by same-origin
  // descendants — the same climb the runtime's own IS_THUMBNAIL makes to refuse
  // fused.daemon.* from a picture. Nothing exposes that flag to the page, so it
  // is read here. Cross-origin ancestors end the climb: nothing above them is
  // ours to read, and a real open of the app is never under one.
  const IS_THUMBNAIL = (() => {
    const has = search => {
      try { return new URLSearchParams(search).get("_preview") === "1"; }
      catch (err) { return false; }
    };
    if (has(location.search)) return true;
    try {
      let w = window;
      while (w.parent && w.parent !== w) {
        w = w.parent;
        if (has(w.location.search)) return true;
      }
    } catch (err) { /* cross-origin: the climb ends here */ }
    return false;
  })();

  if (IS_THUMBNAIL) {
    // preview.png sits at the app root beside this file. fused.rawUrl because
    // the page is served from /render?path=…, where a relative <img src> would
    // resolve against /render rather than this folder (same reason GSAP below
    // cannot be a plain <script src>).
    document.body.innerHTML =
      '<img class="thumb-still" alt="Lens — local photo search">';
    document.body.className = "is-thumbnail";
    document.querySelector(".thumb-still").src = fused.rawUrl("./preview.png");
  }

  // Everything else is the app, and only runs for a real open. A block rather
  // than a throw so a peek leaves a clean console; the body keeps its
  // top-level indentation because 3,400 lines re-indented would bury every
  // future diff.
  if (!IS_THUMBNAIL) {
  // ── where the data comes from ──────────────────────────────────────────
  // There used to be a daemon here: a long-lived loopback process that held the
  // store and the SigLIP weights, and a `DAEMON` constant this page fetched
  // every endpoint off. It is gone. Everything below reaches `./lens_api.py`
  // through fused.runPython instead, and `api()` — one function, the single
  // seam — still speaks the daemon's paths and hands back the daemon's shapes,
  // so nothing else in this file had to learn about the change.
  //
  // Two things the daemon did that a 60s subprocess cannot, and how they are
  // done now instead:
  //
  //   * **Embedding a query.** The model is fused-render's, not lens's, so the
  //     *page* embeds — `fused.ai.embed` — and lens_api.py does the maths

  //     itself (see the `need_embed` branch), so a caller still just asks for
  //     "/query?q=…" and gets a ranking back.

  //
  // `views/`, not `./`, because this page is the folder's `index.html` and the

  // top-level .html named index.html, so the entry page moved up to the repo
  // root and everything it loads — this file, the two companion pages, the
  // vendored motion library — stayed in views/. Relative paths in a data file
  // resolve next to the *data file*, so lens_api.py's own `_REPO =

  const API = "./views/lens_api.py";
  const EMBED_MODEL = "google/siglip2-so400m-patch14-384";
  const LIMIT_DEFAULT = 200;

  // ranking — see buildModel.

  // ── motion ────────────────────────────────────────────────────────────

  // runtime. It cannot be a plain relative <script src>: this page is served
  // from /render?path=…, so "vendor/gsap.min.js" would resolve against /render
  // rather than against the file's own folder. fused.rawUrl() is the runtime's
  // answer to that, and it still reads the file off local disk.
  //
  // The load is deliberately not awaited before first paint. Motion is the
  // last thing that should ever stand between a keystroke and pixels, so every
  // animation below is guarded: without GSAP the view is the same view, just
  // without the transitions.

  // half-loaded motion layer would leave the photo mid-flight with the page

    return new Promise((ok, fail) => {
      const el = document.createElement("script");
      el.src = src;
      el.onload = ok;
      el.onerror = () => fail(new Error("could not load " + src));
      document.head.appendChild(el);
    });

  (async () => {

      // "./views/vendor/…" and not "./vendor/…": this page is the repo root's
      // index.html now, and the vendored library stayed beside the other views.
      await loadScript(fused.rawUrl("./views/vendor/gsap.min.js"));
      await loadScript(fused.rawUrl("./views/vendor/Flip.min.js"));

      // first meant a missing Flip threw *after* gsap was live, and motion()
      // then said yes to animations that could not run

      // already running must not be left frozen halfway — so the global
      // timeline is sped through rather than paused, and `motion()` stops new
      // ones being started at all.

    const target = Number(value);
    if (!el) return;
    if (!Number.isFinite(target)) { el.textContent = ""; ROLLING.delete(el); return; }

  const stEl = document.getElementById("st");
  const stText = document.getElementById("sttext");
  const chipsEl = document.getElementById("chips");
  const resEl = document.getElementById("results");

  // can head its photo grid without a second round trip for something we have
  // already been told.
  let TRIPS = new Map();
  // ...and the same for people, which the person sub-header reads for a name, a
  // face and two counts. Both are caches of a list, not state: every route that
  // needs one either has it or fetches it.
  let PEOPLE = new Map();
  // Select mode: whether a press on a person card picks it for a merge instead
  // of opening it, and which two are picked. A mode rather than a modifier key,
  // because one press has to do the ordinary thing (open somebody) and there is
  // no keyboard modifier a touchpad user discovers.
  let selectMode = false;
  const picked = new Set();

  // ── helpers ───────────────────────────────────────────────────────────
  const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ESC[c]);
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                  "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  // "2025-07-14T19:58:02" → "14 Jul 2025" (no Date parsing: these are local,
  // tz-naive strings and new Date() would shift them).
  function fmtDate(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
    if (!m) return "";
    return `${+m[3]} ${MONTHS[+m[2] - 1]} ${m[1]}`;
  }
  const baseName = p => String(p || "").split("/").pop();
  const MONTHS_FULL = ["January", "February", "March", "April", "May", "June",
                       "July", "August", "September", "October", "November",
                       "December"];

  // "2026-07" → "July 2026". An empty key means the file carries no capture
  // time at all, which is a fact about it, not a month.
  function monthLabel(key) {
    const m = /^(\d{4})-(\d{2})$/.exec(key || "");
    return m ? `${MONTHS_FULL[+m[2] - 1]} ${m[1]}` : "Undated";
  }

  // "22–23 Jul" for a trip inside one month, "28 Jun – 3 Jul" across two,
  // and the year only when it is not the obvious one.
  function dateSpan(from, to) {
    const a = fmtDate(from), b = fmtDate(to);
    if (!a) return "";
    if (!b || a === b) return a;
    const [ad, am, ay] = a.split(" "), [bd, bm, by] = b.split(" ");
    if (ay === by && am === bm) return `${ad}–${bd} ${bm} ${by}`;
    if (ay === by) return `${ad} ${am} – ${bd} ${bm} ${by}`;
    return `${a} – ${b}`;
  }
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

  // ── videos ────────────────────────────────────────────────────────────
  // Which kind of thing a row is, asked in one place. `kind` rides along with
  // every item the daemon serves, so a tile knows before it has fetched anything
  // else (see daemon.run_query).
  const isVideo = it => !!it && it.kind === "video";

  // 42 → "0:42", 3723 → "1:02:03". Zero-padded below the leading unit, because
  // this is read as a clock and "1:2:3" is not one. Empty for a video whose
  // container never said how long it is — then the play glyph is the whole claim,
  // and "0:00" would be a false one.
  function fmtDur(secs) {
    const n = Number(secs);
    if (!Number.isFinite(n) || n <= 0) return "";
    const t = Math.round(n);
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    const pad = v => String(v).padStart(2, "0");
    return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
  }

  // ── page nav ──────────────────────────────────────────────────────────
  // Four surfaces, three files: Photos and Trips are two states of this page,
  // told apart by the `view` param, and the other two are pages of their own.
  // `null` for a page that takes no view; "" for the one that wants it gone.
  // Every entry is spelled RELATIVE TO THE APP FOLDER, not as a bare filename,
  // because the four surfaces no longer live in one directory: the entry page
  // is the folder's index.html and the two companions stayed in views/. See
  // NAV_FILES for how a hop between the two levels is made.
  const PAGES = {
    photos: ["index.html", ""],
    trips: ["index.html", "trips"],
    people: ["index.html", "people"],
    explain: ["views/explain.html", null],
    audit: ["views/validate.html", null],
  };
  // Params that belong to one view and are nonsense in another: leaving `trip`
  // set while switching to People would make the next press of Trips reopen the
  // last trip, and leaving `person` set would filter the trip you just opened by
  // whoever you were last looking at.
  const VIEW_PARAMS = ["trip", "person"];
  // The trailing path to swap. Anchored to the three files we know, so a URL
  // shaped some other way is left alone rather than rewritten into a guess.
  //
  // The optional `views/` prefix is what makes a cross-directory hop a plain
  // string replace, in both directions and with no path arithmetic:
  //
  //   /embed/<root>/index.html            → "views/explain.html" → /embed/<root>/views/explain.html
  //   /embed/<root>/views/explain.html    → "index.html"         → /embed/<root>/index.html
  //
  // JS alternation is greedy, so on the second line the match starts at
  // `views/` and the whole segment pair is replaced — not just the filename,
  // which would have left `/views/index.html`. The prefix has to be *adjacent*
  // to one of the three names to match at all, so an app checked out under a
  // parent directory that merely happens to be called `views` is unaffected.
  const NAV_FILES = /(?:views\/)?(?:index|explain|validate)\.html/;
  const SELF = "index.html";

  // The URL in the address bar is not this frame's. A view is rendered inside
  // the fused-render shell, and the shell's URL is the one that carries
  // fused.params — so nav has to climb to it, by the same rule the runtime uses
  // (topmost same-origin ancestor, stopping under a param boundary).
  function navTarget() {
    let w = window;
    try {
      while (w.parent && w.parent !== w) {
        void w.parent.location.href;      // throws when cross-origin
        if (w.parent._fusedParamBoundary) break;
        w = w.parent;
      }
    } catch (err) { /* w is the last ancestor we are allowed to touch */ }
    return w;
  }

  // `search` with `view` set, removed, or left alone — carrying every other
  // param across, because a link between pages should keep what it was showing.
  //
  // The runtime always reinserts the raw `_layout=(…)` span last and never
  // decodes it (it can hold literal `&`), so the search splits cleanly there:
  // everything before the span is ordinary params, and the span is copied
  // byte-for-byte rather than re-encoded.
  function withView(search, view) {
    const s = (search || "").replace(/^\?/, "");
    const m = /(^|&)_layout=\(/.exec(s);
    const head = m ? s.slice(0, m.index) : s;
    const tail = m ? s.slice(m.index + m[1].length) : "";
    const p = new URLSearchParams(head);
    if (view) p.set("view", view); else p.delete("view");
    // Neither index applies a query, so arriving at one must not leave one
    // sitting in the search box describing a filter that is not being used —
    // the same rule lens.html applies when the pill is pressed from inside it.
    if (view === "trips" || view === "people") p.delete("q");
    const out = [p.toString(), tail].filter(Boolean).join("&");
    return out ? "?" + out : "";
  }

  function nav(key) {
    const page = PAGES[key];
    if (!page) return;
    const [file, view] = page;
    if (file === SELF) {
      if (view === null) return;
      // Same page, different state — a param write, not a navigation. Reloading
      // to switch tab would throw away the grid, the scroll position and the
      // daemon's warm text encoder.
      //
      // `view` is written FIRST, and the order is the whole point: each write
      // notifies separately, so the writes in between are states the page will
      // actually try to render. Setting `view` first makes every one of those
      // intermediates already the destination — leaving a trip lands on Photos
      // immediately and *then* drops the stale trip id, rather than flashing the
      // trip index on the way. (route()'s own key guard drops the leftovers.)
      fused.params.set("view", view);
      // Neither index has anything to apply a query to, so a query left in the
      // box would show every trip (or everyone) under a filter that was not
      // being used.
      if ((view === "trips" || view === "people")
          && (fused.params.get("q") || "")) fused.params.set("q", "");
      // A trip or person id outlives the view it belongs to otherwise, and the
      // next press of that pill would silently reopen the last one.
      for (const key of VIEW_PARAMS) {
        if (fused.params.get(key)) fused.params.set(key, "");
      }
      return;
    }
    const loc = navTarget().location;
    // /embed/<path>/lens.html — the filename is a path segment
    if (NAV_FILES.test(loc.pathname)) {
      loc.href = loc.pathname.replace(NAV_FILES, file)
                 + (view === null ? loc.search : withView(loc.search, view));
      return;
    }
    // /render?path=<path>/lens.html — opened standalone, so it is a param
    const u = new URL(loc.href);
    const p = u.searchParams.get("path");
    if (!p || !NAV_FILES.test(p)) return;      // a URL we do not recognise
    u.searchParams.set("path", p.replace(NAV_FILES, file));
    if (view === "") u.searchParams.delete("view");
    else if (view) u.searchParams.set("view", view);
    loc.href = u.toString();
  }

  // Which pill is lit. A single trip is *inside* Trips, so it lights the same
  // pill the index does.
  function paintPills(current) {
    for (const b of pillsEl.querySelectorAll("button")) {
      if (b.dataset.nav === current) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    }
  }

  function busyOn() {
    clearTimeout(busyT);
    // only show after 150ms so the common <100ms query doesn't flash
    busyT = setTimeout(() => document.body.classList.add("busy"), 150);
  }
  function busyOff() {
    clearTimeout(busyT);
    document.body.classList.remove("busy");
  }

  // ── banner ────────────────────────────────────────────────────────────
  // `text` is set with textContent, never innerHTML: it carries a daemon
  // exception string, which can hold anything a filesystem path can.
  //
  // The separator is written as an escape rather than as the byte itself:
  // a literal NUL in the source made this whole file `binary` to grep, diff
  // and every review tool that asks the OS what kind of file it is looking at.
  // It stays a NUL because no daemon message can contain one, so no message
  // can forge another run’s key.
  const bannerKey = text => indexRuns + "\u0000" + text;

  function setBanner(text) {
    if (!text || bannerKey(text) === bannerDismissed) {
      bannerEl.hidden = true;
      return;
    }
    bannerTextEl.textContent = text;
    // the line is clipped with an ellipsis, and a daemon traceback is longer
    // than the header is wide — the full text has to be reachable
    bannerTextEl.title = text;
    bannerEl.hidden = false;
  }

  function showMsg(html) { msgEl.innerHTML = html; msgEl.hidden = false; }
  function hideMsg() { msgEl.hidden = true; msgEl.innerHTML = ""; }

  function skeleton(n = 12) {
    resEl.innerHTML = `<div class="grid">${
      `<div class="sk"><div class="shot"></div></div>`.repeat(n)}</div>`;
  }

  // ── status ────────────────────────────────────────────────────────────
  // #st is an aria-live region, and it is repainted on every 10s poll. Writing
  // the same string again is a fresh announcement to a screen reader, so an
  // idle library used to read its own count aloud forever. Only a genuine
  // change speaks.
  function setStatus(cls, text) {
    if (stEl.className === cls && stText.textContent === text) return;
    stEl.className = cls;
    stText.textContent = text;
  }

  // An index run has two phases and only one of them can be measured: the walk
  // has to see the whole tree before it knows how many files there are to do.
  // Say which phase it is in rather than invent a fraction for the first.
  function indexingLabel(s) {
    const p = s.progress;
    // Two sweeps, and the second one has to name itself: the bar fills, resets
    // and fills again, which reads as a bug unless the line says why. The faces
    // sweep runs *after* the library is searchable, so "still finding people" is
    // the honest description of a library that already answers queries.
    const what = p && p.stage === "faces" ? "finding people" : "indexing";
    // elapsed_s/eta_s ride on the same progress payload (see daemon.py's
    // _progress_payload) — eta_s is only present once there is a rate to
    // project from, so its absence (the scan phase, or the very first file)
    // is said as nothing rather than a guess.
    const elapsed = p && p.elapsed_s != null ? fmtRunDuration(p.elapsed_s) : null;
    const eta = p && p.eta_s != null ? fmtRunDuration(p.eta_s) : null;
    const time = elapsed ? ` · ${elapsed}` + (eta ? `, ~${eta} left` : "") : "";
    if (p && p.total > 0) return `${what}… ${p.done} of ${p.total}${time}`;
    return `scanning… ${plural(s.photos, "image")} so far${time}`;
  }

  // The 2px line in the header carries this: a real fill once there is a
  // fraction to fill it with, the indeterminate sweep while there isn't.
  function setProgress(s) {
    const p = s.indexing && s.progress;
    document.body.classList.toggle("indexing", !!s.indexing);
    const measurable = !!(p && p.total > 0);
    document.body.classList.toggle("determinate", measurable);
    if (measurable) {
      document.body.style.setProperty(
        "--progress", Math.round(100 * p.done / p.total) + "%");
    }
  }

  function schedulePoll(ms) {
    clearTimeout(pollT);
    pollT = setTimeout(pollStatus, ms);
  }

  async function pollStatus() {
    let delay = 10000;                      // idle cadence
    try {
      const s = await api("/status");
      lib = s;
      // "image", not "photo": this is everything catalogued, and the scope
      // toggle right beside it now says how many of them are photographs
      // The trip count used to be the second half of this line. It is now the
      // Trips pill's own badge, because a number beside a view that exists
      // should be the way into it (see setScopeCounts).
      const bits = [plural(s.photos, "image")];
      if (s.indexing) {
        // first run pulls ~3.5GB of weights before a single photo is embedded;
        // "indexing… 0 images" would read as a hang
        setStatus("busy", s.model_loaded === false
          ? "loading model…" : indexingLabel(s));
        delay = 1200;
      } else {
        setStatus("", bits.join(" · "));
      }
      setProgress(s);
      reindexBtn.disabled = !!s.indexing;
      rescanBtn.disabled = !!s.indexing;    // the panel's copy of the same button
      reindexBtn.classList.toggle("spin", !!s.indexing);
      reindexBtn.title = s.indexing ? "Indexing…" : "Re-scan photo folders";
      setScopeCounts(s);
      // counted before the banner, because a dismissal is remembered per run:
      // a fresh run's notice is a new notice even when it reads the same
      document.body.classList.remove("offline");
      const cameBack = online === false;
      // The very first status of the session. `online` starts as null, so this
      // is neither a recovery nor a steady state — it is the moment the page
      // first learns what `lib` holds, and search() has already had to guess at
      // it (see the `library !== "ready"` branch). Repainting on it is how that
      // guess gets corrected, and it is gated on a message being on screen so
      // it costs a second /query only when the screen is an empty or error
      // state rather than actual photographs.
      const firstStatus = online === null;
      const doneIndexing = wasIndexing && !s.indexing;
      if (doneIndexing) indexRuns++;
      online = true;
      wasIndexing = !!s.indexing;
      // surface a failed index run instead of hiding it
      const li = s.last_index;
      if (li && li.error) setBanner("Last index run failed: " + li.error);
      else if (li && li.errors)
        setBanner(`${plural(li.errors, "file")} could not be read in the last index run.`);
      else setBanner(null);
      // The index that breathes. During a run the grid used to sit frozen
      // until the very end; now each poll that found new photos repaints, and
      // the keyed reconcile means only the genuinely new thumbs animate in —
      // they land in date order among the ones already there.
      //
      // Held back once the user has paged past the first screen: refetching
      // page one would throw away everything they scrolled to.
      const grew = s.photos !== lastPhotos;
      lastPhotos = s.photos;
      const paging = ITEMS.length > currentLimit();
      // The People index breathes for the same reason the photo grid does, off a
      // different number: the face sweep finds people minutes after the
      // photographs are searchable, so a screen opened during it must fill in as
      // they arrive rather than sit empty until a reload. `scanned` as well as
      // `people`, because a sweep that has moved without finding anybody is also
      // news — it is what the "still looking" line counts.
      const faces = s.faces || {};
      const facesMoved = faces.people !== lastFaces.people
                         || faces.scanned !== lastFaces.scanned;
      lastFaces = { people: faces.people, scanned: faces.scanned };
      if (cameBack || doneIndexing || (firstStatus && !msgEl.hidden)
          || (s.indexing && grew && !paging)) refresh();
      // ...but never mid-merge: re-rendering the grid under a half-made
      // selection would move the cards the user is choosing between.
      else if (facesMoved && !selectMode
               && (currentView() === "people" || currentView() === "person")) {
        refresh();
      }
      // a finished run can change which folders exist, and leaves the panel's
      // "indexing…" line stale
      if (doneIndexing && isOpen(panel)) {
        note(panelNote, "Indexing finished.");
        loadRoots();
      }
    } catch (e) {
      // There is no daemon to be offline any more, so this is the *store* not
      // answering: no library on this machine yet, a catalog that cannot be
      // opened, or an environment that has not finished installing. Same
      // treatment either way — the header says so, the grid is cleared, and the
      // poll keeps trying, because every one of those states is one that fixes
      // itself without a reload.
      setStatus("off", "library unavailable");
      setBanner(null);
      setProgress({});                      // nothing is indexing if nothing answers
      document.body.classList.add("offline");
      reindexBtn.disabled = true;
      rescanBtn.disabled = true;
      reindexBtn.classList.remove("spin");
      if (online !== false) { online = false; storeUnavailable(e); }
      delay = 3000;                         // retry sooner while down
    }
    schedulePoll(delay);                    // always keep polling
  }

  // Was `daemonDown()`. Same job — wipe the screen and say why — for the state
  // that replaced it: the library could not be read.
  function storeUnavailable(err) {
    ITEMS = []; painted = false;
    exitSelect();                  // the cards it was about are gone
    // `routed` describes what is on screen, and this wipes the screen — so the
    // next route() for the same state has work to do again.
    routed = null;
    page = { q: "", scope: currentScope(), trip: null, person: null, total: 0,
             strong: null, loading: false };
    sentinelEl.hidden = true;
    resEl.replaceChildren();
    chipsEl.innerHTML = "";
    busyOff();
    closeLight();
    // The message the error carried, where there is one. This state used to
    // include a fresh install — lens_api.py refused every op with "no library"
    // until something had been indexed — and that was the wrong first
    // impression by a mile. It no longer can: an empty library is a successful
    // /status with `library: "empty"`, rendered as the invitation in search().
    // So the only two things that reach here are the two this copy is now
    // about: a catalog that cannot be read ("store damaged") and an environment
    // that never finished installing (a runPython rejection, no code). Both are
    // faults, both are worth a red screen, and only the sentence says which.
    const why = (err && err.message)
      || "The library could not be read.";
    showMsg(`<div class="ico">🗂︎</div>
      <h3>Your library isn’t available</h3>
      <p>${esc(why)}</p>
      <p>lens reads its catalog through <code>views/lens_api.py</code>, in this
      app's folder. It will pick the library up on its own once it can —
      <span id="retryin">checking again in 3s…</span></p>
      <div class="row2"><button type="button" data-act="retry">Retry now</button></div>`);
  }

  // The API answered but refused the query (a bad page size, a query vector
  // that does not match the index, a model that is not available on this
  // machine). Deliberately does NOT flip `online`: the library is fine, so
  // pollStatus must not treat the next poll as a recovery and re-issue this
  // same query.
  function searchFailed(code, detail) {
    ITEMS = []; painted = false;
    routed = null;                     // see storeUnavailable
    page = { q: "", scope: currentScope(), trip: null, person: null, total: 0,
             strong: null, loading: false };
    sentinelEl.hidden = true;
    resEl.replaceChildren();
    chipsEl.innerHTML = "";
    closeLight();
    showMsg(`<div class="ico">⚠︎</div>
      <h3>Search failed</h3>
      <p>${esc(detail || "This query was rejected.")}</p>
      <p class="none">${esc(code || "unknown error")}</p>
      <button type="button" data-act="clear">Clear search</button>`);
  }

  // ── chips ─────────────────────────────────────────────────────────────
  // `shown` is what the grid holds, `total` what matched, `strong` how many of
  // those are real matches rather than the closest-anyway tail. Paging updates
  // this line in place, so it lives on its own.
  function countLabel(shown, total, strong) {
    if (Number.isFinite(strong) && strong < shown) {
      return strong ? `${strong} strong · ${shown - strong} weaker`
                    : `${shown} closest, none strong`;
    }
    return total > shown ? `showing ${shown} of ${total}`
                         : plural(shown, "result");
  }

  function updateCount() {
    const el = document.getElementById("count");
    if (el) el.textContent = countLabel(ITEMS.length, page.total, page.strong);
  }

  function renderChips(parsed, shown, total, strong, q) {
    const c = [];
    if (parsed.date_from) {
      const a = fmtDate(parsed.date_from), b = fmtDate(parsed.date_to);
      c.push(["🗓", b && b !== a ? `${a} – ${b}` : a]);
    }
    (parsed.places || []).forEach(p => c.push(["📍", p]));
    (parsed.cameras || []).forEach(p => c.push(["📷", p]));
    (parsed.albums || []).forEach(p => c.push(["🗂", p]));
    // A name the parser recognised is a filter like any other, and saying so is
    // what stops "photos of Ana" from looking like a plain text search that
    // happened to return her
    (parsed.people || []).forEach(p => c.push(["🙂", p]));
    if (parsed.trip_mode) c.push(["🧳", "trips"]);
    // A chip earns its place by saying something the search box does not. The
    // residual chip repeated the query verbatim for every plain search — 87
    // photos of "beach" under a chip reading "beach" — so it only appears when
    // the parse actually pulled a date, a place or a camera out of the words
    // and this is what was left over.
    const r = (parsed.residual || "").trim();
    if (r && r !== (q || "").trim().toLowerCase()) c.push(["🔎", r]);
    // the count stands on its own: it is just as useful on an unfiltered view.
    // `shown` is what the grid holds, `total` what matched — say so when the
    // daemon's limit cut the list, instead of passing a slice off as the whole.
    // And when only some of those rows are real matches, count *those*: "12
    // results" for 3 answers and 9 near-misses was the lie the horizon fixes.
    const label = countLabel(shown, total, strong);
    chipsEl.innerHTML =
      c.map(([i, v]) =>
        `<span class="chip"><span class="ico" aria-hidden="true">${i}</span> ${esc(v)}</span>`
      ).join("") + (shown ? `<span id="count">${esc(label)}</span>` : "");
    if (motion() && c.length) {
      gsap.from(chipsEl.querySelectorAll(".chip"), {
        opacity: 0, scale: 0.94, duration: 0.2, ease: "back.out(1.6)",
        stagger: 0.03, overwrite: "auto", clearProps: "transform",
      });
    }
  }

  // ── grid ──────────────────────────────────────────────────────────────
  // What a card says under its thumbnail, in three flavours — and `cap` is both
  // the choice of flavour and the key the reconcile compares, so a card whose
  // caption should change is exactly a card whose `cap` changed.
  //
  //   "date"   the date and the place. The default.
  //   "nodate" the place only: there is a month heading above this card, and
  //            repeating its date on all 87 cards below turned the captions into
  //            a column of identical text.
  //   "time"   the time of day only. Inside a trip *both* halves were redundant
  //            — the heading above carries the date span and the place, so forty
  //            cards read "23 Jul 2026 · Banjar Kerobokan" forty times over. The
  //            clock is what tells them apart there. A photo taken in some other
  //            city mid-trip loses that from its caption, and keeps it in the
  //            lightbox and the details panel.
  function capHTML(it, cap) {
    if (cap === "time") {
      const t = /T(\d{2}):(\d{2})/.exec(it.taken_at || "");
      return t ? `<b>${esc(t[1] + ":" + t[2])}</b>` : "";
    }
    const date = cap === "nodate" ? "" : fmtDate(it.taken_at);
    return (date ? `<b>${esc(date)}</b>` : "") +
           `<span>${esc(it.place_city || "")}</span>`;
  }

  // A video's tile is the same tile — the same frame at the same size, from the
  // same route — with two marks on it. Neither is decoration: without them a
  // frame out of a clip is indistinguishable from a photograph, and pressing it
  // does something else. The duration is inside the .shot so it sits over the
  // picture rather than competing with the caption under it.
  function marksHTML(it) {
    if (!isVideo(it)) return "";
