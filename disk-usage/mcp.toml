# MCP tools for this app, curated in fused-render's MCP panel.
# `fused app serve <this folder>` publishes one tool per [[tool]] table.

[[tool]]
name = "scan_disk_usage"
description = "Scan a directory and report which folders consume the most space."
file = "disk.py"
entrypoint = "main"
signature = "main(action: str='scan', path: str='~/Desktop', refresh: str='', **_)"
