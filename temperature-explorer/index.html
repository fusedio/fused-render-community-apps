<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Temperature Explorer</title>

<style>
  :root {
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --accent: #0071e3;
    --warm: #e34948;
    --cool: #2a78d6;
    --mid: #f0efec;
    --plot-surface: rgba(255, 255, 255, 0.5);

    --glass: linear-gradient(180deg, rgba(255,255,255,0.80), rgba(255,255,255,0.62));
    --glass-solid: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(255,255,255,0.84));
    --glass-blur: blur(30px) saturate(180%);
    --glass-edge: rgba(255, 255, 255, 0.72);
    --glass-shadow:
      0 1px 1px rgba(15, 23, 42, 0.04),
      0 10px 30px rgba(15, 23, 42, 0.10),
      0 28px 60px rgba(15, 23, 42, 0.06);
    --glass-sheen: inset 0 1px 0 rgba(255, 255, 255, 0.92);
    --hairline: rgba(15, 23, 42, 0.09);
    --radius: 18px;

    --font: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'Roboto Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: var(--font); color: var(--ink); background: #eef1f4;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    padding: 2rem; text-align: center; color: var(--ink-2); font-size: 15px; line-height: 1.6;
  }
  #boot code { font-family: var(--mono); background: #fff; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--hairline); }

  #app { position: fixed; inset: 0; }
  #map { position: absolute; inset: 0; }

  .glass {
    background: var(--glass);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-edge);
    border-radius: var(--radius);
    box-shadow: var(--glass-shadow), var(--glass-sheen);
  }

  /* the HUD is a click-through layer; only real controls take pointer events,
     so the map keeps the whole viewport as its drag surface */
  .hud { position: absolute; inset: 0; pointer-events: none; }
  .hud > * { pointer-events: auto; }

  /* ---- top-left: the search field is the primary control; the wordmark is a
     small caption above it rather than a panel of its own ---- */
  .topleft { position: absolute; top: 16px; left: 16px; width: 300px; pointer-events: none; }
  .topleft > * { pointer-events: auto; }
  .brand {
    display: inline-flex; align-items: center; gap: 6px; margin: 0 0 7px 2px;
    font-size: 9.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--ink-2); padding: 3px 9px 3px 7px; border-radius: 20px;
    background: rgba(255,255,255,0.62); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .brand .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warm); flex: none; }
  .search { position: relative; padding: 0; border-radius: 12px; }
  .search input {
    width: 100%; height: 38px; padding: 0 12px 0 34px; font-size: 13.5px; font-family: var(--font);
    border: 0; border-radius: 12px; background: transparent; color: var(--ink); outline: none;
  }
  .search input::placeholder { color: var(--muted); }
  .search:focus-within { box-shadow: var(--glass-shadow), var(--glass-sheen), 0 0 0 3px rgba(0,113,227,0.20); }
  .search .icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 15px; pointer-events: none; }
  .results {
    position: absolute; z-index: 30; top: calc(100% + 6px); left: 0; right: 0;
    background: var(--glass-solid); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-edge); border-radius: 12px; box-shadow: var(--glass-shadow);
    overflow: hidden auto; max-height: 264px;
  }
  .results.hidden { display: none; }
  .results div {
    padding: 8px 11px; font-size: 12.5px; cursor: pointer; line-height: 1.35;
    border-bottom: 1px solid rgba(15,23,42,0.05);
  }
  .results div:last-child { border-bottom: 0; }
  .results div:hover, .results div.active { background: rgba(0,113,227,0.09); }


  /* ---- top-right: headline numbers, one compact horizontal strip ---- */
  .tiles { position: absolute; top: 16px; right: 16px; display: flex; padding: 7px 4px; }
  .tile { padding: 0 13px; }
  .tile + .tile { border-left: 1px solid var(--hairline); }
  .tile .k { font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); white-space: nowrap; }
  .tile .row { display: flex; align-items: baseline; gap: 6px; margin-top: 2px; }
  .tile .v { font-size: 18px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.15; }
  .tile .s { font-size: 10px; color: var(--ink-2); white-space: nowrap; }
  .tile .s b { font-weight: 500; font-family: var(--mono); }

  /* ---- top-right, directly under the tiles: a horizontal tool row. It stays in
     the top band on purpose — anchored down the right edge it collided with the
     top of the dock on shorter viewports. ---- */
  .tools { position: absolute; top: 71px; right: 16px; display: flex; padding: 4px; gap: 2px; }
  .tools button {
    width: 32px; height: 32px; border: 0; border-radius: 10px; background: transparent; cursor: pointer;
    color: var(--ink-2); font-size: 15px; font-family: var(--font); display: grid; place-items: center;
    transition: background .14s, color .14s;
  }
  .tools button:hover { background: rgba(15,23,42,0.06); color: var(--ink); }
  .tools button.on { background: var(--accent); color: #fff; }
  .tools .sep { width: 1px; background: var(--hairline); margin: 4px 2px; }
  .tools svg, .ghost svg {
    width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5;
    stroke-linecap: round; stroke-linejoin: round; transition: transform .26s cubic-bezier(.4,0,.2,1);
  }
  .dock.shut #shutBtn svg { transform: rotate(180deg); }

  /* the marquee is drawn over the map for box-zoom, and inside the svg for the
     plot — same gesture, two surfaces */
  #mapMarquee {
    position: absolute; display: none; pointer-events: none; z-index: 5;
    border: 1.5px solid var(--accent); border-radius: 4px;
    background: rgba(0, 113, 227, 0.12); box-shadow: 0 0 0 1px rgba(255,255,255,0.7);
  }
  #map.arming .maplibregl-canvas-container { cursor: crosshair; }

  /* the pin marks a sampled grid point, not a place — so it reads as a target
     dot rather than a teardrop: warm core, white ring, one slow outward pulse */
  .pin { position: relative; width: 20px; height: 20px; cursor: grab; }
  .pin:active { cursor: grabbing; }
  .pin span { position: absolute; left: 50%; top: 50%; border-radius: 50%; transform: translate(-50%, -50%); }
  .pin .pulse {
    width: 20px; height: 20px; border: 1.5px solid var(--warm);
    animation: pin-pulse 2.6s cubic-bezier(.2,.6,.3,1) infinite;
  }
  .pin .ring {
    width: 15px; height: 15px; background: #fff;
    box-shadow: 0 1px 3px rgba(15,23,42,.34), 0 0 0 0.5px rgba(15,23,42,.14);
  }
  .pin .core { width: 8px; height: 8px; background: var(--warm); }
  @keyframes pin-pulse {
    0% { width: 12px; height: 12px; opacity: .55; }
    70% { width: 42px; height: 42px; opacity: 0; }
    100% { width: 42px; height: 42px; opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .pin .pulse { animation: none; opacity: .3; } }

  /* ---- bottom-right: the analysis dock ---- */
  .dock {
    position: absolute; right: 16px; bottom: 16px; left: auto;
    width: min(880px, calc(100vw - 32px)); height: min(52vh, 468px);
    display: flex; flex-direction: column; overflow: hidden; padding: 0;
    transition: height .26s cubic-bezier(.4,0,.2,1), width .26s cubic-bezier(.4,0,.2,1);
  }
  .dock.wide { width: calc(100vw - 32px); height: min(72vh, 720px); }
  /* expanded, the dock reaches under the map chrome — fade the chrome out
     rather than let it sit on top of the chart */
  .tiles, .tools { transition: opacity .22s, visibility .22s; }
  .hud:has(.dock.wide) .tiles, .hud:has(.dock.wide) .tools,
  .hud:has(.dock.wide) .attrib { opacity: 0; visibility: hidden; }
  .dock.shut { height: 46px; }
  /* display:none, not opacity — at narrow widths the dock is height:auto and an
     invisible body would still reserve its full height */
  .dock.shut .dock-body { display: none; }

  .dock-bar {
    flex: 0 0 46px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px;
    border-bottom: 1px solid var(--hairline);
  }
  .dock.shut .dock-bar { border-bottom-color: transparent; }
  .dock-body { flex: 1; min-height: 0; display: flex; flex-direction: column; transition: opacity .18s; }

  .views { display: flex; gap: 2px; background: rgba(15,23,42,0.05); border-radius: 10px; padding: 3px; }
  .views button {
    border: 0; background: transparent; padding: 6px 11px; border-radius: 8px; cursor: pointer;
    font-family: var(--font); font-size: 12.5px; font-weight: 500; color: var(--ink-2);
    white-space: nowrap; transition: background .15s, color .15s, box-shadow .15s;
  }
  .views button:hover { color: var(--ink); }
  .views button.on {
    background: #fff; color: var(--ink);
    box-shadow: 0 1px 2px rgba(15,23,42,0.16), 0 0 0 0.5px rgba(15,23,42,0.04);
  }
  .spacer { flex: 1 1 auto; min-width: 4px; }
  /* the years block, not the spacer, absorbs the bar's free width — otherwise
     both grow and the track never gets bigger than a couple of hundred pixels */
  .dock-bar .spacer { flex: 0 0 4px; }
  .ghost {
    border: 0; background: transparent; cursor: pointer; width: 30px; height: 30px; border-radius: 9px;
    color: var(--ink-2); font-size: 14px; font-family: var(--font); display: grid; place-items: center;
    transition: background .14s, color .14s;
  }
  .ghost:hover { background: rgba(15,23,42,0.06); color: var(--ink); }
  .ghost.ok, .ghost.ok:hover { color: #0a6b0a; background: rgba(12,163,12,0.14); }
  .chip {
    flex: none; border: 1px solid var(--hairline); background: rgba(255,255,255,0.5); cursor: pointer;
    border-radius: 8px; padding: 5px 10px; font-family: var(--font); font-size: 11.5px; color: var(--ink-2);
    white-space: nowrap; transition: background .14s, color .14s, border-color .14s;
  }
  .chip:hover { background: #fff; color: var(--ink); }
  .chip.on { background: rgba(0,113,227,0.10); border-color: rgba(0,113,227,0.28); color: #0a5bc0; }

  .viewrow {
    flex: 0 0 46px; display: flex; align-items: center; gap: 8px; padding: 0 12px;
    border-bottom: 1px solid var(--hairline);
  }
  .loc-mini {
    flex: 0 1 auto; min-width: 0; max-width: 200px; display: flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-2);
  }
  .loc-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--warm); flex: none;
    box-shadow: 0 0 0 2px rgba(227,73,72,0.18);
  }
  .loc-co { flex: none; font-variant-numeric: tabular-nums; }
  .loc-nm {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: var(--font); font-size: 11.5px; color: var(--muted);
  }
  .seg { display: flex; gap: 2px; background: rgba(15,23,42,0.05); border-radius: 9px; padding: 2.5px; flex: none; }
  .seg button {
    border: 0; background: transparent; padding: 5px 9px; border-radius: 7px; cursor: pointer;
    font-family: var(--font); font-size: 11.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(15,23,42,0.16); }

  /* the two ends are typeable: at 86 years on a ~300px track the handles sit a
     few pixels apart for a short span, which is not a usable way to set a year */
  .years { flex: 1 1 auto; min-width: 150px; display: flex; align-items: center; gap: 10px; }
  .yrin {
    flex: none; width: 46px; height: 26px; padding: 0 4px; text-align: center;
    font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums;
    border: 1px solid var(--hairline); border-radius: 7px; background: rgba(255,255,255,0.7);
    color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .yrin::-webkit-outer-spin-button, .yrin::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .yrin:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,113,227,0.16); }
  .yrin.bad { border-color: var(--warm); box-shadow: 0 0 0 3px rgba(227,73,72,0.16); }
  .years .cap { font-family: var(--mono); font-size: 10.5px; color: var(--muted); flex: none; }
  /* room for a handle to sit on either endpoint without being clipped */
  #yearSlider { flex: 1 1 auto; min-width: 90px; margin: 0 9px; }

  .run {
    flex: none; height: 30px; padding: 0 15px; border: 0; border-radius: 9px; background: var(--accent);
    color: #fff; font-family: var(--font); font-size: 12.5px; font-weight: 500; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; transition: filter .15s, opacity .15s, box-shadow .2s;
  }
  .run:hover { filter: brightness(1.06); }
  .run:disabled { opacity: .55; cursor: default; }
  .run svg {
    width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.2;
    stroke-linecap: round; stroke-linejoin: round; flex: none;
  }
  /* fetched: the button stops being an action and becomes the state readout —
     still clickable while the panel is shut, because opening it is the next step */
  .run.ready {
    background: rgba(12,163,12,0.13); color: #0a6b0a;
    box-shadow: inset 0 0 0 1px rgba(12,163,12,0.30);
  }
  .run.ready:hover { filter: none; background: rgba(12,163,12,0.20); }
  .run.ready.done, .run.ready.done:hover { cursor: default; background: rgba(12,163,12,0.13); }
  .spin {
    display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff; border-radius: 50%; animation: sp .7s linear infinite;
  }
  @keyframes sp { to { transform: rotate(360deg); } }

  .legendrow {
    flex: 0 0 30px; display: flex; align-items: center; gap: 12px; padding: 0 12px;
    overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
  }
  .legendrow::-webkit-scrollbar { display: none; }
  .lg { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-2); white-space: nowrap; flex: none; }
  .lg .box { width: 14px; height: 9px; border-radius: 2px; flex: none; }
  .prov { margin-left: auto; font-size: 10.5px; color: var(--muted); white-space: nowrap; flex: none; padding-left: 12px; }

  .yr-chip {
    display: inline-flex; align-items: center; gap: 6px; flex: none; cursor: pointer; user-select: none;
    font-size: 11px; font-weight: 500; color: var(--ink-2); border: 1px solid var(--hairline);
    border-radius: 7px; padding: 3px 8px 3px 5px; background: rgba(255,255,255,0.5);
    transition: opacity .14s, border-color .14s, background .14s;
  }
  .yr-chip:hover { background: #fff; }
  .yr-chip.off { opacity: .42; }
  .yr-chip.focus { border-width: 2px; padding: 2px 7px 2px 4px; color: var(--ink); }
  .yr-chip .swatch { flex: none; padding: 3px 2px; margin: -3px -2px; border-radius: 3px; }
  .yr-chip .swatch:hover { outline: 1.5px solid var(--baseline); outline-offset: 1px; }

  /* the plot never has anything floating over it except the cursor tooltip:
     readouts live in the rail beside it, zoom state lives in the bar above */
  .plot-row { flex: 1 1 auto; min-height: 0; display: flex; }
  .plot { flex: 1 1 auto; min-width: 0; position: relative; }
  .plot svg { display: block; }
  .plot .empty {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 0 3rem;
    color: var(--muted); font-size: 13px; text-align: center; line-height: 1.6;
  }
  /* errors don't blanket the chart: they dock as a card at the top of the
     plot, leaving whatever series is already drawn readable underneath */
  .plot .notice {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    max-width: min(92%, 560px); z-index: 5;
    background: var(--glass-solid); backdrop-filter: var(--glass-blur);
    border: 1px solid var(--hairline); border-left: 3px solid var(--warm);
    border-radius: 10px; box-shadow: var(--glass-shadow);
    padding: 9px 13px; font-size: 12px; line-height: 1.55; color: var(--ink-2);
  }
  .plot .notice b { color: var(--ink); font-weight: 500; }
  .rail {
    flex: 0 0 150px; border-left: 1px solid var(--hairline); padding: 10px 12px 12px;
    display: flex; flex-direction: column; overflow: hidden;
  }

  .inspect { pointer-events: none; }
  .inspect .when { font-size: 11px; font-weight: 500; display: flex; align-items: baseline; gap: 6px; }
  .inspect .when i { font-style: normal; font-size: 9.5px; color: var(--muted); font-weight: 400; }
  .inspect .big { font-size: 26px; font-weight: 500; letter-spacing: -0.02em; margin-top: 4px; line-height: 1.1; }
  .inspect .rows { margin-top: 8px; display: grid; grid-template-columns: auto auto; gap: 3px 10px; }
  .inspect .rows span { font-size: 10px; color: var(--muted); }
  .inspect .rows b { font-size: 10.5px; font-weight: 500; font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }

  .tip {
    position: absolute; display: none; pointer-events: none; z-index: 6; padding: 6px 9px;
    background: rgba(11,11,11,0.88); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    color: #fff; border-radius: 9px; font-size: 11px; line-height: 1.45; white-space: nowrap;
    box-shadow: 0 6px 18px rgba(0,0,0,0.24); transform: translate(-50%, -100%);
  }
  .tip b { font-family: var(--mono); font-weight: 500; }
  .tip .sub { color: rgba(255,255,255,0.6); font-size: 10px; }

  .zoomtag {
    display: none; align-items: center; gap: 6px; flex: none;
    background: rgba(0,113,227,0.10); border: 1px solid rgba(0,113,227,0.22); border-radius: 20px;
    padding: 3px 4px 3px 10px; font-family: var(--mono); font-size: 10.5px; color: #0a5bc0;
  }
  .zoomtag button {
    border: 0; background: rgba(0,113,227,0.16); color: #0a5bc0; width: 17px; height: 17px;
    border-radius: 50%; cursor: pointer; font-size: 11px; line-height: 1; display: grid; place-items: center; padding: 0;
  }
  .zoomtag button:hover { background: rgba(0,113,227,0.3); color: #fff; }

  /* ---- chart chrome ---- */
  .ax text { fill: var(--muted); font-size: 10.5px; font-family: var(--font); }
  .ax .tick line { stroke: var(--grid); }
  .ax path { display: none; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .axis-title { fill: var(--muted); font-size: 10px; }
  .cx-line { stroke: #9aa0a6; stroke-width: 1; }
  .zero-line { stroke: var(--baseline); stroke-width: 1; }
  .mean-line { fill: none; stroke: #3c4043; stroke-width: 2; stroke-linejoin: round; }
  .end-label { font-family: var(--mono); font-size: 10.5px; font-weight: 500; }
  .marquee { fill: rgba(0,113,227,0.12); stroke: var(--accent); stroke-width: 1; }
  .cell-ring { fill: none; stroke: var(--ink); stroke-width: 1.5; }
  .row-ring { fill: none; stroke: var(--ink); stroke-width: 1.2; opacity: .8; }
  .note { font-size: 10px; fill: var(--muted); font-family: var(--font); }

  /* ---- noUiSlider, restyled as glass ---- */
  #yearSlider.noUi-target {
    height: 4px; background: rgba(15,23,42,0.10); border: 0; border-radius: 2px; box-shadow: none;
  }
  #yearSlider .noUi-connect { background: var(--accent); border-radius: 2px; }
  #yearSlider .noUi-handle {
    width: 17px; height: 17px; top: -7px; right: -8.5px; border-radius: 50%;
    background: #fff; border: 2px solid var(--accent); box-shadow: 0 1px 3px rgba(15,23,42,0.28); cursor: grab;
  }
  /* a bigger grab target than the visible handle */
  #yearSlider .noUi-handle::before {
    display: block; content: ""; position: absolute; inset: -8px; border-radius: 50%;
  }
  #yearSlider .noUi-handle:after { display: none; }
  #yearSlider .noUi-handle:focus { outline: none; box-shadow: 0 1px 3px rgba(15,23,42,0.28), 0 0 0 4px rgba(0,113,227,0.2); }
  .noUi-tooltip { display: none; }

  /* bottom-left, the conventional corner for map credit. At desktop the dock is
     right-aligned so this corner is free; the two states where the dock takes the
     full width are handled below. */
  .attrib {
    position: absolute; left: 16px; bottom: 16px; font-size: 9.5px; color: var(--ink-2);
    letter-spacing: 0.01em; padding: 3px 9px; border-radius: 20px;
    background: rgba(255,255,255,0.62); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: opacity .22s, visibility .22s;
  }
  .attrib a { color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; }
  .attrib a:hover { color: var(--ink); }

  /* ---- narrow: the dock spans the width and the tiles wrap under the header ---- */
  /* ---- narrow: stop hand-placing the overlays and just stack them in normal
     flow down the left. Only the dock stays pinned to the bottom. ---- */
  @media (max-width: 900px) {
    .hud { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 16px; }
    /* the dock owns the whole bottom edge here, so the credit joins the stack */
    .topleft, .tiles, .tools, .attrib { position: static; top: auto; right: auto; left: auto; bottom: auto; }
    .attrib { align-self: flex-start; }
    .topleft { width: 100%; }
    .tiles { align-self: stretch; overflow-x: auto; }
    .tile { padding: 0 10px; }
    .tile .v { font-size: 16px; }
    .dock, .dock.wide { width: calc(100vw - 32px); }
    .dock-bar { flex-wrap: wrap; height: auto; flex: 0 0 auto; padding: 7px 8px 7px 12px; gap: 8px; }
    .dock.shut { height: auto; }
    .years { flex-basis: 100%; order: 3; }
    .run { order: 2; }
    .viewrow { flex-wrap: wrap; height: auto; flex: 0 0 auto; padding: 7px 12px; }
  }
  /* nowhere sensible left to float map tools on a very short viewport */
  @media (max-height: 430px) { .tools { display: none; } }
  @media (max-width: 620px) {
    .views button { padding: 6px 8px; font-size: 11.5px; }
    .tiles .tile:nth-child(3) { display: none; }
    .rail { flex-basis: 116px; padding: 8px 9px 10px; }
    .inspect .big { font-size: 21px; }
  }
</style>
