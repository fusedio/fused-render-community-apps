<!DOCTYPE html>
<html>
<head>
  <meta name="fused-app">
  <meta name="fused-app-id" content="open-tv-7c3e91a4">
  <meta name="fused-api-version" content="1" />
<meta charset="utf-8" />
<title>OpenTV</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e8eaed;
    background: #131417;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  #sidebar {
    width: 340px;
    min-width: 340px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #2a2d33;
  }
  #search-wrap { padding: 12px; border-bottom: 1px solid #2a2d33; }
  #search {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #2a2d33;
    background: #1b1d21;
    color: #e8eaed;
    font-size: 14px;
    outline: none;
  }
  #search:focus { border-color: #5b9dff; }
  #category {
    width: 100%;
    margin-bottom: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #2a2d33;
    background: #1b1d21;
    color: #e8eaed;
    font-size: 14px;
    outline: none;
  }
  #count { font-size: 12px; color: #9aa0a6; margin-top: 6px; }
  #list { flex: 1; overflow-y: auto; }
  .channel {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    cursor: pointer;
    border-bottom: 1px solid #1e2025;
  }
  .channel:hover { background: #1b1d21; }
  .channel.active { background: #22304a; }
  .channel img {
    width: 40px;
    height: 28px;
    object-fit: contain;
    background: #0d0e10;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .channel .meta { min-width: 0; }
  .channel .name {
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .channel .group { font-size: 11px; color: #9aa0a6; }
  .channel .group .kind { color: #c9a227; }
  #player-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 16px;
    min-width: 0;
  }
  #now-playing { font-size: 16px; margin: 0 0 10px; color: #e8eaed; }
  #now-playing span { color: #9aa0a6; font-size: 13px; }
  video {
    width: 100%;
    flex: 1;
    min-height: 0;
    background: #000;
    border: 1px solid #2a2d33;
    border-radius: 8px;
  }
  #status { font-size: 12px; color: #9aa0a6; margin-top: 8px; min-height: 1.2em; }
  #status.error { color: #ff7b72; }
  #health-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  #health-btn {
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid #2a2d33;
    background: #1b1d21;
    color: #e8eaed;
    font-size: 13px;
    cursor: pointer;
  }
  #health-btn:hover, #thumbs-btn:hover { border-color: #5b9dff; }
  #cancel-btn:hover { border-color: #ff7b72; }
  #health-btn:disabled, #thumbs-btn:disabled { opacity: 0.5; cursor: wait; }
  #thumbs-btn, #cancel-btn {
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid #2a2d33;
    background: #1b1d21;
    color: #e8eaed;
    font-size: 13px;
    cursor: pointer;
  }
  #health-summary { font-size: 13px; color: #9aa0a6; }
  #health-progress {
    display: none;
    flex: 1;
    max-width: 320px;
    height: 8px;
    border-radius: 4px;
    background: #1b1d21;
    border: 1px solid #2a2d33;
    overflow: hidden;
  }
  #health-progress .fill {
    height: 100%;
    width: 0%;
    background: #5b9dff;
    transition: width 0.4s;
  }
  #health-summary .pct { color: #7ee787; font-weight: 600; }
  #health-summary .pct.bad { color: #ffa657; }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-left: auto;
  }
  .dot.down { background: #ff7b72; }
  .dot.orange { background: #ffa657; }
  .dot.yellow { background: #e3c341; }
  .dot.wasabi { background: #aebe5e; }
  .dot.up { background: #7ee787; }
  .dot-wrap { position: relative; display: flex; align-items: center; }
  .dot-wrap .dot { margin-left: 0; }
  .dot-wrap .tip {
    display: none;
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: #26282e;
    border: 1px solid #3a3d44;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 11px;
    color: #e8eaed;
    white-space: nowrap;
    z-index: 10;
    pointer-events: none;
  }
  .dot-wrap:hover .tip { display: block; }
  .star {
    flex-shrink: 0;
    margin-left: auto;
    cursor: pointer;
    color: #5a5f68;
    font-size: 15px;
    padding: 0 2px;
    -webkit-user-select: none;
    user-select: none;
  }
  .star:hover { color: #e3c341; }
  .star.faved { color: #e3c341; }
</style>
</head>
<body>
  <div id="sidebar">
    <div id="search-wrap">
      <select id="category"></select>
      <input id="search" type="search" placeholder="Search channels…" />
      <div id="count"></div>
    </div>
    <div id="list"></div>
  </div>
  <div id="player-pane">
    <h2 id="now-playing">Pick a channel <span></span></h2>
    <video id="video" controls autoplay playsinline></video>
    <div id="status"></div>
    <div id="health-bar">
      <button id="health-btn">Run signal check</button>
      <button id="thumbs-btn">Get thumbnails</button>
      <button id="cancel-btn" style="display:none">Cancel</button>
      <div id="health-progress"><div class="fill"></div></div>
      <div id="health-summary">Health: <span class="pct">100%</span></div>
    </div>
  </div>

  <script>
    const listEl = document.getElementById("list");
    const searchEl = document.getElementById("search");
    const countEl = document.getElementById("count");
    const video = document.getElementById("video");
    const nowPlaying = document.getElementById("now-playing");
    const statusEl = document.getElementById("status");

    let channels = [];
    let hls = null;        // current hls.js instance
    let playToken = 0;     // bumps on every play(); stale async work checks it
    let bridgeId = null;   // ffmpeg bridge running on the proxy for the current channel
    let watchdog = null;
    // What the ffmpeg bridge must output for this engine: "h264" (copy when
    // possible), or "vp9" for a Chromium whose Media Source Extensions have
    // no H.264/AAC at all — then EVERY stream goes through the bridge.
    let bridgeTarget = "h264";
    let caps = null;

    const PROXY = "http://127.0.0.1:8787";
    const PROXY_BASE = PROXY + "/proxy?url=";
    const KIND_LABEL = {
      "hls-master": "HLS", "hls-media": "HLS", ts: "raw MPEG-TS", mp4: "MP4",
      dash: "DASH", html: "web page", empty: "empty response", gzip: "gzip blob",
      other: "unknown data", dead: "no response",
    };

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.className = isError ? "error" : "";
    }

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    function fetchJson(url, timeoutMs = 10000) {
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), timeoutMs);
      return fetch(url, { cache: "no-store", signal: ctl.signal })
        .then(r => r.json())
        .finally(() => clearTimeout(t));
    }

    // hls.js: the vendored copy first (works offline, never stalls the page on
    // a CDN), the CDN as a fallback. Resolves to whether window.Hls exists.
    const hlsReady = (async () => {
      if (window.Hls) return true;
      try {
        const src = await fused.readFile("vendor/hls.min.js");
        const s = document.createElement("script");
        s.textContent = src;
        document.head.appendChild(s);
        if (window.Hls) return true;
      } catch (e) { /* no vendored copy; try the CDN */ }
      return new Promise(resolve => {
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/hls.js@1.7.4/dist/hls.min.js";
        s.onload = () => resolve(!!window.Hls);
        s.onerror = () => resolve(false);
        document.head.appendChild(s);
      });
    })();
    const mseOk = () => !!(window.Hls && Hls.isSupported());
    const nativeOk = () => !!video.canPlayType("application/vnd.apple.mpegurl");

    // What this engine can actually decode. Hls.isSupported() is true as soon
    // as ANY of H.264 / VP9 / AV1 works in Media Source Extensions, so a build
    // without H.264 passes it and then fails every stream with
    // bufferAddCodecError — this tells the two apart.
    function playerCaps() {
      const ms = window.MediaSource;
      const t = c => !!(ms && ms.isTypeSupported && ms.isTypeSupported(c));
      return {
        mse: !!ms,
        h264: t('video/mp4;codecs="avc1.42E01E"'),
        h264High: t('video/mp4;codecs="avc1.64001f"'),
        aac: t('audio/mp4;codecs="mp4a.40.2"'),
        mp3: t('audio/mp4;codecs="mp4a.40.34"'),
        ac3: t('audio/mp4;codecs="ac-3"'),
        hevc: t('video/mp4;codecs="hvc1.1.6.L93.B0"'),
        vp9: t('video/mp4;codecs="vp09.00.10.08"'),
        av1: t('video/mp4;codecs="av01.0.01M.08"'),
        opus: t('audio/mp4;codecs="opus"'),
        nativeHls: video.canPlayType("application/vnd.apple.mpegurl"),
        nativeMp4: video.canPlayType('video/mp4; codecs="avc1.42E01E, mp4a.40.2"'),
        webm: video.canPlayType('video/webm; codecs="vp9, opus"'),
        hlsjs: !!window.Hls && Hls.version,
        ua: navigator.userAgent,
      };
    }

    // ---------------------------------------------------------------- proxy

    // Is the local proxy answering on 8787? A no-cors GET resolves (opaque)
    // on any HTTP answer and rejects only when nothing is listening.
    async function proxyUp() {
      try {
        await fetch(PROXY + "/health", { mode: "no-cors", cache: "no-store" });
        return true;
      } catch { return false; }
    }

    // Make sure the proxy is listening. proxy.py is this folder's fused-render
    // background daemon (pyproject.toml), so the page can start it itself.
    let proxyStarting = null;
    async function ensureProxy() {
      if (await proxyUp()) return true;
      if (!proxyStarting) {
        proxyStarting = (async () => {
          const daemon = window.fused && fused.daemon;
          if (!daemon || !daemon.start) {
            setStatus("Local proxy isn't running — start it with: python3 proxy.py", true);
            return false;
          }
          setStatus("Starting local proxy…");
          try {
            await daemon.start();
          } catch (e) {
            setStatus("Couldn't start the local proxy: " + (e && e.message || e), true);
            return false;
          }
          for (let i = 0; i < 40; i++) {
            if (await proxyUp()) return true;
            await sleep(250);
          }
          setStatus("Local proxy started but port 8787 isn't answering — is another proxy.py holding it?", true);
          return false;
        })().finally(() => { proxyStarting = null; });
      }
      return proxyStarting;
    }

    // ------------------------------------------------------------- playback

    function stopPlayback() {
      if (watchdog) { clearTimeout(watchdog); watchdog = null; }
      if (hls) { hls.destroy(); hls = null; }
      video.onerror = null;
      if (video.getAttribute("src")) { video.removeAttribute("src"); video.load(); }
      if (bridgeId) {
        fetch(`${PROXY}/bridge/stop?id=${bridgeId}`, { keepalive: true, cache: "no-store" }).catch(() => {});
        bridgeId = null;
      }
    }
    window.addEventListener("pagehide", stopPlayback);

    function describeVia(via, detail) {
      if (via === "proxy") return "HLS via local proxy";
      if (via === "bridge") return "ffmpeg bridge (" + detail + ")";
      return "direct";
    }

    async function play(ch, el) {
      const token = ++playToken;
      document.querySelectorAll(".channel.active").forEach(e => e.classList.remove("active"));
      if (el) el.classList.add("active");
      nowPlaying.innerHTML = "";
      nowPlaying.append(ch.name, " ");
      const span = document.createElement("span");
      span.textContent = ch.group + " · ";
      const link = document.createElement("a");
      link.href = ch.url;
      link.target = "_blank";
      link.textContent = ch.url;
      link.style.cssText = "color:#8a919c;font-size:13px;font-weight:300;word-break:break-all;text-decoration:none;";
      span.appendChild(link);
      nowPlaying.appendChild(span);
      stopPlayback();
      setStatus("Checking signal…");

      await hlsReady;
      if (token !== playToken) return;
      const up = await ensureProxy();
      if (token !== playToken) return;
      if (!up) {
        // Last resort without a proxy: most public streams refuse cross-origin loads.
        if (mseOk()) {
          setStatus("No local proxy — trying to play directly (most streams refuse this)…");
          startHls(ch.url, { via: "direct", ch, token });
        } else {
          playNative(ch.url, token, "direct");
        }
        return;
      }

      // The signal check: one small server-side GET tells us within a few
      // seconds whether anything is there and what it is, so a dead channel
      // reports as dead instead of spinning through hls.js retries.
      let check = null;
      try {
        check = await fetchJson(`${PROXY}/check?deep=1&url=${encodeURIComponent(ch.url)}`, 25000);
      } catch (e) { /* proxy hiccup: load blind below */ }
      if (token !== playToken) return;
      if (!check || check.error && !check.kind) {
        setStatus("Proxy didn't answer the signal check — loading anyway…");
        startHls(PROXY_BASE + encodeURIComponent(ch.url), { via: "proxy", ch, token });
        return;
      }
      if (!check.ok) {
        const secs = (check.ms / 1000).toFixed(1);
        setStatus(`No signal — ${check.error} · checked in ${secs} s`, true);
        return;
      }
      const label = check.label || KIND_LABEL[check.kind] || check.kind;
      if (bridgeTarget === "vp9") {
        startBridge(ch, token, "transcode",
          `Signal OK (${label}) — this engine can't decode H.264, converting to VP9 with ffmpeg…`);
        return;
      }
      if (check.kind === "hls-master" || check.kind === "hls-media") {
        const n = check.segments;
        setStatus(`Signal OK (${label}${check.live === false ? ", recorded" : ""}` +
                  (n ? `, ${n} segment${n === 1 ? "" : "s"}` : "") + ") — loading…");
        const url = PROXY_BASE + encodeURIComponent(ch.url);
        if (mseOk()) startHls(url, { via: "proxy", ch, token });
        else playNative(url, token, "proxy");
      } else {
        startBridge(ch, token, "auto",
          `Signal OK (${label}) — the browser can't play this directly, converting with ffmpeg…`);
      }
    }

    // The signal check already proved the playlist is there: fail fast
    // instead of hls.js's default retry ladders (30 s+ before a fatal error).
    const policy = (retries, firstByteMs, loadMs) => ({ default: {
      maxTimeToFirstByteMs: firstByteMs, maxLoadTimeMs: loadMs,
      timeoutRetry: { maxNumRetry: 1, retryDelayMs: 0, maxRetryDelayMs: 0 },
      errorRetry: { maxNumRetry: retries, retryDelayMs: 500, maxRetryDelayMs: 3000 },
    } });

    function startHls(url, opts) {
      const { via, ch, token } = opts;
      const h = new Hls({
        enableWebVTT: false,
        enableIMSC1: false,
        enableCEA708Captions: false,
        backBufferLength: 60,
        manifestLoadPolicy: policy(1, 12000, 20000),
        playlistLoadPolicy: policy(2, 12000, 20000),
        fragLoadPolicy: policy(3, 12000, 60000),
      });
      hls = h;
      let recoveries = 0, playing = false;
      const stale = () => token !== playToken || hls !== h;
      armWatchdog(token, () => !playing, via, ch);

      h.on(Hls.Events.MANIFEST_PARSED, (_, data) => {
        if (stale()) return;
        const n = data.levels.length;
        setStatus(`Buffering (${n} quality level${n === 1 ? "" : "s"}, ${describeVia(via, opts.detail)})…`);
        video.play().catch(() => {});
      });
      h.on(Hls.Events.FRAG_BUFFERED, () => {
        if (stale() || playing) return;
        playing = true;
        if (watchdog) { clearTimeout(watchdog); watchdog = null; }
        setStatus(`Playing — ${describeVia(via, opts.detail)}`);
      });
      h.on(Hls.Events.ERROR, (_, data) => {
        if (stale()) return;
        if (!data.fatal) {
          // Direct loads: a blocked segment shows up here long before hls.js gives up.
          if (via === "direct" && data.type === Hls.ErrorTypes.NETWORK_ERROR) switchToProxy();
          return;
        }
        const code = data.response && data.response.code;
        const where = data.details.replace(/Error$/, "").replace(/([A-Z])/g, " $1").trim().toLowerCase();
        const http = code ? `, HTTP ${code}` : "";
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
          if (via === "direct") return switchToProxy();
          if (!code || code === 502 || code === 504) {
            proxyUp().then(up => {
              if (stale()) return;
              setStatus(up ? `Stream stopped answering (${where}${http}).`
                           : "Local proxy stopped answering — pick the channel again to restart it.", true);
            });
          } else {
            setStatus(`Stream failed (${where}${http}) — it's likely dead or geo-blocked.`, true);
          }
          return;
        }
        if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
          const codec = /IncompatibleCodecs|bufferAddCodec/i.test(data.details);
          if (codec && via !== "bridge") {
            return startBridge(ch, token, "auto", "Codecs this browser can't decode — converting with ffmpeg…");
          }
          if (codec && via === "bridge" && bridgeTarget === "h264") {
            // Even ffmpeg's H.264/AAC output is refused: this engine has no
            // H.264 in MSE. Switch to VP9/Opus for this and every later stream.
            bridgeTarget = "vp9";
            return startBridge(ch, token, "transcode", "This engine can't decode H.264 — converting to VP9 with ffmpeg…");
          }
          if (recoveries === 0) {
            recoveries++;
            setStatus("Media error — recovering…");
            h.recoverMediaError();
            return;
          }
          if (recoveries === 1) {
            recoveries++;
            h.swapAudioCodec();
            h.recoverMediaError();
            return;
          }
          if (via !== "bridge") {
            return startBridge(ch, token, "transcode", "Browser can't decode this stream — transcoding with ffmpeg…");
          }
          setStatus(`Media error: ${data.details}`, true);
          return;
        }
        if (via !== "bridge") {
          return startBridge(ch, token, "auto", `${where} — converting with ffmpeg…`);
        }
        setStatus(`Stream error: ${data.details}`, true);
      });

      function switchToProxy() {
        setStatus("Direct load blocked — retrying through local proxy…");
        h.destroy();
        if (hls === h) hls = null;
        ensureProxy().then(ok => {
          if (token !== playToken) return;
          if (ok) startHls(PROXY_BASE + encodeURIComponent(ch.url), { via: "proxy", ch, token });
        });
      }

      h.loadSource(url);
      h.attachMedia(video);
    }

    function armWatchdog(token, stillWaiting, via, ch) {
      if (watchdog) clearTimeout(watchdog);
      watchdog = setTimeout(() => {
        if (token !== playToken || !stillWaiting()) return;
        setStatus("Still waiting for video data (slow stream)…");
        watchdog = setTimeout(() => {
          if (token !== playToken || !stillWaiting()) return;
          if (via !== "bridge") startBridge(ch, token, "auto", "No video after 40 s — trying ffmpeg instead…");
          else setStatus("No video arrived in 40 s — the stream looks stalled.", true);
        }, 20000);
      }, 20000);
    }

    // ffmpeg on the proxy turns anything hls.js can't play (raw MPEG-TS,
    // DASH, HEVC / AC-3 / MP2 …) into a local HLS stream it can.
    async function startBridge(ch, token, mode, msg) {
      if (watchdog) { clearTimeout(watchdog); watchdog = null; }
      if (hls) { hls.destroy(); hls = null; }
      if (bridgeId) {
        fetch(`${PROXY}/bridge/stop?id=${bridgeId}`, { cache: "no-store" }).catch(() => {});
        bridgeId = null;
      }
      setStatus(msg || "Converting stream with ffmpeg…");
      let start;
      try {
        start = await fetchJson(`${PROXY}/bridge/start?mode=${mode}&target=${bridgeTarget}&url=${encodeURIComponent(ch.url)}`, 10000);
      } catch (e) {
        if (token === playToken) setStatus("Couldn't reach the local proxy to start ffmpeg: " + (e.message || e), true);
        return;
      }
      if (start.error) { setStatus("ffmpeg bridge: " + start.error, true); return; }
      if (token !== playToken) {
        fetch(`${PROXY}/bridge/stop?id=${start.id}`, { cache: "no-store" }).catch(() => {});
        return;
      }
      bridgeId = start.id;
      const t0 = Date.now();
      while (Date.now() - t0 < 45000) {
        await sleep(500);
        if (token !== playToken || bridgeId !== start.id) return;
        let st;
        try { st = await fetchJson(`${PROXY}/bridge/status?id=${start.id}`, 5000); }
        catch (e) { continue; }
        if (st.state === "failed") {
          setStatus(`ffmpeg couldn't play this stream: ${st.error}`, true);
          return;
        }
        if (st.playlist_ready && (st.segments >= 2 || st.state === "ended")) {
          const v = st.video === "copy" ? "video copied"
            : st.video === "libvpx-vp9" ? "video → VP9"
            : st.video ? `video → H.264 (${st.video})` : "no video";
          const a = st.audio === "copy" ? "audio copied" : st.audio === "libopus" ? "audio → Opus" : "audio → AAC";
          const detail = `${v}, ${a}`;
          if (mseOk()) startHls(PROXY + st.playlist, { via: "bridge", ch, token, detail });
          else playNative(PROXY + st.playlist, token, "bridge");
          return;
        }
        const what = st.state === "probing" ? "Probing codecs" : st.state === "starting" ? "Starting ffmpeg" : "Converting";
        const codecs = st.codecs && st.codecs.video ? ` (${st.codecs.video} / ${st.codecs.audio || "no audio"})` : "";
        setStatus(`${what} with ffmpeg${codecs}… ${st.segments} segment${st.segments === 1 ? "" : "s"} ready`);
      }
      if (token === playToken) setStatus("ffmpeg produced no video in 45 s — giving up on this stream.", true);
    }

    // Engines without Media Source Extensions (Safari-style) play HLS natively.
    function playNative(url, token, via) {
      if (!nativeOk()) {
        setStatus("This browser can't play HLS: no Media Source Extensions with H.264 and no native HLS.", true);
        return;
      }
      video.onerror = () => {
        if (token === playToken) setStatus("The browser's native player couldn't play this stream.", true);
      };
      video.src = url;
      video.play()
        .then(() => { if (token === playToken) setStatus(`Playing — native player, ${via}`); })
        .catch(() => {});
    }

    // ------------------------------------------------------------ channel list

    function render(filter = "") {
      const q = filter.trim().toLowerCase();
      const shown = (q
        ? channels.filter(c =>
            c.name.toLowerCase().includes(q) || c.group.toLowerCase().includes(q))
        : channels.slice())
        .sort((a, b) => {
          const fa = favSet.has(a.url), fb = favSet.has(b.url);
          if (fa !== fb) return fa ? -1 : 1; // favorites first
          const ra = healthMap.get(a.url), rb = healthMap.get(b.url);
          const ka = ra ? ra.fail_pct : -1, kb = rb ? rb.fail_pct : -1;
          if (ka !== kb) return ka - kb; // healthy first, worst failures last
          if (ra && rb && ra.fails !== rb.fails) return ra.fails - rb.fails;
          return a.name.localeCompare(b.name);
        });
      countEl.textContent = q
        ? `${shown.length} / ${channels.length} channels`
        : "";
      listEl.innerHTML = "";
      const frag = document.createDocumentFragment();
      for (const ch of shown) {
        const row = document.createElement("div");
        row.className = "channel";
        const img = document.createElement("img");
        img.loading = "lazy";
        img.dataset.url = ch.url;
        const thumb = thumbMap.get(ch.url) || ch.thumb;
        if (thumb) img.src = thumb;
        else img.style.visibility = "hidden";
        img.onerror = () => { img.style.visibility = "hidden"; };
        const meta = document.createElement("div");
        meta.className = "meta";
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = ch.name;
        const group = document.createElement("div");
        group.className = "group";
        group.textContent = ch.group;
        const rec = healthMap.get(ch.url);
        if (rec && rec.kind && !rec.kind.startsWith("hls") && KIND_LABEL[rec.kind] && rec.responsive_now) {
          const kind = document.createElement("span");
          kind.className = "kind";
          kind.textContent = ` · ${KIND_LABEL[rec.kind]} (ffmpeg)`;
          group.appendChild(kind);
        }
        meta.append(name, group);
        row.append(img, meta);
        const star = document.createElement("div");
        star.className = "star" + (favSet.has(ch.url) ? " faved" : "");
        star.textContent = favSet.has(ch.url) ? "★" : "☆";
        star.addEventListener("click", async (ev) => {
          ev.stopPropagation();
          if (favSet.has(ch.url)) favSet.delete(ch.url);
          else favSet.add(ch.url);
          star.classList.toggle("faved");
          star.textContent = favSet.has(ch.url) ? "★" : "☆";
          try {
            await fused.runPython("./favorites.py",
              { action: "toggle", channel: JSON.stringify(ch) });
          } catch (e) { setStatus("Failed to save favorite", true); }
          catCache.delete("favorites");
          if (currentCategory === "favorites") showCategory("favorites");
          else render(searchEl.value);
        });
        row.appendChild(star);
        if (rec) {
          const wrap = document.createElement("div");
          wrap.className = "dot-wrap";
          const dot = document.createElement("div");
          const okRate = 100 * (rec.tries - rec.fails) / rec.tries;
          const cls = okRate >= 100 ? "up"
            : okRate >= 75 ? "wasabi"
            : okRate >= 50 ? "yellow"
            : okRate >= 25 ? "orange"
            : "down";
          dot.className = "dot " + cls;
          const tip = document.createElement("div");
          tip.className = "tip";
          let text = `${rec.tries - rec.fails}/${rec.tries} checks OK`;
          if (rec.kind && KIND_LABEL[rec.kind]) text += ` · ${KIND_LABEL[rec.kind]}`;
          if (!rec.responsive_now && rec.last_error) text += ` · ${rec.last_error}`;
          tip.textContent = text;
          wrap.append(dot, tip);
          row.appendChild(wrap);
        }
        row.addEventListener("click", () => play(ch, row));
        frag.appendChild(row);
      }
      listEl.appendChild(frag);
    }

    searchEl.addEventListener("input", () => render(searchEl.value));

    // ------------------------------------------------------- background jobs

    const healthBtn = document.getElementById("health-btn");
    const thumbsBtn = document.getElementById("thumbs-btn");
    const healthSummary = document.getElementById("health-summary");
    const healthMap = new Map(); // url -> record from health.parquet
    const thumbMap = new Map();  // url -> data URI (from a live run)

    // Health % over the channels currently shown (selected category).
    function updateHealthSummary() {
      let checked = 0, ok = 0;
      for (const ch of channels) {
        const rec = healthMap.get(ch.url);
        if (rec) { checked++; if (rec.responsive_now) ok++; }
      }
      const pct = checked ? Math.round(1000 * ok / checked) / 10 : 100;
      healthSummary.innerHTML = "";
      healthSummary.append("Health: ");
      const pctEl = document.createElement("span");
      pctEl.className = "pct" + (pct < 90 ? " bad" : "");
      pctEl.textContent = `${pct}%`;
      healthSummary.append(pctEl,
        checked ? ` — ${ok}/${checked} responsive` : " — not checked yet");
    }

    function renderHealth(result) {
      healthMap.clear();
      for (const r of (result.records || result.unresponsive)) healthMap.set(r.url, r);
      updateHealthSummary();
      render(searchEl.value);
    }

    const healthProgress = document.getElementById("health-progress");
    const healthFill = healthProgress.querySelector(".fill");
    let pollTimer = null;
    let polling = false;
    let cursor = 0;

    function showProgress(state, jobType) {
      healthProgress.style.display = "block";
      const pct = state.total ? (100 * state.finished / state.total) : 0;
      healthFill.style.width = `${pct.toFixed(1)}%`;
      healthSummary.textContent = jobType === "thumbs"
        ? `Thumbnails… ${state.finished}/${state.total} (${state.ok} grabbed)`
        : `Checking… ${state.finished}/${state.total} (${state.failed} failing)`;
    }

    const cancelBtn = document.getElementById("cancel-btn");
    let currentRunId = null;

    function stopPolling() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      healthBtn.disabled = false;
      healthBtn.textContent = "Run signal check";
      thumbsBtn.disabled = false;
      thumbsBtn.textContent = "Get thumbnails";
      cancelBtn.style.display = "none";
      currentRunId = null;
      healthProgress.style.display = "none";
      fused.params.set("bg_run", "");
    }

    cancelBtn.addEventListener("click", () => {
      if (!currentRunId) return;
      const runId = currentRunId;
      stopPolling(); // reset UI right away; worker winds down on its own
      healthSummary.textContent =
        "Cancelled (in-flight jobs may keep running briefly in the background).";
      fused.runPython("./runner.py", { action: "cancel", run_id: runId })
        .catch(() => {});
    });

    function applyThumbEvents(events) {
      for (const e of events) {
        if (e.type === "job_end" && e.msg && e.msg.thumb) {
          thumbMap.set(e.msg.url, e.msg.thumb);
          const img = listEl.querySelector(`img[data-url="${CSS.escape(e.msg.url)}"]`);
          if (img) {
            img.src = thumbMap.get(e.msg.url);
            img.style.visibility = "visible";
          }
        }
      }
    }

    async function poll(runId, jobType) {
      if (polling) return;
      polling = true;
      try {
        const s = await fused.runPython("./runner.py",
          { action: "status", run_id: runId, since: String(cursor) });
        if (s.error) {
          setStatus(`Run: ${s.error}`, true);
          stopPolling();
          return;
        }
        cursor = s.cursor;
        showProgress(s.state, jobType);
        if (jobType === "thumbs") applyThumbEvents(s.events);
        if (!s.state.running) {
          stopPolling();
          const sum = s.state.summary;
          if (sum && !sum.error) {
            if (jobType === "thumbs") {
              if (sum.health) renderHealth(sum.health);
              setStatus(`Thumbnails: ${sum.grabbed}/${sum.checked} grabbed`);
            } else {
              renderHealth(sum);
              setStatus(`Signal check: ${sum.responsive_now}/${sum.checked} channels have a signal`);
            }
          } else {
            setStatus(`Run failed: ${sum?.error || "unknown"}`, true);
          }
        }
      } catch (e) {
        setStatus(`Poll failed: ${e.message || e}`, true);
        stopPolling();
      } finally {
        polling = false;
      }
    }

    function watchRun(runId, jobType) {
      const btn = jobType === "thumbs" ? thumbsBtn : healthBtn;
      healthBtn.disabled = true;
      thumbsBtn.disabled = true;
      btn.textContent = "Running…";
      currentRunId = runId;
      cancelBtn.style.display = "";
      cursor = 0;
      pollTimer = setInterval(() => poll(runId, jobType), 700);
      poll(runId, jobType);
    }

    async function startRun(jobType) {
      healthBtn.disabled = true;
      thumbsBtn.disabled = true;
      try {
        const { run_id, error } = await fused.runPython("./runner.py",
          { action: "start", job: jobType, category: currentCategory });
        if (error) throw new Error(error);
        fused.params.set("bg_run", `${jobType}:${run_id}`);
        watchRun(run_id, jobType);
      } catch (e) {
        setStatus(`Failed to start: ${e.message || e}`, true);
        stopPolling();
      }
    }

    healthBtn.addEventListener("click", () => startRun("health"));
    thumbsBtn.addEventListener("click", () => startRun("thumbs"));

    // Resume watching an in-flight run after a page refresh.
    const existingRun = fused.params.get("bg_run");
    if (existingRun && existingRun.includes(":")) {
      const [jobType, runId] = existingRun.split(":");
      watchRun(runId, jobType);
    }

    // ------------------------------------------------------------ categories

    const categoryEl = document.getElementById("category");
    const favSet = new Set();
    let currentCategory = fused.params.get("cat") || "sports";

    let catsHaveCounts = false;
    function fillCategories(cats, counts) {
      if (catsHaveCounts || (categoryEl.options.length && !counts)) return;
      catsHaveCounts = !!counts;
      const ordered = counts
        ? cats.filter(c => (counts[c] || 0) > 0)
              .sort((a, b) => (counts[b] || 0) - (counts[a] || 0))
        : cats;
      categoryEl.innerHTML = "";
      for (const c of ["favorites", ...ordered]) {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent =
          c === "favorites" ? "★ favorites"
          : c === "all" ? `all categories (${counts ? counts.all : ""})`
          : counts ? `${c} (${counts[c]})` : c;
        categoryEl.appendChild(opt);
      }
      categoryEl.value = currentCategory;
    }

    const catCache = new Map(); // category -> channels[]

    async function loadCategory(cat) {
      if (cat === "favorites") {
        const favs = await fused.runPython("./favorites.py", { action: "list" });
        favSet.clear();
        for (const u of favs.urls) favSet.add(u);
        return favs.channels;
      }
      const result = await fused.runPython("./channels.py", { category: cat });
      fillCategories(result.categories, result.counts);
      return result.channels;
    }

    async function showCategory(cat) {
      if (catCache.has(cat)) { // instant from page cache
        channels = catCache.get(cat);
        categoryEl.value = cat;
        updateHealthSummary();
        render(searchEl.value);
        return;
      }
      setStatus("Loading channel list…");
      channels = await loadCategory(cat);
      catCache.set(cat, channels);
      if (cat !== currentCategory) return; // user switched again meanwhile
      categoryEl.value = cat;
      updateHealthSummary();
      render(searchEl.value);
      setStatus("");
    }

    async function init() {
      const favs = await fused.runPython("./favorites.py", { action: "list" });
      favSet.clear();
      for (const u of favs.urls) favSet.add(u);
      fillCategories(favs.categories);
      catCache.set("favorites", favs.channels);
      await showCategory(currentCategory);
      try {
        const saved = await fused.runPython("./stats.py", {});
        if (saved.checked) renderHealth(saved);
      } catch (e) { /* no saved stats yet */ }
      refreshInBackground();
      const haveHls = await hlsReady;
      caps = playerCaps();
      console.log("[opentv] player caps", JSON.stringify(caps));
      fused.runPython("./diag.py", { caps: JSON.stringify(caps) }).catch(() => {});
      if (!haveHls && !nativeOk()) {
        setStatus("hls.js failed to load (vendor/hls.min.js missing and no CDN) — streams can't play.", true);
      } else if (!mseOk() && !nativeOk()) {
        setStatus("This browser can't play HLS: no Media Source Extensions and no native HLS.", true);
      } else if (mseOk() && !(caps.h264 && caps.aac) && !nativeOk()) {
        if (caps.vp9 && caps.opus) {
          bridgeTarget = "vp9";
          setStatus("This engine can't decode H.264/AAC in its video stack — every stream will be converted to VP9/Opus by ffmpeg (needs ffmpeg, uses CPU, ~5 s to start).");
        } else {
          setStatus("This engine's video stack decodes neither H.264 nor VP9 — streams can't play here.", true);
        }
      }
    }

    // Serve the cached list instantly, refetch stale playlists (>24h) quietly.
    async function refreshInBackground() {
      if (currentCategory === "favorites") return;
      const cat = currentCategory;
      try {
        const fresh = await fused.runPython("./channels.py",
          { category: cat, refresh: "1" });
        if (fresh.channels) {
          catCache.set(cat, fresh.channels);
          if (cat === currentCategory) {
            channels = fresh.channels;
            render(searchEl.value);
          }
        }
      } catch (e) { /* keep cached list */ }
    }

    categoryEl.addEventListener("change", () => {
      currentCategory = categoryEl.value;
      fused.params.set("cat", currentCategory);
      showCategory(currentCategory);
    });

    init();
  </script>
</body>
</html>
