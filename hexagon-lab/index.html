        let h = "";
        if (DATA.on){
          h += `<div class="mr"><span>points here</span><b>${DATA.count(grid.kind, S.hover.id)}</b></div>`;
        } else {
          const nbrs = grid.neighborsOf(S.hover);
          const near = nbrs.filter(n => n.dist === 1).length;
          const far  = nbrs.length - near;
          h += `<div class="mr"><span>neighbors</span><b>${nbrs.length}</b></div>`;
          h += `<div class="mr"><span><i class="chip" style="background:${ORANGE}"></i>at 1.00·d</span><b>${near}</b></div>`;
          if (grid.kind === "square" || far > 0)
            h += `<div class="mr"><span class="bad"><i class="chip" style="background:${RED}"></i>at 1.41·d</span><b>${far}</b></div>`;
        }
        meterEl.innerHTML = h;
      }

      draw();
      return { grid, S, draw, ringMap, nearest, canvas, W, H, centerCell: grid.center() };
    }

    /* ================= nerd panel ================= */
    const histCv = $("#hist");
    (function sizeHist(){
      const w = 400, h = 168;
      histCv.width = w * DPR; histCv.height = h * DPR;
      histCv.style.width = w + "px"; histCv.style.height = h + "px";
    })();

    const last = { hex: null, sq: null };

    function drawHist(){
      const g = histCv.getContext("2d");
      const W = 400, H = 168;
      g.setTransform(DPR, 0, 0, DPR, 0, 0);
      g.clearRect(0, 0, W, H);
      const base = H - 34, top = 16, maxN = 8;
      const groups = [
        { name: "HEX",    x0: 30,  w: 160, st: last.hex },
        { name: "SQUARE", x0: 218, w: 160, st: last.sq  },
      ];
      g.textAlign = "center";
      for (const gr of groups){
        g.strokeStyle = LINE; g.lineWidth = 1;
        g.beginPath(); g.moveTo(gr.x0, base + .5); g.lineTo(gr.x0 + gr.w, base + .5); g.stroke();
        g.font = "700 10px 'SF Mono',ui-monospace,Menlo,monospace";
        g.fillStyle = MUT2;
        g.fillText(gr.name, gr.x0 + gr.w / 2, H - 6);
        if (!gr.st) continue;
        const counts = new Map();
        for (const d of gr.st.dists) counts.set(fmt2(d), (counts.get(fmt2(d)) || 0) + 1);
        const keys = [...counts.keys()].sort();
        const bw = 44, gap = 34;
        const total = keys.length * bw + (keys.length - 1) * gap;
        let x = gr.x0 + (gr.w - total) / 2;
        for (const k of keys){
          const n = counts.get(k);
          const bh = (base - top) * n / maxN;
          const col = k === "1.00" ? ORANGE : RED;
          g.fillStyle = col; g.globalAlpha = 0.9;
          g.beginPath(); g.roundRect(x, base - bh, bw, bh, [3, 3, 0, 0]); g.fill();
          g.globalAlpha = 1;
          g.font = "700 11px 'SF Mono',ui-monospace,Menlo,monospace";
          g.fillStyle = col; g.fillText("×" + n, x + bw / 2, base - bh - 8);
          g.font = "700 10px 'SF Mono',ui-monospace,Menlo,monospace";
          g.fillStyle = MUT; g.fillText(k + "·d", x + bw / 2, base + 12);
          x += bw + gap;
        }
      }
      g.font = "italic 10px Georgia,serif"; g.fillStyle = MUT2; g.textAlign = "center";
      g.fillText("one spike", 110, 10);
      g.fillText("two spikes", 298, 10);
    }

    /* ================= synced wiring ================= */
    const capEl = $("#nbcap");
    const tbl = $("#ringTbl");
    const stHex = makeStage($("#cvHex"), $("#meterHex"), buildHex);
    const stSq  = makeStage($("#cvSq"),  $("#meterSq"),  buildSquare);

    const CAPS = {
      rest:  `<b>hover</b> a cell · <b>click</b> to flood rings`,
      rings: `hex rings hug the dashed circles · square corners overshoot by <b style="color:#b5442c">41%</b>`,
      data:  `raw points · <b>click</b> a cell to count what each ring captures`,
    };

    function mirror(cell, from, to){
      // both canvases are the same size and the grids tessellate the SAME
      // plane, so the equivalent cell is simply the one covering the same
      // world position (null if off-grid)
      return to.nearest(cell.cx, cell.cy);
    }

    function snapshot(st){
      if (!st.S.hover) return null;
      const nbrs = st.grid.neighborsOf(st.S.hover);
      return { dists: nbrs.map(n => n.dist) };
    }

    function hoverPair(src, cell){
      const dst = src === stHex ? stSq : stHex;
      src.S.hover = cell;
      dst.S.hover = mirror(cell, src, dst);
      stHex.draw(); stSq.draw();
      last.hex = snapshot(stHex); last.sq = snapshot(stSq);
      drawHist();
    }

    /* ---- ring stats + progressive table ---- */
    let ringStats = null;    // {t0, mode:"area"|"count", truth:[3], hex:[3]|null, sq:[3]|null}

    function cumRingCounts(st, origin){
      // points captured by all cells with ring index <= k (origin = ring 0)
      const m = st.ringMap(origin);
      const cum = [];
      let s = DATA.count(st.grid.kind, origin.id);
      for (let k = 1; k <= 3; k++){
        for (const c of m.get(k) || []) s += DATA.count(st.grid.kind, c.id);
        cum.push(s);
      }
      return cum;
    }

    function truthCounts(cx, cy, d){
      // only points that landed in a cell on BOTH grids — margins that no grid
      // covers can never be captured by rings and must not inflate the truth
      const cum = [0, 0, 0];
      DATA.pts.forEach(([x, y], ix) => {
        if (!DATA.covered(ix)) return;
        const r = Math.hypot(x - cx, y - cy);
        for (let k = 0; k < 3; k++) if (r <= (k + 1) * d + 1e-6) cum[k]++;
      });
      return cum;
    }

    function areaStats(t0){
      // exact k-disk areas in units of d² (square side s = d in this plane)
      const truth = [], hex = [], sq = [];
      for (let k = 1; k <= 3; k++){
        truth.push(Math.PI * k * k);                 // π·(k·d)²
        hex.push((3*k*k + 3*k + 1) * SQ3 / 2);       // (3k²+3k+1) cells × (√3/2)·d²
        sq.push((2*k + 1) ** 2);                     // (2k+1)² cells × d²
      }
      return { t0, mode: "area", truth, hex, sq };
    }

    // every cell always carries an .err span (fixed-width) so the signed error
    // landing at p=1 only changes text, never column geometry
    const ERRPAD = `<span class="err"></span>`;
    function tblCell(v, truth, otherErr, p, fv){
      if (v == null) return `<td><b>·</b>${ERRPAD}</td>`;
      if (p <= 0) return `<td class="ph">·${ERRPAD}</td>`;
      if (p < 1) return `<td><b>${fv(v * easeOut(p))}</b>${ERRPAD}</td>`;
      const err = v - truth, aerr = Math.abs(err);
      const cls = aerr <= Math.abs(otherErr) + 1e-9 ? "win" : "lose";
      const sign = err > 0 ? "+" : err < 0 ? "−" : "±";
      return `<td class="${cls}"><b>${fv(v)}</b><span class="err">${sign}${fv(aerr)}</span></td>`;
    }

    function tickTable(){
      if (!ringStats || !tbl.isConnected) return;
      const area = ringStats.mode === "area";
      const fv = v => area ? v.toFixed(1) : "" + Math.round(v);
      const now = performance.now();
      let rows = "", pending = false;
      for (let k = 1; k <= 3; k++){
        const p = Math.max(0, Math.min(1, (now - ringStats.t0 - (k - 1) * RING_STEP) / RING_FADE));
        if (p < 1) pending = true;
        const tr = ringStats.truth[k - 1];
        const hv = ringStats.hex ? ringStats.hex[k - 1] : null;
        const sv = ringStats.sq  ? ringStats.sq[k - 1]  : null;
        const he = hv == null ? Infinity : hv - tr, se = sv == null ? Infinity : sv - tr;
        const trCell = p <= 0 ? `<td class="ph">·</td>`
          : `<td>${p < 1 ? fv(tr * easeOut(p)) : "<b>" + fv(tr) + "</b>"}</td>`;
        rows += `<tr><td>k=${k}</td>` + trCell +
          tblCell(hv, tr, se, p, fv) + tblCell(sv, tr, he, p, fv) + `</tr>`;
      }
      tbl.innerHTML = `<div class="ttl">${area
          ? "AREA WITHIN k RINGS (units of d²)" : "POINTS CAPTURED WITHIN k RINGS"}</div>` +
        `<table><colgroup><col class="c0"><col class="c1"><col class="c2"><col class="c2"></colgroup>` +
        `<tr><th></th><th>true circle</th><th>hex</th><th>square</th></tr>${rows}</table>`;
      tbl.classList.add("shown");     // earned once — persists for the session
      if (pending) requestAnimationFrame(tickTable);
    }

    function clearClick(){
      stHex.S.rings = stSq.S.rings = null;   // table (and its last values) stay put
      capEl.innerHTML = DATA.on ? CAPS.data : CAPS.rest;
      stHex.draw(); stSq.draw();
    }

    function ringsPair(src, cell){
      const dst = src === stHex ? stSq : stHex;
      const m = mirror(cell, src, dst);
      const t0 = performance.now();
      src.S.rings = { c: cell, m: src.ringMap(cell) }; src.S.t0 = t0;
      dst.S.rings = m ? { c: m, m: dst.ringMap(m) } : null; dst.S.t0 = t0;
      if (DATA.on){
        const hexOrigin = src === stHex ? cell : m;
        const sqOrigin  = src === stSq  ? cell : m;
        ringStats = {
          t0, mode: "count",
          truth: truthCounts(cell.cx, cell.cy, src.grid.d),
          hex: hexOrigin ? cumRingCounts(stHex, hexOrigin) : null,
          sq:  sqOrigin  ? cumRingCounts(stSq,  sqOrigin)  : null,
        };
        capEl.innerHTML = "";
      } else {
        ringStats = areaStats(t0);
        capEl.innerHTML = CAPS.rings;
      }
      tickTable();
      stHex.draw(); stSq.draw();
    }

    for (const st of [stHex, stSq]){
      const cv = st.canvas;
      cv.addEventListener("pointermove", e => {
        const r = cv.getBoundingClientRect();
        const c = st.nearest(e.clientX - r.left, e.clientY - r.top);
        if (c && c !== st.S.hover) hoverPair(st, c);
      });
      cv.addEventListener("pointerleave", () => hoverPair(st, st.centerCell));
      cv.addEventListener("pointerdown", e => {
        const r = cv.getBoundingClientRect();
        const c = st.nearest(e.clientX - r.left, e.clientY - r.top);
        if (!c) return;
        if (st.S.rings && st.S.rings.c === c) clearClick();   // click the origin again -> clear
        else ringsPair(st, c);                                // one origin at a time (both modes)
      });
    }

    /* ---- "add data" toggle (bar button): same raw points under both grids ---- */
    function toggleData(){
      DATA.on = !DATA.on;
      $("#dataBtn").classList.toggle("on", DATA.on);
      $("#dataBtn").textContent = DATA.on ? "● data on" : "● add data";
      if (DATA.on && !DATA.pts){
        DATA.pts = genPoints(stHex.W, stHex.H);
        binStage(stHex); binStage(stSq);
      }
      const active = stHex.S.rings || stSq.S.rings;
      if (active){
        // origin stays put — rings persist, table content swaps in place (no staging)
        const t0 = performance.now() - 3 * RING_STEP;
        stHex.S.t0 = stSq.S.t0 = t0;
        if (DATA.on){
          const oc = active.c;
          ringStats = {
            t0, mode: "count",
            truth: truthCounts(oc.cx, oc.cy, stHex.grid.d),
            hex: stHex.S.rings ? cumRingCounts(stHex, stHex.S.rings.c) : null,
            sq:  stSq.S.rings  ? cumRingCounts(stSq,  stSq.S.rings.c)  : null,
          };
          capEl.innerHTML = "";
        } else {
          ringStats = areaStats(t0);
          capEl.innerHTML = CAPS.rings;
        }
        tickTable();
        stHex.draw(); stSq.draw();
      } else {
        capEl.innerHTML = DATA.on ? CAPS.data : CAPS.rest;
        stHex.draw(); stSq.draw();
      }
      hoverPair(stHex, stHex.S.hover || stHex.centerCell);
    }

    hoverPair(stHex, stHex.centerCell);
    capEl.innerHTML = CAPS.rest;
    return { toggleData };
  }
  return { mount, unmount };
})();

/* ================================================================ scene 3: hierarchy
   The parent/children prototype (basics/hierarchy.html) as ONE stage with a
   "✏ draw" toggle: hierarchy mode shows parent + 7 children; draw mode fades
   them out, brings the basemap up, and hexagonifies a freehand shape live.
   The drawing (ring + res) persists across res changes and mode toggles.
   A token invalidates every rAF loop / pending timer on unmount. */
const HI = (() => {
  let token = 0, curObs = null;
  const hierPyCache = new Map();
  function runPy(params){
    if (!HAS_FUSED) return Promise.reject(new Error("no local Python (open via the fused-render app)"));
    const key = JSON.stringify(params);
    if (!hierPyCache.has(key)){
      // literal script path below the page — the deploy exporter needs the
      // string. key:null opts out of the hosted shim's same-path supersession
      // channel (concurrent different-params calls would hang otherwise).
      const p = fused.runPython("basics/hierarchy_h3.py", params, { key: null })
        .then(r => { if (r && r.error) throw new Error(r.error); return r; });
      hierPyCache.set(key, p.catch(e => { hierPyCache.delete(key); throw e; }));
    }
    return hierPyCache.get(key);
  }

  const easeIO = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const INK = "#28231a", ORANGE = "#d9642c", GREEN = "#33875a";
  const km2 = m2 => m2 >= 1e5 ? (m2/1e6).toFixed(3) + " km²" : fmt(Math.round(m2)) + " m²";

  function makeStage(host, obsList){
    const cv = document.createElement("canvas");
    host.appendChild(cv);
    const st = { cv, ctx: cv.getContext("2d"), W: 0, H: 0 };
    const fit = () => {
      const r = host.getBoundingClientRect();
      st.W = r.width; st.H = r.height;
      cv.width = Math.round(r.width * DPR); cv.height = Math.round(r.height * DPR);
      cv.style.width = r.width + "px"; cv.style.height = r.height + "px";
      st.onresize && st.onresize();
    };
    const ro = new ResizeObserver(fit);
    ro.observe(host);
    obsList.push(ro);
    fit();
    return st;
  }
  /* local equirectangular meters around (lng0, lat0), y up */
  function makeProj(lng0, lat0){
    const kx = 111320 * Math.cos(lat0 * Math.PI/180), ky = 110574;
    return { m: ll => [(ll[0]-lng0)*kx, (ll[1]-lat0)*ky],
             ll: xy => [xy[0]/kx + lng0, xy[1]/ky + lat0] };
  }
  function ringBBox(pts){ // meter pts
    let x0=1e12,y0=1e12,x1=-1e12,y1=-1e12;
    for (const [x,y] of pts){ x0=Math.min(x0,x); y0=Math.min(y0,y); x1=Math.max(x1,x); y1=Math.max(y1,y); }
    return [x0,y0,x1,y1];
  }
  function pointInRing(x, y, pts){
    let inside = false;
    for (let i=0, j=pts.length-1; i<pts.length; j=i++){
      const [xi,yi]=pts[i],[xj,yj]=pts[j];
      if ((yi>y)!==(yj>y) && x < (xj-xi)*(y-yi)/(yj-yi)+xi) inside = !inside;
    }
    return inside;
  }

  // step controls (intro-row slot) + stage — same ids as before, new home
  const CONTROLS =
    `<span class="selwrap"><span class="pin">📍</span><select id="place1"></select><span class="chev">▾</span></span>` +
    `<span class="hi-drawgrp">` +
      `<span class="lbl">hex res</span>` +
      `<span class="resgrp" id="hresgrp">` +
        `<button class="sw" data-r="8">8</button><button class="sw" data-r="9">9</button><button ` +
          `class="sw on" data-r="10">10</button><button class="sw" data-r="11">11</button>` +
      `</span>` +
      `<button class="sw" id="clear2">✕ clear</button>` +
      `<span class="lbl" id="mode2"></span>` +
    `</span>` +
    `<button class="sw" id="drawtoggle" title="draw a shape · it becomes cells">✏ draw</button>` +
    `<button class="sw" id="replay1" title="replay">↻</button>`;
  const TEMPLATE =
    `<div class="stagewrap">` +
      `<div class="hi-stage" id="stage1"></div>` +
      `<div class="crumbs hi-crumbs" id="crumbs"></div>` +
      `<div class="hi-meter" id="meter1"></div>` +
      `<div class="loclabel" id="loclabel"></div>` +
      `<div class="hi-fabhint hide" id="hint1"></div>` +
    `</div>` +
    `<div class="cap" id="cap1">loading…</div>`;

  /* ------------------------ PART 1 · the zoomable hierarchy ------------------------ */
  async function part1(my, obs){
    const st = makeStage($("#stage1"), obs);
    const cap = $("#cap1"), meter = $("#meter1"), crumbsEl = $("#crumbs"), hint1 = $("#hint1");
    const MAXRES = 13, ROOTRES = 9;
    let PL;
    try { PL = await loadData("basics/data/places.json"); }
    catch(e){ if (my === token) cap.innerHTML = '<span class="err">could not load baked data · ' + e.message + "</span>"; return; }
    if (my !== token) return;

    /* azimuthal equidistant meters around (lat0,lng0) · the frame live nodes use */
    function aeqdJS(lat0, lng0){
      const R = 6371007.18, RAD = Math.PI/180;
      const la0 = lat0*RAD, lo0 = lng0*RAD, s0 = Math.sin(la0), c0 = Math.cos(la0);
      return (lat, lng) => {
        const la = lat*RAD, d = lng*RAD - lo0;
        const c = Math.acos(Math.max(-1, Math.min(1, s0*Math.sin(la) + c0*Math.cos(la)*Math.cos(d))));
        if (c < 1e-12) return [0, 0];
        const az = Math.atan2(Math.sin(d)*Math.cos(la), c0*Math.sin(la) - s0*Math.cos(la)*Math.cos(d));
        return [R*c*Math.sin(az), R*c*Math.cos(az)];
      };
    }
    /* the inverse · meters in the root-centered aeqd frame back to [lng, lat] */
    function aeqdInv(lat0, lng0){
      const R = 6371007.18, RAD = Math.PI/180;
      const la0 = lat0*RAD, lo0 = lng0*RAD, s0 = Math.sin(la0), c0 = Math.cos(la0);
      return xy => {
        const [x, y] = xy, rho = Math.hypot(x, y);
        if (rho < 1e-9) return [lng0, lat0];
        const c = rho/R, sc = Math.sin(c), cc = Math.cos(c);
        const lat = Math.asin(Math.max(-1, Math.min(1, cc*s0 + y*sc*c0/rho)));
        const lng = lo0 + Math.atan2(x*sc, rho*c0*cc - y*s0*sc);
        return [lng/RAD, lat/RAD];
      };
    }

    const centroid = pts => {
      let x = 0, y = 0;
      for (const p of pts){ x += p[0]; y += p[1]; }
      return [x/pts.length, y/pts.length];
    };
    function orientDeg(pts){                       // circular-mean vertex azimuth mod 60
      const [cx, cy] = centroid(pts);
      let s = 0, c = 0;
      for (const [x, y] of pts){ const a = Math.atan2(y-cy, x-cx)*6; s += Math.sin(a); c += Math.cos(a); }
      return Math.atan2(s, c)/6*180/Math.PI;       // (-30, 30], from east, CCW
    }
    const wrap30 = d => { d = ((d % 60) + 90) % 60 - 30; return d === -30 ? 30 : d; };

    /* ---------- node store (rebuilt per place) + batched prefetch ---------- */
    let gen = 0, proj = null;                      // proj set from the root cell center
    let NODES = new Map();                         // id -> {id,res,pent,b,cx,cy,rad,orient,kids|null}
    let pendingFor = new Map(), fetching = 0;      // child id -> in-flight tree promise
    function mkNode(id, res, pent, boundaryLL){
      const b = boundaryLL.map(p => proj(p[1], p[0]));
      const [cx, cy] = centroid(b);
      let rad = 0;
      for (const [x, y] of b) rad = Math.max(rad, Math.hypot(x-cx, y-cy));
      return { id, res, pent, b, cx, cy, rad, bb: ringBBox(b),
               orient: b.length === 6 ? orientDeg(b) : 0, kids: null };
    }
    function ingestFull(nj){                       // a tree node: cell + its children
      let n = NODES.get(nj.id);
      if (!n){ n = mkNode(nj.id, nj.res, nj.pentagon, nj.boundary); NODES.set(nj.id, n); }
      if (!n.kids){
        n.kids = nj.children.map(c => c.id);
        for (const c of nj.children)
          if (!NODES.has(c.id)) NODES.set(c.id, mkNode(c.id, nj.res+1, c.pentagon, c.boundary));
      }
      return n;
    }
    function fetchCells(ids){
      const g = gen;
      fetching++;
      const pr = runPy({ action: "tree", cells: ids })
        .then(r => { if (g === gen && my === token) r.nodes.forEach(ingestFull); })
        .finally(() => { if (g === gen && my === token){ fetching--; ids.forEach(i => pendingFor.delete(i)); kick(); } });
      ids.forEach(i => pendingFor.set(i, pr));
      return pr;
    }
    function prefetchKids(parentId){               // one batched call per level, ahead of clicks
      const p = NODES.get(parentId);
      if (!p || !p.kids || p.res >= MAXRES) return Promise.resolve();
      const need = p.kids.filter(k => { const n = NODES.get(k); return n && !n.kids && !pendingFor.has(k); });
      return need.length ? fetchCells(need) : Promise.resolve();
    }
    const ensureKids = id => {
      const n = NODES.get(id);
      if (n && n.kids) return Promise.resolve();
      return pendingFor.get(id) || fetchCells([id]);
    };

    /* state */
    let LOC = { name: "", kind: null, sub: "" };
    let path = [], cursor = 0;                 // explored descent + viewed level
    let view = null, viewA = null;             // {cx,cy,s} camera + tween
    let hoverKid = null, hintStep = 0;
    let busyRoot = false, rootFitS = 1;
    let raf = 0;

    /* draw-yourself mode (toggled on the same stage) */
    const DRAW_HINT = "&#9998; press and drag to draw a shape on the map";
    let drawMode = false, modeMix = 0, modeA = null;   // 0 = hierarchy, 1 = draw
    let dRes = 10, drawPts = [], dPoly = null, dHexes = null, dOld = null;
    let dPopT0 = 0, dOldT0 = 0, dDrawing = false, dBusy = false, dReq = 0, lastStats = null;

    const nodeOf = id => NODES.get(id);
    const tip = () => nodeOf(path[cursor]);
    const fitFor = n => {
      const [x0, y0, x1, y1] = n.bb;
      return { cx:(x0+x1)/2, cy:(y0+y1)/2, s: Math.min(st.W/(x1-x0), st.H/(y1-y0)) * 0.62 };
    };
    function tweenTo(t, dur){
      viewA = { a: { ...view }, b: t, t0: performance.now(), dur: dur || 700 };
      kick();
    }
    const toPx = (x,y) => [ st.W/2 + (x-view.cx)*view.s, st.H/2 - (y-view.cy)*view.s ];
    const toM = (px,py) => [ (px - st.W/2)/view.s + view.cx, view.cy + (st.H/2 - py)/view.s ];

    /* like tracePath but optionally left open (in-progress freehand stroke) */
    function traceD(ctx, pts, close, sc, ox, oy){
      ctx.beginPath();
      pts.forEach((p,i) => {
        let x = p[0], y = p[1];
        if (sc !== undefined && sc !== 1){ x = ox + (x-ox)*sc; y = oy + (y-oy)*sc; }
        const q = toPx(x, y);
        i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]);
      });
      if (close) ctx.closePath();
    }

    function tracePath(ctx, pts, sc, ox, oy){
      ctx.beginPath();
      pts.forEach((p,i) => {
        let x = p[0], y = p[1];
        if (sc !== 1){ x = ox + (x-ox)*sc; y = oy + (y-oy)*sc; }
        const q = toPx(x,y);
        i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]);
      });
      ctx.closePath();
    }

    /* ---------- the descent ---------- */
    function descend(childId){
      const j = cursor + 1;
      if (path[j] !== childId) path = path.slice(0, j).concat(childId);
      cursor = j;
      hoverKid = null;
      const n = nodeOf(childId);
      tweenTo(fitFor(n));
      if (n.res < MAXRES)
        ensureKids(childId).then(() => { if (path[cursor] === childId) prefetchKids(childId); })
          .catch(() => {});
      if (hintStep === 0){ hintStep = 1; showHint("click outside the small hexes (or the trail above) to back out"); }
      updateChrome();
    }
    function jump(i){                              // breadcrumb / zoom-out; path is preserved
      if (i === cursor || !path[i]) return;
      if (i < cursor && hintStep === 1){ hintStep = 2; hideHint(); }
      cursor = i;
      hoverKid = null;
      tweenTo(fitFor(tip()));
      updateChrome();
    }
    function kidAt(mx, my2){
      const P = tip();
      if (!P || !P.kids || P.res >= MAXRES) return null;
      for (const k of P.kids){ const K = nodeOf(k); if (K && pointInRing(mx, my2, K.b)) return k; }
      // children cover ~92.9% — a click in a leak notch still counts if inside the parent
      if (pointInRing(mx, my2, P.b)){
        let best = null, bd = 1e18;
        for (const k of P.kids){ const K = nodeOf(k), d = (K.cx-mx)**2 + (K.cy-my2)**2; if (d < bd){ bd = d; best = k; } }
        return best;
      }
      return null;
    }
    function onScreen(n, pad){
      const [x0, y0] = toPx(n.bb[0], n.bb[3]), [x1, y1] = toPx(n.bb[2], n.bb[1]);
      return x1 > -pad && x0 < st.W + pad && y1 > -pad && y0 < st.H + pad;
    }

    function draw(now){
      if (my !== token) return;                          // unmounted: stop cold
      const ctx = st.ctx;
      ctx.setTransform(DPR,0,0,DPR,0,0);
      ctx.clearRect(0,0,st.W,st.H);
      if (modeA){                                        // hierarchy <-> draw crossfade
        const t = clamp((now - modeA.t0)/380, 0, 1);
        modeMix = modeA.from + (modeA.to - modeA.from)*easeIO(t);
        if (t >= 1) modeA = null;
      }
      const mix = modeMix, hv = 1 - mix;                 // draw / hierarchy visibility
      if (viewA){
        const t = clamp((now - viewA.t0)/viewA.dur, 0, 1), e = easeIO(t);
        view = { cx: viewA.a.cx + (viewA.b.cx-viewA.a.cx)*e,
                 cy: viewA.a.cy + (viewA.b.cy-viewA.a.cy)*e,
                 s: Math.exp(Math.log(viewA.a.s) + (Math.log(viewA.b.s)-Math.log(viewA.a.s))*e) };
        if (t >= 1) viewA = null;
      }
      if (!view){ raf = 0; return; }
      let popActive = false, loading = false;

      /* the place under the grid · comes up to full prominence in draw mode */
      if (LOC.kind === "ocean" || LOC.kind === "coast"){
        ctx.fillStyle = "rgba(103,125,136,.09)";           // water wash
        ctx.fillRect(0,0,st.W,st.H);
      }
      if (LOC.kind === "coast" && LOC.rings){
        ctx.fillStyle = "rgba(255,253,248,.92)";           // land = paper again
        for (const r of LOC.rings){ tracePath(ctx,r,1); ctx.fill(); }
        ctx.strokeStyle = `rgba(40,35,26,${(0.25 + 0.15*mix).toFixed(3)})`; ctx.lineWidth = 1;
        for (const r of LOC.rings){ tracePath(ctx,r,1); ctx.stroke(); }
      }
      let bldFading = false;
      if (LOC.kind === "ams" && LOC.bldPath){              // building footprints
        if (LOC.bldT0 === undefined) LOC.bldT0 = now;      // fade in on arrival
        const bf = easeOut(clamp((now - LOC.bldT0)/900, 0, 1));
        if (bf < 1) bldFading = true;
        ctx.setTransform(DPR*view.s, 0, 0, -DPR*view.s,
                         DPR*(st.W/2 - view.cx*view.s), DPR*(st.H/2 + view.cy*view.s));
        ctx.fillStyle = `rgba(40,35,26,${((0.10 + 0.05*mix)*bf).toFixed(3)})`;
        ctx.fill(LOC.bldPath);
        ctx.setTransform(DPR,0,0,DPR,0,0);
      }

      const Pt = tip();
      if (hv > .01 && Pt){
        /* ancestor ghosts: every explored level above stays visible around the view */
        for (let i = 0; i < cursor; i++){
          const A = nodeOf(path[i]);
          if (!A || !A.kids) continue;
          for (const k of A.kids){
            const K = nodeOf(k);
            if (!K || !onScreen(K, 40)) continue;
            tracePath(ctx, K.b, 1);
            ctx.strokeStyle = "#d6cdb8"; ctx.globalAlpha = 0.75*hv; ctx.lineWidth = 1;
            ctx.stroke();
          }
          tracePath(ctx, A.b, 1);
          ctx.strokeStyle = INK; ctx.globalAlpha = 0.28*hv; ctx.lineWidth = 1.2;
          ctx.stroke();
        }
        ctx.globalAlpha = 1;

        /* the viewed cell's children · the clickable layer */
        if (Pt.kids){
          if (Pt._popT === undefined) Pt._popT = now;
          const pop = easeOut(Math.min(1, (now - Pt._popT)/280));
          if (pop < 1) popActive = true;
          for (const k of Pt.kids){
            const K = nodeOf(k);
            const onPath = path[cursor+1] === k;
            tracePath(ctx, K.b, 1);
            ctx.globalAlpha = pop*hv;
            // translucent so the footprints stay visible under the children
            ctx.fillStyle = k === hoverKid ? "rgba(249,227,211,.55)" : "rgba(253,248,238,.28)";
            ctx.fill();
            ctx.strokeStyle = k === hoverKid ? ORANGE : INK;
            ctx.globalAlpha = pop*hv*(k === hoverKid ? 1 : 0.65);
            ctx.lineWidth = k === hoverKid ? 1.8 : 1.1;
            ctx.stroke();
            if (onPath){                             // the branch you explored: re-clickable
              tracePath(ctx, K.b, 1);
              ctx.strokeStyle = ORANGE; ctx.globalAlpha = pop*hv; ctx.lineWidth = 1.6;
              ctx.setLineDash([5,4]); ctx.stroke(); ctx.setLineDash([]);
            }
            ctx.globalAlpha = 1;
          }
        } else if (Pt.res < MAXRES){                 // the user outran the prefetch: pulsing dots
          loading = true;
          const q = toPx(Pt.cx, Pt.cy);
          ctx.fillStyle = "#a89e8a";
          for (let d = 0; d < 3; d++){
            const ph = (now/300 + d*0.33) % 1;
            ctx.globalAlpha = (0.25 + 0.6*Math.sin(ph*Math.PI))*hv;
            ctx.beginPath(); ctx.arc(q[0] + (d-1)*14, q[1], 3.4, 0, 7); ctx.fill();
          }
          ctx.globalAlpha = 1;
        }

        /* explored levels BELOW the view: ghost outlines inside the dashed branch */
        for (let i = cursor + 1; i < path.length; i++){
          const D = nodeOf(path[i]);
          if (!D || !D.kids) continue;
          for (const k of D.kids){
            const K = nodeOf(k);
            if (!K || !onScreen(K, 40)) continue;
            tracePath(ctx, K.b, 1);
            ctx.strokeStyle = ORANGE; ctx.globalAlpha = 0.3*hv; ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
        ctx.globalAlpha = 1;

        /* viewed cell outline on top */
        tracePath(ctx, Pt.b, 1);
        ctx.strokeStyle = INK; ctx.globalAlpha = hv; ctx.lineWidth = 1.8; ctx.stroke();
        ctx.globalAlpha = 1;
      }

      /* draw-mode layer: outgoing cells, incoming cells, the drawn shape */
      let dAnim = false;
      if (mix > .01){
        if (dOld){                                       // old res's cells swap out
          const t = now - dOldT0;
          let live = false;
          dOld.cells.forEach((c,i) => {
            const tt = clamp((t - i*6)/240, 0, 1);
            if (tt < 1) live = true; else return;
            const e = 1 - easeOut(tt), sc = 1 - .35*(1-e);
            ctx.globalAlpha = e * mix * .9;
            traceD(ctx, c.b, true, sc, c.cx, c.cy);
            ctx.fillStyle = "rgba(217,100,44,.22)"; ctx.fill();
            ctx.strokeStyle = "rgba(217,100,44,.8)"; ctx.lineWidth = 1; ctx.stroke();
            ctx.globalAlpha = 1;
          });
          if (!live) dOld = null; else dAnim = true;
        }
        if (dHexes){                                     // new cells pop in, center-out
          const t = now - dPopT0;
          dHexes.cells.forEach((c,i) => {
            const tt = clamp((t - i*14)/300, 0, 1);
            if (tt <= 0){ dAnim = true; return; }
            if (tt < 1) dAnim = true;
            const e = easeOut(tt), sc = 0.5 + 0.5*e;
            ctx.globalAlpha = e * mix;
            traceD(ctx, c.b, true, sc, c.cx, c.cy);
            ctx.fillStyle = "rgba(217,100,44,.26)"; ctx.fill();
            ctx.strokeStyle = "rgba(217,100,44,.95)"; ctx.lineWidth = 1.2; ctx.stroke();
            ctx.globalAlpha = 1;
          });
        }
        const shape = dDrawing ? drawPts : dPoly;        // the drawn outline persists
        if (shape && shape.length > 1){
          ctx.globalAlpha = mix;
          traceD(ctx, shape, !dDrawing);
          if (dDrawing){ ctx.strokeStyle = ORANGE; ctx.lineWidth = 2.2; }
          else {
            ctx.fillStyle = "rgba(40,35,26,.05)"; ctx.fill();
            ctx.setLineDash(dBusy ? [6,5] : []);
            ctx.strokeStyle = INK; ctx.lineWidth = 2.2;
          }
          ctx.lineJoin = ctx.lineCap = "round";
          ctx.stroke(); ctx.setLineDash([]);
          ctx.globalAlpha = 1;
        }
      }

      if (viewA || modeA || dAnim || dBusy || bldFading || (hv > .01 && (popActive || loading)))
        raf = requestAnimationFrame(draw);
      else raf = 0;
    }
    const kick = () => { if (!raf && my === token) raf = requestAnimationFrame(draw); };

    /* ---------- chrome: breadcrumb trail, meter, caption ---------- */
    function dial(n, active){                      // tiny hexagon at the cell's true orientation
      const c = document.createElement("canvas");
      const S = 18;
      c.width = S*DPR; c.height = S*DPR; c.style.width = S+"px"; c.style.height = S+"px";
      const g = c.getContext("2d"); g.scale(DPR, DPR);
      const ccx = S/2, ccy = S/2, r = S/2 - 2.5, o = n.orient*Math.PI/180;
      g.beginPath();
      for (let k = 0; k < 6; k++){
        const a = o + k*Math.PI/3;
        const x = ccx + r*Math.cos(a), y = ccy - r*Math.sin(a);
        k ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.closePath();
      g.strokeStyle = active ? "#fffdf8" : (n.res % 2 ? ORANGE : INK);
      g.lineWidth = 1.4; g.stroke();
      g.fillStyle = active ? "#fffdf8" : g.strokeStyle;
      g.beginPath(); g.arc(ccx + r*Math.cos(o), ccy - r*Math.sin(o), 2, 0, 7); g.fill();
      return c;
    }
    function updateChrome(){
      crumbsEl.textContent = "";
      path.forEach((id, i) => {
        const n = nodeOf(id);
        if (!n) return;
        if (i){ const s = document.createElement("span"); s.className = "sep"; s.textContent = "›"; crumbsEl.appendChild(s); }
        const b = document.createElement("button");
        b.className = "cr" + (i === cursor ? " on" : "");
        b.title = (i === cursor ? "you are here · " : "jump to ") + "res " + n.res;
        b.appendChild(dial(n, i === cursor));
        b.appendChild(document.createTextNode((i ? "" : "res ") + n.res));
        b.addEventListener("click", () => jump(i));
        crumbsEl.appendChild(b);
      });

      const Pn = tip(), rows = [];
      if (Pn){
        rows.push(`<div class="mr"><span>res</span><b>${Pn.res}</b></div>`);
        rows.push(`<div class="mr"><span>cell</span><b>${Pn.id}</b></div>`);
        if (cursor > 0){
          const par = nodeOf(path[cursor-1]);
          const tw = wrap30(Pn.orient - par.orient);
          rows.push(`<div class="hr"></div>`);
          rows.push(`<div class="mr"><span>twist vs res ${par.res}</span><span class="mx or">${tw > 0 ? "+" : ""}${tw.toFixed(1)}&deg;</span></div>`);
          const root = nodeOf(path[0]);
          const tr = wrap30(Pn.orient - root.orient);
          rows.push(`<div class="mr"><span>tilt vs res ${root.res}</span><b>${tr > 0 ? "+" : ""}${tr.toFixed(1)}&deg;</b></div>`);
        }
      }
      meter.innerHTML = rows.join("");

      if (drawMode || !Pn) return;                 // draw mode owns the caption
      if (cursor === 0)
        cap.innerHTML = Pn.pent
          ? `this cell is one of Earth's <b>12 pentagons</b> · it splits into <b>6</b> children`
          : `every hexagon splits into <b>7</b> children, twisted <i>&plusmn;19&deg;</i> &middot; click one to dive in`;
      else {
        const par = nodeOf(path[cursor-1]);
        const tw = wrap30(Pn.orient - par.orient);
        let line = `res <b>${Pn.res}</b> sits <i>${tw > 0 ? "+" : ""}${tw.toFixed(0)}&deg;</i> twisted inside res ${par.res}`;
        if (cursor >= 2){
          const gp = nodeOf(path[cursor-2]);
          line += ` &middot; lines up with res ${gp.res} (${Math.abs(wrap30(Pn.orient - gp.orient)).toFixed(1)}&deg; apart)`;
        }
        cap.innerHTML = line;
      }
    }

    /* one-time affordance hints */
    let hintTimer = 0;
    function showHint(html, ms){
      if (drawMode) return;                              // draw mode owns the hint
      hint1.innerHTML = html; hint1.classList.remove("hide");
      clearTimeout(hintTimer);
      if (ms) hintTimer = setTimeout(() => hint1.classList.add("hide"), ms);
    }
    const hideHint = () => { clearTimeout(hintTimer); hint1.classList.add("hide"); };

    st.onresize = () => { if (view && !drawMode && tip()){ viewA = null; view = fitFor(tip()); kick(); } };

    /* pointer input: freehand drawing (draw mode) / pan + click-to-descend (descend mode) */
    let pan = null;                                // manual drag-to-pan
    st.cv.addEventListener("pointerdown", ev => {
      if (!view) return;
      if (drawMode){
        if (!HAS_FUSED) return;
        st.cv.setPointerCapture(ev.pointerId);
        dDrawing = true; dPoly = null; dHexes = null; dOld = null; lastStats = null; dReq++;
        dBusy = false; meter.style.display = "none";
        const r = st.cv.getBoundingClientRect();
        drawPts = [toM(ev.clientX - r.left, ev.clientY - r.top)];
        hint1.classList.add("hide");
        kick();
        return;
      }
      if (busyRoot) return;
      st.cv.setPointerCapture(ev.pointerId);
      pan = { x0: ev.clientX, y0: ev.clientY, v0: null, moved: false };
    });
    st.cv.addEventListener("pointerup", ev => {
      if (drawMode){
        if (!dDrawing) return;
        dDrawing = false;
        if (drawPts.length >= 8){
          // light simplification: every other point past 80 vertices
          dPoly = drawPts.length > 80 ? drawPts.filter((_,i) => i % 2 === 0) : drawPts.slice();
          hexify();
        } else {
          drawPts = [];
          hint1.innerHTML = DRAW_HINT; hint1.classList.remove("hide");
          cap.innerHTML = "draw a bigger shape · press and drag";
        }
        kick();
        return;
      }
      const wasPan = pan; pan = null;
      if (!view || busyRoot || (wasPan && wasPan.moved)) return;  // a drag pans — it is not a click
      const r = st.cv.getBoundingClientRect();
      const [mx, my2] = toM(ev.clientX - r.left, ev.clientY - r.top);
      const P = tip();
      // children still in flight: swallow clicks inside the cell instead of zooming out
      if (P && !P.kids && P.res < MAXRES && pointInRing(mx, my2, P.b)) return;
      const k = kidAt(mx, my2);
      if (k){ descend(k); return; }
      if (viewA) return;                           // camera mid-flight: never a stray "back out"
      for (let i = cursor-1; i >= 0; i--){
        const A = nodeOf(path[i]);
        if (A && pointInRing(mx, my2, A.b)){ jump(i); return; }
      }
      if (cursor > 0) jump(cursor - 1);
    });
    st.cv.addEventListener("pointercancel", () => { pan = null; });

    /* hover (children lift) + drag-to-pan; freehand path while drawing */
    st.cv.addEventListener("pointermove", ev => {
      if (drawMode){
        if (!dDrawing) return;
        const r = st.cv.getBoundingClientRect();
        const p = toM(ev.clientX - r.left, ev.clientY - r.top);
        const last = drawPts[drawPts.length-1];
        if ((p[0]-last[0])**2 + (p[1]-last[1])**2 > (3/view.s)**2){ drawPts.push(p); kick(); }
        return;
      }
      if (!view) return;
      if (pan){
        if (!pan.moved){
          if (Math.abs(ev.clientX-pan.x0) + Math.abs(ev.clientY-pan.y0) <= 4) return;
          pan.moved = true; pan.v0 = { ...view }; pan.x0 = ev.clientX; pan.y0 = ev.clientY;
          viewA = null;                            // a drag takes the camera over
        }
        view = { cx: pan.v0.cx - (ev.clientX-pan.x0)/pan.v0.s,
                 cy: pan.v0.cy + (ev.clientY-pan.y0)/pan.v0.s, s: pan.v0.s };
        kick();
        return;
      }
      const r = st.cv.getBoundingClientRect();
      const [mx, my2] = toM(ev.clientX - r.left, ev.clientY - r.top);
      const k = kidAt(mx, my2);
      if (k !== hoverKid){ hoverKid = k; kick(); }
      st.cv.style.cursor = k ? "pointer" : (cursor > 0 ? "zoom-out" : "default");

    st.cv.addEventListener("pointerleave", () => { if (hoverKid){ hoverKid = null; kick(); } });
    st.cv.addEventListener("wheel", ev => {        // manual zoom, centered on the cursor

      ev.preventDefault();
      const r = st.cv.getBoundingClientRect();
      const [mx, my2] = toM(ev.clientX - r.left, ev.clientY - r.top);
      viewA = null;                                // the wheel takes the camera over
      const s = clamp(view.s * Math.exp(-ev.deltaY * 0.0016), rootFitS * 0.25, 200);

      view = { cx: mx - (mx - view.cx)/f, cy: my2 - (my2 - view.cy)/f, s };

    $("#replay1").onclick = () => {                // restart the descent from the root

      if (drawMode || !root) return;

      const fit = fitFor(root);
      view = { cx: fit.cx, cy: fit.cy, s: fit.s*0.55 };

    /* ---------- the place dropdown: re-root the descent ---------- */
    let locSeq = 0;
    async function setLocation(p){

      crumbsEl.textContent = ""; meter.innerHTML = "";
      kick();
      try {
        // bootstrap: one tree call at the root cell (ROOTRES, or the place's own cell)
        const r = await runPy(p.cell ? { action: "tree", cells: [p.cell] }
                                     : { action: "tree", lat: p.lat ?? 52.3673, lng: p.lng ?? 4.89, res: ROOTRES });
        if (myLoc !== locSeq || my !== token) return;
        const rj = r.nodes[0];
        proj = aeqdJS(rj.lat, rj.lng);             // fixed world frame around the root
        LOC = { name: p.label, sub: p.sub,
                kind: p.ocean ? "ocean" : p.rings ? "coast" : (p.baked ? "ams" : null),

    /* ---------- draw-yourself mode: same stage, toggled ---------- */
    function clearDrawing(){

    function drawCapIdle(){

        `<div class="mr"><span>coverage error</span><span class="mx${over>=0?" or":" neg"}">${sign}${Math.abs(over).toFixed(1)} %</span></div>` +

    function hexify(){
      if (!dPoly || !HAS_FUSED) return;
      const myReq = ++dReq;
      const ring = dPoly.map(p => LOC.ll(p).map(v => +v.toFixed(6)));
      dBusy = true; kick();

            const b = c.boundary.map(LOC.m);

    function drawFit(){                              // a sane drawing scale (~the root's window)

        hint1.classList.add("hide");

    }
    if (!HAS_FUSED){ dtBtn.disabled = true; dtBtn.title = "drawing needs the local fused runtime"; }
    else dtBtn.onclick = () => setDrawMode(!drawMode);

    const sel = $("#place1");
    PL.places.forEach((p, i) => {

    });

  }

  function mount(host){

/* ================================================================ driver */
let styleToken = 0, api = null, tab = "";
let queued = 0, capCell = -1;      // capCell: latest user-poked cell owns the caption
const cap = $("#cap");
const hitCtx = document.createElement("canvas").getContext("2d");
let place = "ams", res = 10, resRas = 9, resCmp = 10, cmpPlace = "japan";
let meterEl = null, fabEl = null, hintEl = null;

function mountMeter(stage){
  meterEl = el("div","meter",
    `<div class="mr lg" id="lg-b"><span>🏠 buildings</span><b id="m1">0 B</b></div>` +
    `<div class="mr lg" id="lg-h"><span>⬡ hex rows</span><b id="m2">0 B</b></div>` +
    `<div class="mx" id="m3">count a cell to compare</div>`);
  stage.appendChild(meterEl);
  meterEl.querySelector("#lg-b").addEventListener("click", toggleBuildings);
  meterEl.querySelector("#lg-h").addEventListener("click", toggleHex);
  syncLegend();
  updateMeter();
}
function syncLegend(){
  if (!meterEl || tab !== "bld") return;
  meterEl.querySelector("#lg-b").classList.toggle("off", !S.showBuildings);
  meterEl.querySelector("#lg-h").classList.toggle("off", !S.showHex);
}
function updateMeter(){
  if (!meterEl || tab !== "bld") return;
  let geo = 0, hex = 0, cells = 0, blds = 0;
  for (const c of S.cells){
    if (!c.shown) continue;
    geo += c.bprefix[c.shown]; hex += HEXROW_BYTES; cells++; blds += c.shown;
  }
  meterEl.querySelector("#m1").textContent = kb(geo) + (blds ? ` (${fmt(blds)})` : "");
  meterEl.querySelector("#m2").textContent = kb(hex) + (cells ? ` (${fmt(cells)})` : "");
  meterEl.querySelector("#m3").textContent = geo
    ? `rows are ×${fmt(Math.round(geo / hex))} smaller` : "count a cell to compare";
}

async function countCell(i, my){
  if (styleToken !== my) return;
  const cc = S.cells[i];
  if (cc.done || cc.anim || !cc.members.length){
    if (!--queued) cap.innerHTML = IDLE_CAP;   // re-click on an animating cell: just hand it the caption
    return;
  }
  cc.anim = true; S.anim.add(i);
  const inc = Math.max(1, Math.round(cc.members.length / 22));
  for (let s = 0; ; s = Math.min(s + inc, cc.members.length)){
    if (styleToken !== my) return;
    cc.shown = s;
    api.row(i); updateMeter();
    if (capCell === i)
      cap.innerHTML = `counting <b>${cc.info.id}</b> · ${s} buildings · ${fmt(Math.round(cc.prefix[s]))} m²`;
    if (s === cc.members.length) break;
    await sleep(42);
  }
  cc.anim = false; cc.done = true; S.anim.delete(i);
  if (!--queued) cap.innerHTML = IDLE_CAP;
}
// each cell animates on its own async loop — rapid clicks run concurrently
function enqueue(i){ capCell = i; queued++; countCell(i, styleToken); }
function countInstant(i){
  const cc = S.cells[i];
  if (cc.done || cc.anim || !cc.members.length) return false;
  cc.shown = cc.members.length; cc.done = true;
  api.row(i);
  return true;
}
async function countAll(){
  const my = styleToken;
  const order = S.cells.map((_, i) => i)
    .filter(i => !S.cells[i].done && S.cells[i].members.length)
    .sort((a, b) => S.cells[a].c[0] - S.cells[b].c[0]);   // west -> east wave
  let n = 0;
  for (const i of order){
    if (styleToken !== my) return;
    countInstant(i);
    if (++n % 6 === 0){ updateMeter(); await sleep(16); }
  }
  updateMeter();
  if (fabEl){ fabEl.textContent = "✓ every cell counted"; fabEl.disabled = true; }
  if (!queued)                                        // don't clobber an in-flight manual count
    cap.innerHTML = `every cell counted · <b>${fmt(S.cells.filter(c=>c.done).length)} rows</b>. ` +
      `Hide the buildings layer ↗ for the pure hex view.`;
}

function loop(my){
  if (styleToken !== my || !api) return;
  api.frame();
  if (S.paint && S.mouse){                             // brush ring so ⇧-paint is visible
    const g = api.canvas.getContext("2d");
    const [mx, my2] = S.mouse;
    g.beginPath(); g.arc(mx, my2, 11, 0, 7);
    g.strokeStyle = "rgba(40,35,26,.55)"; g.lineWidth = 4; g.stroke();
    g.beginPath(); g.arc(mx, my2, 11, 0, 7);
    g.strokeStyle = "#fffdf8"; g.lineWidth = 1.8; g.stroke();
  }
  requestAnimationFrame(() => loop(my));
}
function hitTest(mx, my, hint){
  const v = api.v;
  const bx = (mx - v.tx) / v.s, by = (my - v.ty) / v.s;
  const paths = api.hitPaths;
  if (hint >= 0 && paths[hint] && hitCtx.isPointInPath(paths[hint], bx, by))
    return hint;                                     // cells don't overlap — still inside, skip the scan
  for (let i = 0; i < paths.length; i++)
    if (paths[i] && hitCtx.isPointInPath(paths[i], bx, by)) return i;
  return -1;
}

const IDLE_CAP = "click a hexagon to count it · hover a counted one (or its row) to inspect · scroll to zoom";
function mountStyle(opts = {}){
  const my = ++styleToken;
  queued = 0; capCell = -1;
  resetScene();
  const stage = $("#stage");
  stage.innerHTML = "";
  api = mountView(stage);
  mountMeter(stage);
  fabEl = el("button", "sw fab", "⚡ count all hexagons");
  fabEl.addEventListener("click", () => countAll());
  stage.appendChild(fabEl);
  hintEl = el("span", "fabhint", "🖌 or hold ⇧ and sweep to paint");
  stage.appendChild(hintEl);
  if (opts.keepV && api.v){ Object.assign(api.v, opts.keepV); api.v.settle(); }
  const c = api.canvas;
  c.addEventListener("pointermove", e => {
    const r = c.getBoundingClientRect();
    S.mouse = [e.clientX - r.left, e.clientY - r.top];
    const h = hitTest(e.clientX - r.left, e.clientY - r.top, S.hover);
    if (e.shiftKey && h >= 0 && countInstant(h)) updateMeter();   // 🖌 sweep-paint
    if (h !== S.hover){
      S.hover = h;
      api.hi(h >= 0 && S.cells[h].shown ? h : -1);
      if (!queued){
        if (h >= 0 && S.cells[h].shown){
          const cc = S.cells[h];
          cap.innerHTML = `<b>${cc.info.id}</b> · ${cc.shown} buildings · ` +
            `${fmt(Math.round(cc.prefix[cc.shown]))} m² · ${kb(cc.bprefix[cc.shown])} of outlines in, 20 B out`;
        } else cap.innerHTML = IDLE_CAP;
      }
    }
    c.style.cursor = S.paint ? "crosshair"
      : h >= 0 && !S.cells[h].shown && S.cells[h].members.length ? "pointer" : "grab";
  });
  c.addEventListener("pointerleave", () => {
    S.hover = -1; S.mouse = null; api.hi(-1);
    if (!queued) cap.innerHTML = IDLE_CAP;
  });
  c.addEventListener("pointerup", e => {
    if (api.v.wasDrag()) return;
    const r = c.getBoundingClientRect();
    const i = hitTest(e.clientX - r.left, e.clientY - r.top);
    if (i >= 0 && !S.cells[i].done && S.cells[i].members.length) enqueue(i);
  });
  // seamless handoff from the interactive grid preview: same grid, same
  // camera — the buildings (and the table/meter chrome) FADE in on top.
  const pv = preview && preview.place === S.place && preview.res === S.res ? preview : null;
  preview = null;
  if (opts.fadeIn){
    S.bldAlpha = 0;
    const f0 = performance.now();
    (function fade(now){
      if (styleToken !== my) return;
      S.bldAlpha = clamp((now - f0) / 750, 0, 1);
      if (S.bldAlpha < 1) requestAnimationFrame(fade);
    })(f0);
    stage.querySelectorAll(".tbl,.tblwrap,.meter,.fab,.fabhint").forEach(e2 => {
      e2.style.opacity = "0";
      e2.style.transition = "opacity .8s";
      requestAnimationFrame(() => requestAnimationFrame(() => { e2.style.opacity = "1"; }));
    });
  } else S.bldAlpha = 1;
  loop(my);
  if (opts.instantTrio){
    S.trio.forEach(i => countInstant(i));
    updateMeter();
    cap.innerHTML = IDLE_CAP;
  } else if (pv && pv.touched){
    // the user is already exploring the grid — keep their camera, no dive
    Object.assign(api.v, { s: pv.v.s, tx: pv.v.tx, ty: pv.v.ty });
    api.v.settle();
    cap.innerHTML = `the buildings are in · <b>${fmt(S.all.length)}</b> of them`;
    (async () => {
      await sleep(850);                              // let the fade land
      // pours run concurrently now — a small stagger keeps the trio's cascade feel
      if (styleToken === my) S.trio.forEach((i, k) =>
        setTimeout(() => { if (styleToken === my) enqueue(i); }, k * 320));
    })();
  } else {
    // intro: the whole patch freshly hexified, then dive into the trio and
    // start counting — turns load latency into a deliberate reveal.
    const target = { s: api.v.s, tx: api.v.tx, ty: api.v.ty };
    api.v.fit(0, 0, S.pr.W, S.pr.H, 60);
    if (pv){ Object.assign(api.v, { s: pv.v.s, tx: pv.v.tx, ty: pv.v.ty }); api.v.settle(); }
    cap.innerHTML = `<b>${fmt(S.cells.length)} hexagons</b> laid over ${fmt(S.all.length)} buildings · diving in…`;
    (async () => {
      await sleep(pv ? 900 : 650);                   // let the fade land / a beat
      if (styleToken !== my) return;
      await animateView(api.v, target, 1100, api.canvas);
      if (styleToken !== my) return;
      S.trio.forEach((i, k) =>
        setTimeout(() => { if (styleToken === my) enqueue(i); }, k * 320));
    })();
  }
}

let prefetching = null;
function prefetchScenes(pl){
  if (prefetching === pl) return;
  prefetching = pl;
  (async () => {
    for (const r of [10, 9, 11, 8]){
      if (prefetching !== pl || tab !== "bld") return;
      try { await prepare(pl, r); } catch(e){ return; }
      Object.assign(S, sceneCache.get(place + "|" + res));   // restore the live scene
    }
  })();
}
async function switchScene(newPlace, newRes){
  const resOnly = newPlace === place && api && tab === "bld";
  const cached = sceneCache.has(newPlace + "|" + newRes);
  const keepV = resOnly && api && api.v ? { s: api.v.s, tx: api.v.tx, ty: api.v.ty } : null;
  const my = ++styleToken;
  if (!cached && resOnly) cap.textContent = `re-hexifying at res ${newRes}…`;
  else if (!cached) mountGridPreview(newPlace, newRes, my);           // instant real grid
  try {
    await prepare(newPlace, newRes);
    // let the grid reveal finish even if the data beat it — no jump cuts
    const pv0 = preview;
    if (pv0 && pv0.place === newPlace && pv0.res === newRes){
      const wait = pv0.readyAt - performance.now();
      if (wait > 0) await sleep(wait);
    }
    if (styleToken !== my) return;                   // a newer switch won
    place = newPlace; res = newRes;
    P.set && (P.set("place", place), P.set("res", String(res)));
    syncBar();
    mountStyle({ instantTrio: !!resOnly, keepV, fadeIn: !cached && !resOnly });
    prefetchScenes(place);
  } catch(e){
    introToken++;
    cap.textContent = "⚠︎ couldn't load that scene · " + (e.message || e);
  }
}
function toggleBuildings(){

    "outlines gone · the honeycomb (shade = built area) is <b>all the pipeline keeps</b>";
}
function toggleHex(){
  S.showHex = !S.showHex;

  if (!S.showHex) cap.textContent = "hexagons hidden · the raw input the pipeline starts from";
}
function setPaint(on){

document.addEventListener("keydown", e => { if (e.key === "Shift") setPaint(true); });

/* ================================================================ terrain tab
   Same pipeline, different data shape: a real elevation raster (Grand Canyon,
   128x128 pixels from AWS Terrain Tiles) pours PIXELS into hexagons instead
   of buildings. The metric dropdown is the new idea: one cell, several truths. */
const R = { showRaster:true, showHex:true, metric:"avg", hover:-1, active:-1, anim:new Set(), sc:null };
const rasterCache = new Map();
async function prepareRaster(rr){
  if (!rasterCache.has(rr)){
    const [d, hx] = await Promise.all([
      loadData("elev_canyon_terrarium.json"),
      callPy({ action:"raster_hexify", dataset:"canyon", res:String(rr) }),
    ]);
    const pr = projector(d.bbox, 520);
    const img = document.createElement("canvas");
    img.width = d.nx; img.height = d.ny;
    const ig = img.getContext("2d");
    const idd = ig.createImageData(d.nx, d.ny);
    // straight hypsometric tint: colour by elevation only (no shaded relief),
    // low → warm canyon-floor tan, high → pale rim. Keeps it in the paper
    // family; orange counted cells pop as the one "aggregated" colour.
    const span = d.elev_max - d.elev_min;
    const LOW = [150,120,86], MID = [206,186,150], HIGH = [247,244,235];
    for (let i = 0; i < d.elev.length; i++){
      const t = (d.elev[i] - d.elev_min) / span;
      const c = t < 0.5 ? mix(LOW, MID, t*2) : mix(MID, HIGH, (t-0.5)*2);
      idd.data[i*4] = c[0]; idd.data[i*4+1] = c[1]; idd.data[i*4+2] = c[2]; idd.data[i*4+3] = 255;
    }
    ig.putImageData(idd, 0, 0);
    const pw = pr.W / d.nx, ph = pr.H / d.ny;
    const ctr = cell => {
      const b = cell.boundary;
      return [b.reduce((s,p)=>s+pr.x(p[0]),0)/b.length, b.reduce((s,p)=>s+pr.y(p[1]),0)/b.length];
    };
    const cells = hx.cells.map(info => {
      const elevs = info.px.map(i => d.elev[i]);
      const prefix = [0], runMin = [Infinity], runMax = [-Infinity];
      elevs.forEach(e2 => {
        prefix.push(prefix[prefix.length-1] + e2);
        runMin.push(Math.min(runMin[runMin.length-1], e2));
        runMax.push(Math.max(runMax[runMax.length-1], e2));
      });
      return { info, elevs, prefix, runMin, runMax, shown:0, done:false, c: ctr(info) };
    });
    const sortedVals = {
      avg: cells.map(c => c.info.avg).sort((a,b)=>a-b),
      min: cells.map(c => c.info.min).sort((a,b)=>a-b),
      max: cells.map(c => c.info.max).sort((a,b)=>a-b),
    };
    // the trio starts on the steepest INTERIOR cell (biggest min→max spread
    // within one hexagon) so the first pour makes avg-vs-min-vs-max vivid and
    // never clips the raster edge
    const interior = cells.filter(c =>
      c.c[0] > pr.W*0.25 && c.c[0] < pr.W*0.75 && c.c[1] > pr.H*0.25 && c.c[1] < pr.H*0.75);
    const top = (interior.length ? interior : cells).slice()
      .sort((a,b)=>(b.info.max-b.info.min)-(a.info.max-a.info.min))[0];
    const trio = cells.slice().sort((a,b)=>
      ((a.c[0]-top.c[0])**2+(a.c[1]-top.c[1])**2)-((b.c[0]-top.c[0])**2+(b.c[1]-top.c[1])**2)
    ).slice(0,3).map(c => cells.indexOf(c));
    rasterCache.set(rr, { cells, trio, pr, img, d, pw, ph, sortedVals, res: rr,
                          rasterBytes: hx.raster_parquet_bytes, hexBytes: hx.hex_parquet_bytes });
  }
  R.sc = rasterCache.get(rr);
  R.sc.cells.forEach(c => { c.shown = 0; c.done = false; c.anim = false; });
  R.hover = -1; R.active = -1; R.anim = new Set();
}
function rasVal(cc, s){
  if (!s) return 0;
  return R.metric === "avg" ? Math.round(cc.prefix[s] / s)
       : R.metric === "min" ? cc.runMin[s] : cc.runMax[s];
}
const RAS_CAP = "click a hexagon to pour its pixels in · ⛰ Grand Canyon · 128×128 real elevation pixels";
function mountTerrain(opts = {}){
  const my = ++styleToken;
  const stage = $("#stage");
  stage.innerHTML = "";
  const sc = R.sc, pr = sc.pr, W = 880, H = 520;
  const [c, g] = makeCanvas(W, H);
  stage.appendChild(c);
  const cellP = sc.cells.map(cc => ringsPath([cc.info.boundary], p=>pr.x(p), (p,q)=>pr.y(q)));
  const gridP = new Path2D(); cellP.forEach(p => gridP.addPath(p));
  const pxRect = new Map();                      // cell i -> Path2D of counted pixel squares
  const pxSlice = i => {
    const p = new Path2D(), cc = sc.cells[i], nx = sc.d.nx;
    for (let k = 0; k < cc.shown; k++){
      const idx = cc.info.px[k];
      p.rect((idx % nx) * sc.pw, ((idx / nx) | 0) * sc.ph, sc.pw, sc.ph);
    }
    return p;
  };
  const v = panzoom(c, pr.W, pr.H);
  v.fit(0, 0, pr.W, pr.H, 60);
  if (opts.keepV){ Object.assign(v, opts.keepV); v.settle(); }

  const hdr = () => "hex".padEnd(17) + (R.metric + "_m").padStart(6) + "  " + "px".padStart(4);
  const tblApi = makeTable(stage, hdr(),
    i => { const cc = sc.cells[i];
      return `<span class="hx">${cc.info.id}</span>  ` +
        `${String(rasVal(cc, cc.shown)).padStart(6)}  ${String(cc.shown).padStart(4)}`; },
    (i, ft) => { R.hover = i; tblApi.hi(i, ft); },
    { cols: [ { label: "hex" },
              { label: () => R.metric + "_m", get: i => rasVal(sc.cells[i], sc.cells[i].shown) },
              { label: "px",                  get: i => sc.cells[i].shown } ] });
  R.tbl = tblApi;

  meterEl = el("div","meter",
    `<div class="mr lg" id="lg-r"><span>▦ pixels</span><b id="m1">0 B</b></div>` +
    `<div class="mr lg" id="lg-h"><span>⬡ hex rows</span><b id="m2">0 B</b></div>` +
    `<div class="mx" id="m3">pour a cell to compare</div>`);
  stage.appendChild(meterEl);
  meterEl.querySelector("#lg-r").addEventListener("click", () => {
    R.showRaster = !R.showRaster;
    meterEl.querySelector("#lg-r").classList.toggle("off", !R.showRaster);
    if (!R.showRaster) cap.innerHTML =
      "pixels gone · the hex summary (shade = " + R.metric + " elevation) is <b>all that's kept</b>";
  });
  meterEl.querySelector("#lg-h").addEventListener("click", () => {
    R.showHex = !R.showHex;
    meterEl.querySelector("#lg-h").classList.toggle("off", !R.showHex);
    if (!R.showHex) cap.textContent = "hexagons hidden · the raw raster the pipeline starts from";
  });
  meterEl.querySelector("#lg-r").classList.toggle("off", !R.showRaster);
  meterEl.querySelector("#lg-h").classList.toggle("off", !R.showHex);

  function meter(){
    let pxN = 0, cells = 0;
    for (const cc of sc.cells){ if (cc.shown){ pxN += cc.shown; cells++; } }
    meterEl.querySelector("#m1").textContent = kb(pxN * PX_BYTES) + (pxN ? ` (${fmt(pxN)})` : "");
    meterEl.querySelector("#m2").textContent = kb(cells * RASROW_BYTES) + (cells ? ` (${fmt(cells)})` : "");
    const m3 = meterEl.querySelector("#m3");
    if (!pxN){ m3.textContent = "pour a cell to compare"; return; }
    const ratio = (pxN * PX_BYTES) / (cells * RASROW_BYTES);
    m3.textContent = ratio >= 1 ? `rows are ×${ratio.toFixed(ratio < 10 ? 1 : 0)} smaller`
                                : `rows are ×${(1/ratio).toFixed(1)} BIGGER · res too fine`;
    m3.classList.toggle("neg", ratio < 1);
  }
  R.meter = meter;

  fabEl = el("button", "sw fab", "⚡ pour every cell");
  stage.appendChild(fabEl);
  hintEl = el("span", "fabhint", "🖌 or hold ⇧ and sweep to paint");
  stage.appendChild(hintEl);

  api = {
    canvas: c, v, hitPaths: cellP,
    row: i => tblApi.row(i, sc.cells[i].info.id),
    hi: tblApi.hi,
    frame(){
      g.clearRect(0,0,W,H);
      withV(g, v, () => {
        if (R.showRaster){
          g.imageSmoothingEnabled = false;
          g.drawImage(sc.img, 0, 0, pr.W, pr.H);
        } else { g.fillStyle = "#fffdf8"; g.fillRect(0, 0, pr.W, pr.H); }
        if (!R.showHex) return;
        g.strokeStyle = "rgba(110,38,8,.3)"; g.lineWidth = .8/v.s; g.stroke(gridP);
        sc.cells.forEach((cc,i)=>{
          if (!cc.shown) return;
          const t = quantT(rasVal(cc, cc.shown), sc.sortedVals[R.metric]);
          g.fillStyle = ramp(t, R.showRaster ? .5 : .55 + .4 * t);
          g.fill(cellP[i]);
          if (R.showRaster){
            let p = R.anim.has(i) ? pxSlice(i) : pxRect.get(i);
            if (!p){ p = pxSlice(i); if (cc.done) pxRect.set(i, p); }
            // the pixels that went in: a soft orange wash, thin grid only when
            // zoomed in enough for it to read (avoids the busy overview mesh)
            g.fillStyle = "rgba(217,100,44,.22)"; g.fill(p);
            if (v.s > 3){ g.strokeStyle = "rgba(217,100,44,.4)"; g.lineWidth = .4/v.s; g.stroke(p); }
          }
          g.strokeStyle = R.anim.has(i) ? "#d9642c" : ramp(Math.max(t, .25), 1);
          g.lineWidth = (R.anim.has(i) ? 2.4 : 1.6)/v.s;
          g.stroke(cellP[i]);
        });
        if (R.hover >= 0){
          const hc = sc.cells[R.hover];
          g.strokeStyle = "#28231a"; g.lineWidth = (hc.shown ? 2.6 : 2.2)/v.s;
          if (!hc.shown) g.setLineDash([6/v.s, 4/v.s]);
          g.stroke(cellP[R.hover]); g.setLineDash([]);
        }
      });
    },
  };

  let rasQueued = 0, rasCap = -1;    // rasCap: latest user-poked cell owns the caption
  async function pour(i){
    if (styleToken !== my) return;
    const cc = sc.cells[i];
    if (cc.done || cc.anim){
      if (!--rasQueued) cap.innerHTML = RAS_CAP;   // re-click on a pouring cell: just hand it the caption
      return;
    }
    cc.anim = true; R.anim.add(i);
    const inc = Math.max(1, Math.round(cc.elevs.length / 22));
    for (let s = 0; ; s = Math.min(s + inc, cc.elevs.length)){
      if (styleToken !== my) return;
      cc.shown = s;
      api.row(i); meter();
      if (rasCap === i)
        cap.innerHTML = `pouring <b>${cc.info.id}</b> · ${s} pixels · ${R.metric} ${fmt(rasVal(cc, s))} m`;
      if (s === cc.elevs.length) break;
      await sleep(42);
    }
    cc.anim = false; cc.done = true; R.anim.delete(i);
    if (!--rasQueued) cap.innerHTML = RAS_CAP;
  }
  // each pour runs its own async loop — rapid clicks animate concurrently
  const enq = i => { rasCap = i; rasQueued++; pour(i); };
  const instant = i => {
    const cc = sc.cells[i];
    if (cc.done || cc.anim) return false;
    cc.shown = cc.elevs.length; cc.done = true;
    api.row(i);
    return true;
  };
  R.instantAll = async () => {
    const order = sc.cells.map((_, i) => i).filter(i => !sc.cells[i].done)
      .sort((a, b) => sc.cells[a].c[0] - sc.cells[b].c[0]);
    let n = 0;
    for (const i of order){
      if (styleToken !== my) return;
      instant(i);
      if (++n % 12 === 0){ meter(); await sleep(16); }
    }
    meter();
    fabEl.textContent = "✓ every pixel filed"; fabEl.disabled = true;
    if (!rasQueued)                                  // don't clobber an in-flight manual pour
      cap.innerHTML = `all <b>${fmt(sc.d.nx * sc.d.ny)} pixels</b> filed into <b>${fmt(sc.cells.length)} rows</b> · ` +
        `real parquet: ${kb(sc.rasterBytes)} → ${kb(sc.hexBytes)}`;
  };
  fabEl.addEventListener("click", () => R.instantAll());

  c.addEventListener("pointermove", e => {
    const r = c.getBoundingClientRect();
    S.mouse = [e.clientX - r.left, e.clientY - r.top];
    const h = hitTest(e.clientX - r.left, e.clientY - r.top, R.hover);
    if (e.shiftKey && h >= 0 && instant(h)) meter();
    if (h !== R.hover){
      R.hover = h;
      api.hi(h >= 0 && sc.cells[h].shown ? h : -1);
      if (!rasQueued){
        if (h >= 0 && sc.cells[h].shown){
          const cc = sc.cells[h];
          cap.innerHTML = `<b>${cc.info.id}</b> · ${cc.shown} px · avg ${fmt(cc.info.avg)} m ` +
            `(min ${fmt(cc.info.min)} / max ${fmt(cc.info.max)}) · ${kb(cc.shown * PX_BYTES)} in, ${RASROW_BYTES} B out`;
        } else cap.innerHTML = RAS_CAP;
      }
    }
    c.style.cursor = S.paint ? "crosshair" : h >= 0 && !sc.cells[h].shown ? "pointer" : "grab";
  });
  c.addEventListener("pointerleave", () => {
    R.hover = -1; S.mouse = null; api.hi(-1);
    if (!rasQueued) cap.innerHTML = RAS_CAP;
  });
  c.addEventListener("pointerup", e => {
    if (v.wasDrag()) return;
    const r = c.getBoundingClientRect();
    const i = hitTest(e.clientX - r.left, e.clientY - r.top);
    if (i >= 0 && !sc.cells[i].done) enq(i);
  });

  loop(my);
  meter();
  if (opts.instantTrio){
    sc.trio.forEach(i => instant(i));
    meter();
    cap.innerHTML = RAS_CAP;
  } else {
    // pours run concurrently now — a small stagger keeps the trio's cascade feel
    sc.trio.forEach((i, k) =>
      setTimeout(() => { if (styleToken === my) enq(i); }, k * 320));
  }
}
let rasPrefetching = false;
function prefetchRaster(){
  if (rasPrefetching) return;
  rasPrefetching = true;
  (async () => {
    for (const r of [9, 8, 10]){
      if (tab !== "ras") { rasPrefetching = false; return; }
      if (rasterCache.has(r)) continue;            // never reset the live scene
      const keep = R.sc;
      try { await prepareRaster(r); } catch(e){ rasPrefetching = false; return; }
      R.sc = keep;                                 // restore the live scene
    }
  })();
}
async function switchRaster(newRes, first){
  first = first || !api;                           // fresh tab entry = fresh camera
  const cached = rasterCache.has(newRes);
  if (!cached) cap.textContent = `re-binning the raster at res ${newRes}…`;
  const keepV = !first && api && api.v ? { s: api.v.s, tx: api.v.tx, ty: api.v.ty } : null;
  styleToken++;
  try {
    await prepareRaster(newRes);
    resRas = newRes;
    P.set && P.set("res", String(resRas));
    syncBar();
    mountTerrain({ instantTrio: !first, keepV });
    prefetchRaster();
  } catch(e){
    introToken++;
    cap.textContent = "⚠︎ couldn't load the raster · " + (e.message || e);
  }
}

/* ================================================================ compare tab
   Once everything is a hex table, change detection is ONE JOIN: the same
   patch in two Overture releases, matched row-by-row on the hex id. */
const Cm = { showOld:true, showNew:true, showHex:true, hover:-1, sc:null };
// the two releases get slightly different tints so it reads as two datasets:
// apr = cool blue-grey, may = warm tan. Kept muted per "not a huge difference".
const APR_RGB = "95,120,150", MAY_RGB = "170,130,90";
const cmpCache = new Map();
const cmpFiles = { japan: ["kurashiki_2025-04-23-0.json", "kurashiki_2025-05-21-0.json"],
                   ams: ["ams_2025-04-23-0.json", "ams_2025-05-21-0.json"],
                   assam: ["assam_2025-04-23-0.json", "assam_2025-05-21-0.json"] };
async function prepareCmp(pl, rr){
  const key = pl + "|" + rr;
  if (!cmpCache.has(key)){
    const [dif, dOld, dNew] = await Promise.all([
      callPy({ action:"diff", dataset: pl, res:String(rr) }),
      loadData(cmpFiles[pl][0]),
      loadData(cmpFiles[pl][1]),
    ]);
    const pr = projector(dNew.bbox, 520);
    const ctr = cell => {
      const b = cell.boundary;
      return [b.reduce((s,p)=>s+pr.x(p[0]),0)/b.length, b.reduce((s,p)=>s+pr.y(p[1]),0)/b.length];
    };
    const cells = dif.cells.map(info => ({
      info, delta: info.area_new - info.area_old, shown:false, c: ctr(info) }));
    const sortedAbs = cells.map(c => Math.abs(c.delta)).filter(d => d > 0).sort((a,b)=>a-b);
    const byAbs = cells.slice().sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
    const trio = (sortedAbs.length ? byAbs : cells.slice().sort((a,b)=>b.info.cnt_new-a.info.cnt_new))
      .slice(0,3).map(c => cells.indexOf(c));
    cmpCache.set(key, { cells, trio, pr, allOld: dOld.buildings, allNew: dNew.buildings,
                        sortedAbs, pl, res: rr });
  }
  Cm.sc = cmpCache.get(key);
  Cm.sc.cells.forEach(c => { c.shown = false; });
  Cm.hover = -1;
}
const dStr = d => (d > 0 ? "+" : d < 0 ? "−" : "±") + fmt(Math.abs(d));
const CMP_CAP = "the same place in two Overture Maps releases · click a hexagon to join its row across them";
function mountCompare(opts = {}){

      return `<span class="hx">${cc.info.id}</span>  ` +

    { sql: `SELECT hex, apr.m2, may.m2\nFROM apr <b>FULL JOIN</b> may <b>USING (hex)</b>`,
      sqlDefer: true,      // the chip earns its place once the first join lands
      cols: [ { label: "hex" },

    `<div class="mr lg" id="lg-may"><span><i class="chip" style="background:rgb(${MAY_RGB})"></i>may outlines</span><b id="m2">0 m²</b></div>` +
    `<div class="mx" id="m3">join a cell to compare</div>`);
  stage.appendChild(meterEl);
  const cmpLbl = () => Cm.showOld && Cm.showNew ? CMP_CAP

    : Cm.showNew ? "showing only <b>may</b> (release 2025-05-21) · warm-only buildings are new"
    : "both release layers hidden · just the Δ hexagons remain";

  syncCmpLegend();

  function meter(){

    meterEl.querySelector("#m1").textContent = fmt(ao) + " m²";

  stage.appendChild(fabEl);
