        // empty bar is the same picture as a run that has stalled, so the bar
        // goes back to travelling and the clock says nothing rather than a lie.
        el("bar").removeAttribute("value");
        el("bar").removeAttribute("max");
        el("clock").textContent = "working…";
      }
      el("progressDetail").textContent = job.detail || job.state || "";
    },
  };
  if (P.lang) opts.language = P.lang;
  if (wantSpeakers) {
    opts.diarize = true;
    // The key is LEFT OFF rather than sent as null when the count is to be
    // estimated. The runtime reads undefined, null and "" as the same "I did
    // not say", so all three would work — omitting it is the spelling that
    // cannot be misread as "zero speakers" by anything downstream, and it is
    // what makes `estimatedSpeakers` come back on the reply.
    if (count.n !== null) opts.speakers = count.n;
  }

  try {
    // The resolve REPLACES the live stand-in; it does not append to it.
    // `rec.segments` is the same list `onSegment` was feeding us — the runtime
    // reconciles by count and delivers whatever the tail missed before it
    // resolves — so the two are the same words, and the swap is only how the
    // fields we could not know live (url, duration, language, the speaker
    // legend) arrive. Appending, or merging, would double the transcript.
    result = await fused.ai.transcribe(opts);
    // The tail — last report to resolve — is charged to the stage the run was
    // in when it last reported, which is what the row last said and the only
    // thing there is to go on. In practice that is decoding, since the pre-
    // passes finish before the first determinate tick.
    charge();
    const segs = result.segments || [];
    timing = {
      totalMs: performance.now() - t0,
      preMs: span.pre,
      decodeMs: span.decode,
      // Counted but never named: see `charge`. It is the difference between the
      // total row and the two beneath it, which is where it stays visible.
      unknownMs: span.unknown,
      stages: span.stages.slice(),
      loadMs: pendingLoadMs,          // non-zero only when this run had to load the model
      audioSec: result.duration || (segs.length ? segs[segs.length - 1].end : lastDone),
    };
    pendingLoadMs = 0;
    el("progressCard").classList.add("hidden");
    drawResult();
    el("resultCard").scrollIntoView({ behavior: "smooth", block: "nearest" });
  } catch (err) {
    el("progressCard").classList.add("hidden");
    // Whatever decoded before the run ended is still worth having, and there
    // are two places it can be: on screen already (everything `onSegment`
    // delivered — the runtime settles its last reads BEFORE rejecting, so this
    // list is final by now), and in the `.partial.jsonl` the worker leaves
    // behind on a FAILED run. Prefer whichever is longer, since the file also
    // survives the case where the job row aged out mid-run.
    await keepWhatSurvived(err, live, model);
    // Whether anything survived is a question about `result`, not about the
    // rejection: the salvage above may have found more on disk than this tab
    // ever saw, and on a cancelled run it will usually have found nothing.
    const kept = result && result.partial
      ? " — the " + (result.segments || []).length + " segments that decoded are above, and can be copied or saved as .srt"
      : "";
    if (err.type === "cancelled") {
      notice("Stopped — no transcript file was written" + kept + ".");
    } else if (err.type === "unavailable") {
      notice("<b>Speech recognition is not available on this machine.</b><br>" + esc(err.message), "error");
    } else if (err.type === "model_loading") {
      await watchModelLoad(err.jobId, "Loading the speech model");
      running = false; el("go").disabled = recorder !== null; el("stop").disabled = true;
      return transcribe();                                // weights are resident now
    } else if (err.type === "bad_request") {
      notice("<b>Bad request.</b> " + esc(err.message), "error");
    } else {
      notice("<b>" + esc(err.type || "error") + "</b> — " + esc(err.message) + esc(kept), "error");
    }
  } finally {
    clearInterval(tick);
    // A queued live redraw would fire on the NEXT frame — i.e. after the code
    // above has already put the real (or salvaged) transcript in `result` — and
    // paint the stand-in back over it.
    if (livePending) { cancelAnimationFrame(livePending); livePending = 0; }
    el("elapsed").textContent = "";
    el("split").textContent = "";
    if (running) { running = false; el("go").disabled = recorder !== null; el("stop").disabled = true; }
    refreshRuntime();
  }
}

let pendingLoadMs = 0;   // model load charged to the next transcription's timing

async function watchModelLoad(jobId, title) {
  const loadT0 = performance.now();
  el("progressCard").classList.remove("hidden");
  el("progressTitle").textContent = title;
  el("bar").removeAttribute("value");
  el("clock").textContent = "";
  el("progressDetail").textContent = "downloading weights…";
  try {
    await fused.watchJob(jobId).watch((job) => {
      if (job.total) { el("bar").max = job.total; el("bar").value = job.done || 0; }
      el("clock").textContent = bytes(job.done) + " / " + bytes(job.total);
      el("progressDetail").textContent = job.detail || job.state || "";
    });
  } finally {
    pendingLoadMs = performance.now() - loadT0;
    el("progressCard").classList.add("hidden");
    refreshRuntime();
  }
}

// ── Where the run's time went, as a picture ────────────────────────────────
function drawTiming() {
  const box = el("timing");
  if (!timing || !timing.totalMs) { box.classList.add("hidden"); return; }
  box.classList.remove("hidden");

  const totalSec = timing.totalMs / 1000;
  const preSec = (timing.preMs || 0) / 1000;
  const decodeSec = (timing.decodeMs || 0) / 1000;
  const loadSec = (timing.loadMs || 0) / 1000;
  const audioSec = timing.audioSec || 0;
  const scale = Math.max(audioSec, totalSec, loadSec, 0.001);
  const pct = (v) => (Math.max(v, 0) / scale * 100).toFixed(1) + "%";
  const secs = (v) => (v >= 60 ? clock(v) : v.toFixed(1) + "s");

  const row = (cls, label, value, text) =>
    `<div class="trow"><span class="tlab">${label}</span>` +
    `<div class="ttrack"><div class="tfill ${cls}" style="width:${pct(value)}"></div></div>` +
    `<span class="tval mono">${text}</span></div>`;

  // ×realtime is still measured against the WHOLE run, because that is the wait
  // the user actually sat through — the breakdown underneath is what says how
  // much of it was decoding. A rate against the decode alone would flatter the
  // engine on exactly the recordings the pre-passes dominate.
  const rtf = audioSec > 0 ? audioSec / totalSec : 0;
  // Named stages, when the row named any. A run with none says nothing here
  // rather than inventing a label for time it can only place, not identify.
  const stages = (timing.stages || []).join(", ").toLowerCase().replace(/…/g, "");
  const split = (preSec > 0.05 && decodeSec > 0.05)
    ? " — of which " + secs(preSec) + " before a word was decoded" +
      (stages ? " (" + esc(stages) + ")" : "") + " and " + secs(decodeSec) + " decoding"
    : "";
  box.innerHTML =
    row("audio", "audio", audioSec, secs(audioSec)) +
    row("total", "run", totalSec, secs(totalSec)) +
    (preSec > 0.05 ? row("pre", "pre-pass", preSec, secs(preSec)) : "") +
    (decodeSec > 0.05 ? row("decode", "decode", decodeSec, secs(decodeSec)) : "") +
    (loadSec > 0.05 ? row("load", "model load", loadSec, secs(loadSec)) : "") +
    (rtf
      ? `<div class="rtf"><b>${rtf >= 1 ? rtf.toFixed(1) + "×" : "0" + rtf.toFixed(2).slice(1) + "×"}</b> ` +
        (rtf >= 1
          ? "faster than realtime — " + secs(audioSec) + " of audio in " + secs(totalSec)
          : "of realtime — " + secs(audioSec) + " of audio took " + secs(totalSec)) +
        split +
        (loadSec > 0.05 ? ". Model load: " + secs(loadSec) + ", once per session" : "") +
        "</div>"
      : "");
}

// SRT has no speaker field of its own — every player just draws the cue text —
// so the convention subtitlers use is a name prefix on the line, and that is
// what a diarized transcript exports as. Undiarized runs get the bare text, not
// an empty prefix.
function toSrt(segments) {
  const withSpeakers = isDiarized(result);
  const stamp = (s) => {
    const ms = Math.floor((s % 1) * 1000), t = Math.floor(s);
    return [Math.floor(t / 3600), Math.floor((t % 3600) / 60), t % 60]
      .map((n) => String(n).padStart(2, "0")).join(":") + "," + String(ms).padStart(3, "0");
  };
  return segments.map((s, i) => {
    const prefix = withSpeakers ? speakerName(s.speaker) + ": " : "";
    return (i + 1) + "\n" + stamp(s.start) + " --> " + stamp(s.end) + "\n" +
      prefix + (s.text || "").trim() + "\n";
  }).join("\n");
}

async function saveSrt() {
  if (!result || !(result.segments || []).length) return;
  // ~/Downloads, not beside the recording — a transcript is something the
  // reader takes away from this page, so it belongs where every other browser
  // download lands. A name clash there gets numbered rather than overwritten
  // or blocked on a confirm(), matching how downloads already behave.
  const name = (P.file.split(/[\\/]/).pop() || "transcript").replace(/\.[^./]+$/, "");
  const body = toSrt(result.segments);
  try {
    const { path } = await fused.runPython("./save_srt.py", { name, body }, { key: null });
    notice("Wrote <span class='mono'>" + esc(path) + "</span>");
  } catch (err) {
    notice("<b>Could not write the .srt</b> — " + esc(err.message), "error");
  }
}

// ── Draw: read params, reflect them into the controls ──────────────────────
function draw() {
  const path = P.file;
  el("path").value = path;
  el("task").value = P.task;
  el("lang").value = P.lang;
  // …and then whichever of those two the active engine refuses is disabled and
  // explained. After the values are reflected, because it may move them.
  syncEngineOptions();
  el("vad").checked = P.vad;
  el("diarize").checked = P.diarize;
  el("speakers").value = P.speakers;
  syncDiarize();
  // Open the collapsed section by itself when a bookmarked/typed URL already
  // carries a non-default value in it — otherwise a saved setting would sit
  // hidden behind a collapsed summary the user never thinks to expand.
  if (P.task !== "transcribe" || P.lang || P.vad || P.diarize) el("advSettings").open = true;
  el("q").value = P.q;
  // A URL can carry a source this build doesn't offer; land on the mode the
  // capture code would actually use rather than leaving the select blank.
  el("source").value = CAPTURE[P.source] ? P.source : "mic";
  syncSourceHints();
  // The input picker only means anything when a mic is part of the capture;
  // desktop- and tab-only audio come from a loopback device or the share picker.
  el("deviceWrap").classList.toggle("hidden", !captureMode(P.source).mic);
  if (el("model").options.length) {
    el("model").value = P.model || el("model").value;
    syncModelMeta();
  }

  el("selName").textContent = path || "Nothing selected.";
  const player = el("player");
  if (path) {
    const url = fused.rawUrl(path);
    if (player.getAttribute("src") !== url) { player.src = url; }
    player.classList.remove("hidden");
    verifySelection(path);
  } else {
    player.classList.add("hidden");
  }
  drawFiles();
  drawResult();
}

// A bookmarked URL can name a file that has since moved or been deleted — say so
// rather than showing a player pointed at nothing.
let verifySeq = 0;
async function verifySelection(path) {
  const seq = ++verifySeq;
  try {
    await fused.stat(path);
  } catch (err) {
    if (seq !== verifySeq || path !== P.file) return;      // selection moved on
    el("player").classList.add("hidden");
    el("selName").innerHTML = "<span style='color:var(--err)'>Not on disk any more:</span> " + esc(path);
  }
}

// ── Wiring: controls write params, onChange redraws ────────────────────────
el("path").addEventListener("change", () => fused.params.set("file", el("path").value.trim()));
el("rescan").addEventListener("click", scan);
el("task").addEventListener("change", () => fused.params.set("task", el("task").value));
el("lang").addEventListener("change", () => fused.params.set("lang", el("lang").value));
el("vad").addEventListener("change", () => fused.params.set("vad", el("vad").checked ? "1" : "0"));
el("diarize").addEventListener("change", () => fused.params.set("diarize", el("diarize").checked ? "1" : "0"));
// Typing shows the verdict live; leaving the field is when the value is CLAMPED
// and written, so the URL only ever carries a count the runtime would accept —
// a param a bookmark can restore into a submit.
el("speakers").addEventListener("input", syncDiarize);
el("speakers").addEventListener("change", () => {
  const raw = el("speakers").value.trim();
  // Empty STAYS empty — it is the request to estimate, not a hole for a default
  // to fill. A number input also reports "" for typed junk, so junk lands on
  // "estimate" as well; that is visible rather than silent, because the note
  // under the field then says the count will be estimated.
  const typed = raw === "" ? NaN : Number(raw);
  // Clamping, not rejecting, for a number that is merely out of range: 0 or 300
  // is a count someone meant, and the nearest one the runtime accepts is a
  // better answer than a red note over an empty submit. Junk is the case that
  // has no nearest value, and it falls through to estimating.
  const count = speakerCount();
  const n = count.ok && count.n !== null ? String(count.n)
    : Number.isFinite(typed) ? String(Math.min(MAX_SPEAKERS, Math.max(1, Math.round(typed))))
    : "";
  el("speakers").value = n;
  fused.params.set("speakers", n);
  // Resync directly: when the clamp lands on the value the param ALREADY holds
  // (type junk over a 2 and it clamps back to 2), `set` applies no change and
  // fires no onChange — and the note would sit there in red under a field that
  // is now perfectly valid.
  syncDiarize();
});
el("model").addEventListener("change", () => fused.params.set("asrModel", el("model").value));
el("q").addEventListener("input", () => fused.params.set("q", el("q").value));
el("viewSegments").addEventListener("click", () => fused.params.set("view", "segments"));
el("viewText").addEventListener("click", () => fused.params.set("view", "text"));
el("go").addEventListener("click", transcribe);
el("rec").addEventListener("click", () => (recorder ? stopRecording() : startRecording()));
el("source").addEventListener("change", () => fused.params.set("source", el("source").value));
el("device").addEventListener("change", () => fused.params.set("device", el("device").value));
el("devices").addEventListener("click", listDevices);

el("stop").addEventListener("click", async () => {
  // cancel() defaults to text-generation, so the capability must be named.
  el("stop").disabled = true;
  try { await fused.ai.cancel(ASR); } catch (err) { notice("Stop failed — " + esc(err.message), "error"); }
});

// What Copy puts on the clipboard: the same thing the Plain text view shows —
// turn-grouped and named when the run was diarized, the model's own joined text
// when it wasn't. Copying a diarized transcript as an unattributed wall of
// words would throw away the half of it the reader just named.
function transcriptText() {
  if (!result) return "";
  const segs = result.segments || [];
  if (!isDiarized(result) || !segs.length) return result.text || "";
  return speakerTurns(segs).map((t) => speakerName(t.who) + ": " + t.text).join("\n\n");
}

el("copy").addEventListener("click", async () => {
  if (!result) return;
  try {
    await navigator.clipboard.writeText(transcriptText());
    el("copy").textContent = "Copied";
    setTimeout(() => (el("copy").textContent = "Copy"), 1200);
  } catch (err) {
    notice("Clipboard blocked — the transcript is also on disk at <span class='mono'>" + esc(result.outputText || result.output || "") + "</span>");
  }
});

el("srt").addEventListener("click", saveSrt);

el("load").addEventListener("click", async () => {
  if (!IS_LOCAL) return;
  el("load").disabled = true;
  try {
    // The capability travels with the request. Without it the API defaults to
    // text generation, so a speech repo is handed to the chat runner and the
    // load fails with "No safetensors found" — a message about a model that is
    // perfectly fine, from a runner that was never meant to read it.
    const { jobId } = await fused.ai.models.load(el("model").value, { capability: ASR });
    await watchModelLoad(jobId, "Preloading " + el("model").value);
  } catch (err) {
    notice("<b>" + esc(err.type || "error") + "</b> — " + esc(err.message), "error");
  } finally {
    // Not a blanket re-enable: whether Preload is offered again depends on what
    // is resident NOW, which refreshRuntime has just re-read.
    await refreshRuntime();
  }
});

el("unload").addEventListener("click", async () => {
  if (!IS_LOCAL) return;
  el("notices").innerHTML = "";
  try {
    // By capability, not by id: another page may have loaded something else.
    const { stopped } = await fused.ai.models.unload({ capability: ASR });
    // Said out loud, because the silent version is indistinguishable from a
    // dead button: an unload with nothing resident is a no-op, and the status
    // line beside it already read "nothing resident" before the click.
    notice(stopped
      ? "<b>Unloaded.</b> The speech model has released its memory."
      : "<b>Nothing to unload.</b> No speech model was resident.");
  } catch (err) {
    notice("<b>" + esc(err.type || "error") + "</b> — " + esc(err.message), "error");
  }
  refreshRuntime();
});

el("player").addEventListener("timeupdate", syncActiveSegment);

fused.params.onChange(draw);

(async function init() {
  if (!IS_LOCAL) {
    notice("<b>This demo is local-only.</b> An exported copy has no speech runner to call.", "error");
  }
  await fillModels();
  await listDevices();
  draw();
  await refreshRuntime();
  if (IS_LOCAL && asrRunner === null) {
    notice("<b>This fused-render build has no speech runner.</b> " +
      "<span class='mono'>fused.ai.transcribe</span> needs one of the three that serve this " +
      "capability — MLX Whisper or Parakeet TDT on Apple Silicon, faster-whisper (CTranslate2) " +
      "anywhere — and this build registers none of them.", "error");
  }
  scan();
})();
</script>
</body>
</html>
