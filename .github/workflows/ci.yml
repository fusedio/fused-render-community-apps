name: ci

# Checks every app folder against CONTRIBUTING.md (required files, slug,
# metadata.json, size caps, no symlinks). Nothing is generated or committed:
# the marketplace reads each app's own metadata.json from its clone of this
# repo, so there is no index.json to build.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/validate_apps.py
