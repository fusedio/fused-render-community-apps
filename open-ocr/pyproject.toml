[project]
name = "open-ocr"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mlx-vlm>=0.7",
    "pillow>=11",
    "numpy>=1.26",
    "pymupdf>=1.24",
    # Apple Vision OCR mode -- on-device, no model download.
    "pyobjc-framework-Cocoa>=10",
    "pyobjc-framework-Quartz>=10",
    "pyobjc-framework-Vision>=10",
]

[tool.fused-render.app]
main = "worker.py"
idle_timeout_s = 3600

[tool.uv]
package = false
